              variant="outline"
              onClick={logout}
              style={{
                width: '100%',
                fontSize: '12px',
                padding: '8px',
                color: COLORS.text,
                borderColor: COLORS.border,
              }}
            >
              Выход
            </Button>
          </div>
        </div>
      );
    };

    const Header = ({ title }) => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [showQuick, setShowQuick]   = useState(false);
      const [quickTab, setQuickTab]     = useState('manual'); // 'manual' | 'templates'
      const [accounts, setAccounts]     = useState([]);
      const [templates, setTemplates]   = useState([]);
      const [tplsLoaded, setTplsLoaded] = useState(false);
      const [saving, setSaving]         = useState(false);
      const [applyingId, setApplyingId] = useState(null);
      const [toast, setToast]           = useState(null);
      const [form, setForm] = useState({
        description: '', amount: '', type: 'expense',
        date: new Date().toISOString().split('T')[0], account_id: '',
      });

      const openQuick = async () => {
        // Грузим счета если нужно
        if (accounts.length === 0) {
          const res = await apiCall('get', `/companies/${companyId}/accounts`);
          if (res.success) {
            const list = res.data.accounts || [];
            setAccounts(list);
            if (list.length > 0) setForm(f => ({ ...f, account_id: list[0].id }));
          }
        }
        // Грузим шаблоны если нужно
        if (!tplsLoaded) {
          const res = await apiCall('get', `/companies/${companyId}/templates/`);
          if (res.success) { setTemplates(res.data.templates || []); setTplsLoaded(true); }
        }
        setForm(f => ({ ...f, date: new Date().toISOString().split('T')[0] }));
        setShowQuick(true);
      };

      const handleSave = async () => {
        if (!form.description.trim() || !form.amount || !form.account_id) {
          setToast({ type: 'error', message: 'Заполните все поля' }); return;
        }
        setSaving(true);
        const res = await apiCall('post', `/companies/${companyId}/transactions`, {
          account_id: form.account_id,
          description: form.description.trim(),
          amount: parseFloat(form.amount),
          transaction_type: form.type === 'income' ? 'INCOME' : 'EXPENSE',
          payment_date: form.date,
        });
        setSaving(false);
        if (res.success) {
          setToast({ type: 'success', message: '✅ Операция добавлена' });
          setShowQuick(false);
          setForm({ description: '', amount: '', type: 'expense', date: new Date().toISOString().split('T')[0], account_id: accounts[0]?.id || '' });
        } else setToast({ type: 'error', message: res.error });
      };

      const handleApplyTpl = async (tpl) => {
        setApplyingId(tpl.id);
        const res = await apiCall('post', `/companies/${companyId}/templates/${tpl.id}/apply`, {
          payment_date: new Date().toISOString().split('T')[0],
        });
        setApplyingId(null);
        if (res.success) {
          setToast({ type: 'success', message: `✅ ${tpl.name} — ${formatCurrency(res.data.amount)}` });
          setShowQuick(false);
        } else setToast({ type: 'error', message: res.error });
      };

      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setShowQuick(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <>
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
          <div style={{
            height: '64px', background: COLORS.white,
            borderBottom: `1px solid ${COLORS.border}`,
            display: 'flex', alignItems: 'center',
            paddingLeft: '32px', paddingRight: '24px',
            gap: '12px',
          }}>
            <h1 style={{ fontSize: '18px', fontWeight: 600, color: COLORS.text, flex: 1 }}>{title}</h1>
            <SearchModal />
            {canWrite('transactions') && <button onClick={openQuick} style={{
              display: 'flex', alignItems: 'center', gap: '8px',
              padding: '9px 18px', borderRadius: '8px', border: 'none',
              background: COLORS.accent, color: '#fff', cursor: 'pointer',
              fontWeight: 600, fontSize: '14px', fontFamily: 'Inter, sans-serif',
              boxShadow: '0 2px 8px rgba(91,91,214,0.3)', transition: 'background 0.2s',
            }}
              onMouseEnter={e => e.currentTarget.style.background = '#4A4AC4'}
              onMouseLeave={e => e.currentTarget.style.background = COLORS.accent}
            >
              <span style={{ fontSize: '18px', lineHeight: 1 }}>＋</span> Операция
            </button>}
          </div>

          {showQuick && (
            <>
              <div onClick={() => setShowQuick(false)} style={{ position: 'fixed', inset: 0, zIndex: 9990 }} />
              <div style={{
                position: 'fixed', top: '72px', right: '24px', zIndex: 9991,
                width: '360px', background: COLORS.white, borderRadius: '14px',
                boxShadow: '0 8px 32px rgba(0,0,0,0.18)',
                border: `1px solid ${COLORS.border}`, animation: 'slideIn 0.15s ease-out',
                overflow: 'hidden',
              }}>
                {/* Табы */}
                <div style={{ display: 'flex', borderBottom: `1px solid ${COLORS.border}` }}>
                  {[['manual','⚡ Вручную'], ['templates','📋 Шаблоны']].map(([id, label]) => (
                    <button key={id} onClick={() => setQuickTab(id)} style={{
                      flex: 1, padding: '13px', border: 'none', cursor: 'pointer',
                      fontWeight: 600, fontSize: '13px', fontFamily: 'Inter, sans-serif',
                      background: quickTab === id ? COLORS.white : COLORS.grayLight,
                      color: quickTab === id ? COLORS.accent : COLORS.textSecondary,
                      borderBottom: quickTab === id ? `2px solid ${COLORS.accent}` : '2px solid transparent',
                      transition: 'all 0.15s',
                    }}>{label}</button>
                  ))}
                </div>

                <div style={{ padding: '20px' }}>
                  {/* ── Таб: Вручную ── */}
                  {quickTab === 'manual' && (
                    <>
                      <div style={{ display: 'flex', borderRadius: '8px', overflow: 'hidden', border: `1.5px solid ${COLORS.border}`, marginBottom: '14px' }}>
                        {[['expense','📉 Расход'], ['income','📈 Доход']].map(([val, label]) => (
                          <button key={val} onClick={() => setForm(f => ({ ...f, type: val }))} style={{
                            flex: 1, padding: '9px', border: 'none', cursor: 'pointer', fontWeight: 600,
                            fontSize: '13px', fontFamily: 'Inter, sans-serif', transition: 'all 0.15s',
                            background: form.type === val ? (val === 'income' ? '#dcfce7' : '#fee2e2') : '#fff',
                            color: form.type === val ? (val === 'income' ? COLORS.green : COLORS.red) : COLORS.textSecondary,
                          }}>{label}</button>
                        ))}
                      </div>

                      <div style={{ position: 'relative', marginBottom: '12px' }}>
                        <span style={{ position: 'absolute', left: '14px', top: '50%', transform: 'translateY(-50%)', fontSize: '18px', color: COLORS.textSecondary, fontWeight: 600 }}>₽</span>
                        <input type="number" placeholder="0" value={form.amount}
                          onChange={e => setForm(f => ({ ...f, amount: e.target.value }))}
                          autoFocus
                          style={{ width: '100%', padding: '12px 14px 12px 36px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '20px', fontWeight: 700, fontFamily: 'Inter, sans-serif', boxSizing: 'border-box', outline: 'none' }}
                          onFocus={e => e.target.style.borderColor = COLORS.accent}
                          onBlur={e => e.target.style.borderColor = COLORS.border}
                          onKeyDown={e => e.key === 'Enter' && handleSave()} />
                      </div>

                      <input type="text" placeholder="Описание операции" value={form.description}
                        onChange={e => setForm(f => ({ ...f, description: e.target.value }))}
                        style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif', marginBottom: '10px', boxSizing: 'border-box', outline: 'none' }}
                        onFocus={e => e.target.style.borderColor = COLORS.accent}
                        onBlur={e => e.target.style.borderColor = COLORS.border}
                        onKeyDown={e => e.key === 'Enter' && handleSave()} />

                      <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
                        <select value={form.account_id} onChange={e => setForm(f => ({ ...f, account_id: e.target.value }))}
                          style={{ flex: 1, padding: '9px 10px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '13px', fontFamily: 'Inter, sans-serif', background: '#fff' }}>
                          {accounts.map(a => <option key={a.id} value={a.id}>💳 {a.name}</option>)}
                        </select>
                        <input type="date" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))}
                          style={{ width: '130px', padding: '9px 10px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '13px', fontFamily: 'Inter, sans-serif' }} />
                      </div>

                      <div style={{ display: 'flex', gap: '8px' }}>
                        <button onClick={() => setShowQuick(false)} style={{ flex: 1, padding: '10px', borderRadius: '8px', border: `1.5px solid ${COLORS.border}`, background: '#fff', cursor: 'pointer', fontWeight: 500, fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>Отмена</button>
                        <button onClick={handleSave} disabled={saving} style={{ flex: 2, padding: '10px', borderRadius: '8px', border: 'none', background: saving ? '#94a3b8' : COLORS.accent, color: '#fff', cursor: saving ? 'not-allowed' : 'pointer', fontWeight: 600, fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                          {saving ? '⏳ Сохраняю...' : '✓ Сохранить'}
                        </button>
                      </div>
                      <div style={{ marginTop: '8px', fontSize: '11px', color: COLORS.textSecondary, textAlign: 'center' }}>Enter — сохранить · Esc — закрыть</div>
                    </>
                  )}

                  {/* ── Таб: Шаблоны ── */}
                  {quickTab === 'templates' && (
                    <>
                      {templates.length === 0 ? (
                        <div style={{ textAlign: 'center', padding: '24px 0', color: COLORS.textSecondary }}>
                          <div style={{ fontSize: '32px', marginBottom: '10px' }}>📋</div>
                          <div style={{ fontWeight: 500, marginBottom: '4px' }}>Шаблонов нет</div>
                          <div style={{ fontSize: '12px' }}>Создайте шаблоны на странице</div>
                          <button onClick={() => { setShowQuick(false); window.location.hash = '#templates'; }}
                            style={{ marginTop: '12px', padding: '8px 16px', borderRadius: '8px', border: `1px solid ${COLORS.accent}`, background: COLORS.blueLight, color: COLORS.accent, cursor: 'pointer', fontSize: '13px', fontWeight: 600, fontFamily: 'Inter, sans-serif' }}>
                            Перейти к шаблонам →
                          </button>
                        </div>
                      ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', maxHeight: '300px', overflowY: 'auto' }}>
                          {templates.map(tpl => {
                            const isApplying = applyingId === tpl.id;
                            return (
                              <div key={tpl.id} style={{
                                display: 'flex', alignItems: 'center', gap: '10px',
                                padding: '10px 12px', borderRadius: '10px',
                                border: `1px solid ${COLORS.border}`, background: COLORS.grayLight,
                              }}>
                                <div style={{ flex: 1, minWidth: 0 }}>
                                  <div style={{ fontWeight: 600, fontSize: '13px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{tpl.name}</div>
                                  <div style={{ fontSize: '13px', fontWeight: 700, color: tpl.transaction_type === 'income' ? COLORS.green : COLORS.red, marginTop: '2px' }}>
                                    {tpl.transaction_type === 'income' ? '+' : '-'}{formatCurrency(tpl.amount)}
                                  </div>
                                </div>
                                <button onClick={() => handleApplyTpl(tpl)} disabled={isApplying} style={{
                                  padding: '7px 14px', borderRadius: '7px', border: 'none', flexShrink: 0,
                                  background: isApplying ? '#94a3b8' : COLORS.accent,
                                  color: '#fff', cursor: isApplying ? 'not-allowed' : 'pointer',
                                  fontWeight: 600, fontSize: '12px', fontFamily: 'Inter, sans-serif',
                                }}>
                                  {isApplying ? '⏳' : '⚡ Применить'}
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      )}
                      <button onClick={() => setShowQuick(false)} style={{ width: '100%', marginTop: '14px', padding: '9px', borderRadius: '8px', border: `1.5px solid ${COLORS.border}`, background: '#fff', cursor: 'pointer', fontWeight: 500, fontSize: '13px', fontFamily: 'Inter, sans-serif' }}>Закрыть</button>
                    </>
                  )}
                </div>
              </div>
            </>
          )}
        </>
      );
    };

    const Layout = ({ children, currentPage }) => {
      const titles = {
        dashboard: 'Дашборд',
        transactions: 'Операции',
        templates: 'Шаблоны операций',
        calendar: 'Платёжный календарь',
        reports: 'Отчёты',
        analytics: 'Аналитика',
        'ai-parser': 'AI Парсер транзакций',
        alerts: 'Алерты и правила',
        'auto-rules': 'Правила авто-категоризации',
        debts: 'Реестр долгов',
        counterparties: 'Контрагенты',
        projects: 'Проекты',
        crm: 'CRM — Воронка продаж',
        budgets: 'Бюджеты',
        'payment-requests': 'Заявки на оплату',
        payroll: 'Сотрудники и ФОТ',
        assets: 'Основные средства',
        banks: 'Банки',
        documents: 'Документы',
        loans: 'Займы и кредиты',
        taxes: 'Налоги',
        accruals: 'Начисления',
        settings: 'Настройки',
      };

      return (
        <div style={{ display: 'flex', height: '100vh' }}>
          <Sidebar currentPage={currentPage} onNavigate={() => {}} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            <Header title={titles[currentPage] || 'Axiom Finance'} />
            <div style={{ flex: 1, overflowY: 'auto', background: COLORS.bg }}>
              {children}
            </div>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────
    // Правила авто-категоризации
    // ─────────────────────────────────────────────────────────
    const AutoRulesPage = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [rules, setRules]           = useState([]);
      const [categories, setCategories] = useState([]);
      const [loading, setLoading]       = useState(true);
      const [toast, setToast]           = useState(null);
      const [showModal, setShowModal]   = useState(false);
      const [editingRule, setEditingRule] = useState(null);
      const [applyResult, setApplyResult] = useState(null);
      const [applying, setApplying]     = useState(false);
      const [previewMatches, setPreviewMatches] = useState(null);

      const emptyForm = { name:'', field_to_match:'description', match_type:'contains', pattern:'', suggested_category_id:'', priority:0, is_active:true };
      const [form, setForm] = useState(emptyForm);

      const FIELDS = [
        { value:'description',      label:'Описание операции' },
        { value:'counterparty_name',label:'Контрагент' },
        { value:'counterparty_inn', label:'ИНН контрагента' },
      ];
      const TYPES = [
        { value:'contains', label:'Содержит' },
        { value:'exact',    label:'Точное совпадение' },
        { value:'regex',    label:'Регулярное выражение' },
      ];

      const load = async () => {
        setLoading(true);
        const [r1, r2] = await Promise.all([
          apiCall('GET', `/companies/${companyId}/auto-rules/`),
          apiCall('GET', `/companies/${companyId}/categories`),
        ]);
        if (r1.success) setRules(r1.data.rules || []);
        if (r2.success) setCategories(r2.data.categories || (Array.isArray(r2.data) ? r2.data : []));
        setLoading(false);
      };

      useEffect(() => { if (companyId) load(); }, [companyId]);

      const openCreate = () => { setEditingRule(null); setForm(emptyForm); setPreviewMatches(null); setShowModal(true); };
      const openEdit   = (r) => {
        setEditingRule(r);
        setForm({ name:r.name, field_to_match:r.field_to_match, match_type:r.match_type, pattern:r.pattern,
          suggested_category_id: r.suggested_category_id||'', priority:r.priority, is_active:r.is_active });
        setPreviewMatches(null); setShowModal(true);
      };

      const handleSave = async () => {
        if (!form.name || !form.pattern) { setToast({type:'error',message:'Заполните название и паттерн'}); return; }
        const payload = { ...form, priority: parseInt(form.priority)||0,
          suggested_category_id: form.suggested_category_id || null };
        const res = editingRule
          ? await apiCall('PATCH', `/companies/${companyId}/auto-rules/${editingRule.id}`, payload)
          : await apiCall('POST',  `/companies/${companyId}/auto-rules/`, payload);
        if (res.success) {
          setToast({type:'success', message: editingRule ? 'Правило обновлено' : 'Правило создано'});
          setShowModal(false); load();
        } else setToast({type:'error', message:res.error});
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить правило?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/auto-rules/${id}`);
        if (res.success) { setToast({type:'success',message:'Удалено'}); load(); }
        else setToast({type:'error',message:res.error});
      };

      const handleToggle = async (rule) => {
        const res = await apiCall('PATCH', `/companies/${companyId}/auto-rules/${rule.id}`, { is_active: !rule.is_active });
        if (res.success) load();
      };

      const handleApplyAll = async () => {
        if (!confirm('Применить все активные правила к транзакциям без категории?')) return;
        setApplying(true);
        const res = await apiCall('POST', `/companies/${companyId}/auto-rules/apply-all?only_uncategorized=true`);
        setApplying(false);
        if (res.success) {
          setApplyResult(res.data);
          setToast({type:'success', message:`Обновлено ${res.data.updated} транзакций`});
        } else setToast({type:'error', message:res.error});
      };

      const handlePreview = async () => {
        if (!form.pattern) return;
        const payload = { ...form, priority: parseInt(form.priority)||0, suggested_category_id: form.suggested_category_id||null };
        const res = await apiCall('POST', `/companies/${companyId}/auto-rules/preview`, payload);
        if (res.success) setPreviewMatches(res.data);
      };

      if (loading) return <LoadingSpinner />;

      const fieldLabel  = (v) => FIELDS.find(f=>f.value===v)?.label || v;
      const typeLabel   = (v) => TYPES.find(t=>t.value===v)?.label  || v;
      const catName     = (id) => categories.find(c=>c.id===id)?.name || '—';

      return (
        <div style={{ padding:'24px' }}>
          {toast && <Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)} />}

          {/* Шапка */}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px', flexWrap:'wrap', gap:'12px' }}>
            <div>
              <div style={{ fontSize:'13px', color:COLORS.textSecondary }}>
                Правила автоматически назначают категорию транзакциям по ключевым словам
              </div>
            </div>
            <div style={{ display:'flex', gap:'10px' }}>
              {canWrite('auto-rules') && <Button variant="outline" onClick={handleApplyAll} disabled={applying}>
                {applying ? '⏳ Применение...' : '▶ Применить ко всем'}
              </Button>}
              {canWrite('auto-rules') && <Button onClick={openCreate}>+ Новое правило</Button>}
            </div>
          </div>

          {/* Результат применения */}
          {applyResult && (
            <div style={{ background:'#f0fdf4', border:'1px solid #bbf7d0', borderRadius:'12px', padding:'16px 20px', marginBottom:'20px' }}>
              <div style={{ fontWeight:700, color:COLORS.green, marginBottom:'8px' }}>
                ✅ Обновлено {applyResult.updated} из {applyResult.total_checked} транзакций
              </div>
              {applyResult.details?.slice(0,5).map((d,i) => (
                <div key={i} style={{ fontSize:'13px', color:COLORS.textSecondary, marginBottom:'3px' }}>
                  • {d.description} → {d.rule_name}
                </div>
              ))}
              {applyResult.details?.length > 5 && <div style={{ fontSize:'12px', color:COLORS.textSecondary }}>…ещё {applyResult.details.length-5}</div>}
            </div>
          )}

          {/* Список правил */}
          {rules.length === 0 ? (
            <div style={{ background:COLORS.white, borderRadius:'16px', padding:'60px 32px', textAlign:'center', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
              <div style={{ fontSize:'40px', marginBottom:'12px' }}>🤖</div>
              <div style={{ fontSize:'16px', fontWeight:600, marginBottom:'8px' }}>Правил пока нет</div>
              <div style={{ color:COLORS.textSecondary, fontSize:'14px', marginBottom:'20px' }}>
                Создайте правило, например:<br/>
                если описание содержит «аренда» → категория «Аренда офиса»
              </div>
              <Button onClick={openCreate}>Создать первое правило</Button>
            </div>
          ) : (
            <div style={{ background:COLORS.white, borderRadius:'14px', overflow:'hidden', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
              <div style={{ padding:'12px 20px', background:COLORS.grayLight, borderBottom:`1px solid ${COLORS.border}`,
                display:'grid', gridTemplateColumns:'2fr 1.5fr 1.5fr 1.5fr 80px 80px', gap:'8px',
                fontSize:'12px', fontWeight:700, color:COLORS.textSecondary, textTransform:'uppercase' }}>
                <span>Название / паттерн</span><span>Поле</span><span>Тип</span><span>Категория</span><span>Приоритет</span><span>Действия</span>
              </div>
              {rules.map(r => (
                <div key={r.id} style={{ padding:'14px 20px', borderBottom:`1px solid ${COLORS.border}`,
                  display:'grid', gridTemplateColumns:'2fr 1.5fr 1.5fr 1.5fr 80px 80px', gap:'8px', alignItems:'center',
                  opacity: r.is_active ? 1 : 0.5 }}>
                  <div>
                    <div style={{ fontWeight:600, fontSize:'14px', marginBottom:'3px' }}>{r.name}</div>
                    <code style={{ fontSize:'12px', background:'#f1f5f9', padding:'2px 7px', borderRadius:'4px', color:COLORS.accent }}>{r.pattern}</code>
                  </div>
                  <div style={{ fontSize:'13px', color:COLORS.textSecondary }}>{fieldLabel(r.field_to_match)}</div>
                  <div style={{ fontSize:'13px', color:COLORS.textSecondary }}>{typeLabel(r.match_type)}</div>
                  <div style={{ fontSize:'13px', fontWeight:500 }}>{r.category_name || '—'}</div>
                  <div style={{ fontSize:'13px', textAlign:'center', color:COLORS.textSecondary }}>{r.priority}</div>
                  <div style={{ display:'flex', gap:'6px', alignItems:'center' }}>
                    {/* Toggle */}
                    <div onClick={()=>handleToggle(r)} title={r.is_active?'Деактивировать':'Активировать'}
                      style={{ width:'36px', height:'20px', borderRadius:'10px', background:r.is_active?COLORS.accent:'#cbd5e1',
                        position:'relative', cursor:'pointer', transition:'background 0.2s', flexShrink:0 }}>
                      <div style={{ position:'absolute', top:'3px', left:r.is_active?'19px':'3px', width:'14px', height:'14px',
                        borderRadius:'50%', background:'#fff', transition:'left 0.2s' }} />
                    </div>
                    {canWrite('auto-rules') && <button onClick={()=>openEdit(r)} style={{ background:'none',border:'none',cursor:'pointer',fontSize:'15px',color:COLORS.accent }}>✎</button>}
                    {canDelete() && <button onClick={()=>handleDelete(r.id)} style={{ background:'none',border:'none',cursor:'pointer',fontSize:'15px',color:COLORS.red }}>🗑</button>}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Модал создания/редактирования */}
          {showModal && (
            <div style={{ position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000 }}
              onClick={e=>{if(e.target===e.currentTarget)setShowModal(false)}}>
              <div style={{ background:COLORS.white,borderRadius:'16px',padding:'28px',width:'520px',maxHeight:'90vh',overflowY:'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
                <h3 style={{ fontSize:'18px',fontWeight:700,marginBottom:'20px' }}>{editingRule?'Редактировать правило':'Новое правило'}</h3>

                <div style={{ marginBottom:'14px' }}>
                  <label style={{ display:'block',marginBottom:'6px',fontWeight:500,fontSize:'14px' }}>Название *</label>
                  <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Например: Аренда офиса"
                    style={{ width:'100%',padding:'10px 14px',border:`1.5px solid ${COLORS.border}`,borderRadius:'8px',fontSize:'14px',fontFamily:'Onest,sans-serif',boxSizing:'border-box' }} />
                </div>

                <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'14px' }}>
                  <div>
                    <label style={{ display:'block',marginBottom:'6px',fontWeight:500,fontSize:'14px' }}>Поле *</label>
                    <select value={form.field_to_match} onChange={e=>setForm({...form,field_to_match:e.target.value})}
                      style={{ width:'100%',padding:'10px 14px',border:`1.5px solid ${COLORS.border}`,borderRadius:'8px',fontSize:'14px',fontFamily:'Onest,sans-serif' }}>
                      {FIELDS.map(f=><option key={f.value} value={f.value}>{f.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={{ display:'block',marginBottom:'6px',fontWeight:500,fontSize:'14px' }}>Условие *</label>
                    <select value={form.match_type} onChange={e=>setForm({...form,match_type:e.target.value})}
                      style={{ width:'100%',padding:'10px 14px',border:`1.5px solid ${COLORS.border}`,borderRadius:'8px',fontSize:'14px',fontFamily:'Onest,sans-serif' }}>
                      {TYPES.map(t=><option key={t.value} value={t.value}>{t.label}</option>)}
                    </select>
                  </div>
                </div>

                <div style={{ marginBottom:'14px' }}>
                  <label style={{ display:'block',marginBottom:'6px',fontWeight:500,fontSize:'14px' }}>Паттерн * <span style={{ fontWeight:400,color:COLORS.textSecondary }}>(ключевое слово или regex)</span></label>
                  <div style={{ display:'flex',gap:'8px' }}>
                    <input value={form.pattern} onChange={e=>setForm({...form,pattern:e.target.value})} placeholder="аренда"
                      style={{ flex:1,padding:'10px 14px',border:`1.5px solid ${COLORS.border}`,borderRadius:'8px',fontSize:'14px',fontFamily:'Onest,sans-serif' }} />
                    <button onClick={handlePreview} style={{ padding:'10px 16px',background:COLORS.grayLight,border:`1px solid ${COLORS.border}`,borderRadius:'8px',cursor:'pointer',fontSize:'13px',fontWeight:600,whiteSpace:'nowrap' }}>
                      👁 Предпросмотр
                    </button>
                  </div>
                  {previewMatches && (
                    <div style={{ marginTop:'8px',background:'#EFEFFB',border:'1px solid #bfdbfe',borderRadius:'8px',padding:'10px 14px' }}>
                      <div style={{ fontSize:'13px',fontWeight:600,color:COLORS.accent,marginBottom:'6px' }}>
                        Совпадёт с {previewMatches.matched_count} транзакциями:
                      </div>
                      {previewMatches.matches.slice(0,5).map((m,i)=>(
                        <div key={i} style={{ fontSize:'12px',color:COLORS.textSecondary,marginBottom:'3px' }}>• {m.description} ({formatCurrency(m.amount)})</div>
                      ))}
                      {previewMatches.matched_count>5 && <div style={{ fontSize:'12px',color:COLORS.textSecondary }}>…ещё {previewMatches.matched_count-5}</div>}
                    </div>
                  )}
                </div>

                <div style={{ marginBottom:'14px' }}>
                  <label style={{ display:'block',marginBottom:'6px',fontWeight:500,fontSize:'14px' }}>Назначить категорию</label>
                  <select value={form.suggested_category_id} onChange={e=>setForm({...form,suggested_category_id:e.target.value})}
                    style={{ width:'100%',padding:'10px 14px',border:`1.5px solid ${COLORS.border}`,borderRadius:'8px',fontSize:'14px',fontFamily:'Onest,sans-serif' }}>
                    <option value="">— Без категории —</option>
                    {categories.map(c=><option key={c.id} value={c.id}>[{c.category_type==='income'?'Доход':'Расход'}] {c.name}</option>)}
                  </select>
                </div>

                <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'20px' }}>
                  <div>
                    <label style={{ display:'block',marginBottom:'6px',fontWeight:500,fontSize:'14px' }}>Приоритет <span style={{ fontWeight:400,color:COLORS.textSecondary }}>(больше = раньше)</span></label>
                    <input type="number" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}
                      style={{ width:'100%',padding:'10px 14px',border:`1.5px solid ${COLORS.border}`,borderRadius:'8px',fontSize:'14px',fontFamily:'Onest,sans-serif',boxSizing:'border-box' }} />
                  </div>
                  <div style={{ display:'flex',alignItems:'flex-end',paddingBottom:'2px' }}>
                    <label style={{ display:'flex',alignItems:'center',gap:'10px',cursor:'pointer' }}>
                      <div onClick={()=>setForm({...form,is_active:!form.is_active})}
                        style={{ width:'44px',height:'24px',borderRadius:'12px',background:form.is_active?COLORS.accent:'#cbd5e1',position:'relative',cursor:'pointer',transition:'background 0.2s' }}>
                        <div style={{ position:'absolute',top:'4px',left:form.is_active?'23px':'4px',width:'16px',height:'16px',borderRadius:'50%',background:'#fff',transition:'left 0.2s' }} />
                      </div>
                      <span style={{ fontWeight:500,fontSize:'14px' }}>Активно</span>
                    </label>
                  </div>
                </div>

                <div style={{ display:'flex',gap:'10px' }}>
                  <button onClick={()=>setShowModal(false)} style={{ flex:1,padding:'11px',background:COLORS.grayLight,border:'none',borderRadius:'8px',cursor:'pointer',fontWeight:600 }}>Отмена</button>
                  <button onClick={handleSave} style={{ flex:2,padding:'11px',background:COLORS.accent,color:'#fff',border:'none',borderRadius:'8px',cursor:'pointer',fontWeight:700,fontSize:'14px' }}>
                    {editingRule ? 'Сохранить' : 'Создать правило'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ─── ADMIN PANEL ────────────────────────────────────────────────────────────
    const AdminPage = () => {
      const { companyId, role, userInfo } = useAuth();
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState(null);
      const [showInvite, setShowInvite] = useState(false);
      const [showLinkGen, setShowLinkGen] = useState(false);
      const [linkRole, setLinkRole] = useState('viewer');
      const [linkNote, setLinkNote] = useState('');
      const [generatedLink, setGeneratedLink] = useState('');
      const [linkLoading, setLinkLoading] = useState(false);
      const [inviteForm, setInviteForm] = useState({ email: '', full_name: '', password: '', role: 'viewer' });
      const [stats, setStats] = useState(null);

      const ROLES = [
        { value: 'admin',      label: 'Администратор', desc: 'Всё кроме биллинга',     color: '#3b82f6' },
        { value: 'accountant', label: 'Бухгалтер',     desc: 'Финансы и отчёты',       color: '#10b981' },
        { value: 'manager',    label: 'Менеджер',      desc: 'Дашборд, CRM, Операции', color: '#8b5cf6' },
        { value: 'viewer',     label: 'Наблюдатель',   desc: 'Только просмотр',        color: '#6b7280' },
      ];
      const ROLE_COLORS = { owner:'#f59e0b', admin:'#3b82f6', accountant:'#10b981', manager:'#8b5cf6', viewer:'#6b7280' };

      const ACCESS_MATRIX = {
        owner:      ['Дашборд','Операции','Отчёты','Аналитика','Бюджеты','CRM','Сотрудники','Займы','Активы','Налоги','Настройки','Админ'],
        admin:      ['Дашборд','Операции','Отчёты','Аналитика','Бюджеты','CRM','Сотрудники','Займы','Активы','Налоги','Настройки','Админ'],
        accountant: ['Дашборд','Операции','Отчёты','Аналитика','Бюджеты','Сотрудники','Займы','Активы','Налоги'],
        manager:    ['Дашборд','Операции','Отчёты','Бюджеты','CRM','Заявки'],
        viewer:     ['Дашборд','Отчёты','Аналитика','Бюджеты'],
      };

      useEffect(() => {
        const load = async () => {
          setLoading(true);
          const [usersRes, plRes, txRes] = await Promise.all([
            apiCall('GET', `/companies/${companyId}/team/members`),
            apiCall('GET', `/companies/${companyId}/reports/pl?start_date=${new Date().getFullYear()}-01-01&end_date=${new Date().toISOString().split('T')[0]}`),
            apiCall('GET', `/companies/${companyId}/transactions?limit=1`),
          ]);
          if (usersRes.success) setUsers(usersRes.data.members || usersRes.data || []);
          if (plRes.success) setStats(plRes.data);
          setLoading(false);
        };
        if (companyId) load();
      }, [companyId]);

      const handleGenerateLink = async () => {
        setLinkLoading(true); setGeneratedLink('');
        const res = await apiCall('POST', `/companies/${companyId}/team/invite-link`, { role: linkRole, note: linkNote || null });
        setLinkLoading(false);
        if (res.success) {
          const baseUrl = window.location.origin + window.location.pathname;
          setGeneratedLink(`${baseUrl}#invite?token=${res.data.token}`);
        } else setToast({ type:'error', message: res.error });
      };

      const handleChangeRole = async (userId, newRole) => {
        const res = await apiCall('PATCH', `/companies/${companyId}/team/members/${userId}`, { role: newRole });
        if (res.success) {
          setUsers(u => u.map(m => m.user_id === userId ? {...m, role: newRole} : m));
          setToast({ type: 'success', message: 'Роль обновлена' });
        } else setToast({ type: 'error', message: res.error });
      };

      const handleRemove = async (userId) => {
        if (!confirm('Удалить пользователя из компании?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/team/members/${userId}`);
        if (res.success) {
          setUsers(u => u.filter(m => m.user_id !== userId));
          setToast({ type: 'success', message: 'Пользователь удалён' });
        } else setToast({ type: 'error', message: res.error });
      };

      const handleInvite = async () => {
        if (!inviteForm.email || !inviteForm.password) { setToast({type:'error',message:'Заполните email и пароль'}); return; }
        // Шаг 1: создаём приглашение → получаем токен
        const invRes = await apiCall('POST', `/companies/${companyId}/team/invite`, { email: inviteForm.email, role: inviteForm.role });
        if (!invRes.success) { setToast({ type:'error', message: invRes.error }); return; }
        const inviteToken = invRes.data.token;
        // Шаг 2: сразу принимаем приглашение с паролем
        const acceptRes = await apiCall('POST', '/auth/accept-invite', { token: inviteToken, password: inviteForm.password, full_name: inviteForm.full_name || inviteForm.email });
        if (acceptRes.success) {
          setToast({ type: 'success', message: `Пользователь ${inviteForm.email} добавлен с ролью ${inviteForm.role}` });
          setShowInvite(false);
          setInviteForm({ email: '', full_name: '', password: '', role: 'viewer' });
          const r2 = await apiCall('GET', `/companies/${companyId}/team/members`);
          if (r2.success) setUsers(r2.data.members || r2.data || []);
        } else setToast({ type: 'error', message: acceptRes.error });
      };

      if (loading) return <div style={{padding:'32px'}}><LoadingSpinner /></div>;

      return (
        <div style={{ padding: '24px', maxWidth: '1100px' }}>
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <div>
              <h2 style={{ fontSize: '22px', fontWeight: 800, margin: 0 }}>🛡 Администрирование</h2>
              <p style={{ color: COLORS.textSecondary, fontSize: '13px', marginTop: '4px' }}>Управление командой, ролями и доступом</p>
            </div>
            {(role === 'owner' || role === 'admin') && (
              <div style={{ display:'flex', gap:'10px' }}>
                <button onClick={() => setShowLinkGen(true)}
                  style={{ padding:'9px 16px', borderRadius:'8px', border:`1.5px solid ${COLORS.accent}`, background:'#EFEFFB',
                    color:COLORS.accent, cursor:'pointer', fontWeight:600, fontSize:'13px', fontFamily:'Onest,sans-serif' }}>
                  🔗 Ссылка-приглашение
                </button>
                <Button onClick={() => setShowInvite(true)}>+ Добавить пользователя</Button>
              </div>
            )}
          </div>

          {/* Статистика */}
          {stats && (
            <div style={{ display: 'flex', gap: '12px', marginBottom: '24px', flexWrap: 'wrap' }}>
              {[
                { label: 'Выручка (год)', value: formatCurrency(stats.revenue || 0), color: COLORS.green },
                { label: 'Расходы (год)', value: formatCurrency(stats.opex || 0),    color: COLORS.red },
                { label: 'Прибыль (год)', value: formatCurrency(stats.net_income || 0), color: (stats.net_income||0)>=0?COLORS.green:COLORS.red },
                { label: 'Маржа',         value: `${stats.net_margin_pct || 0}%`,    color: COLORS.accent },
              ].map(s => (
                <div key={s.label} style={{ flex: 1, minWidth: '160px', background: COLORS.white, borderRadius: '12px', padding: '16px 20px', border: `1px solid ${COLORS.border}` }}>
                  <div style={{ fontSize: '12px', color: COLORS.textSecondary, marginBottom: '6px' }}>{s.label}</div>
                  <div style={{ fontSize: '20px', fontWeight: 700, color: s.color }}>{s.value}</div>
                </div>
              ))}
            </div>
          )}

          {/* Матрица доступа */}
          <div style={{ background: COLORS.white, borderRadius: '14px', border: `1px solid ${COLORS.border}`, padding: '20px', marginBottom: '24px' }}>
            <div style={{ fontWeight: 700, fontSize: '15px', marginBottom: '16px' }}>🔐 Матрица доступа по ролям</div>
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight }}>
                    <th style={{ padding: '8px 12px', textAlign: 'left', fontWeight: 600, color: COLORS.textSecondary }}>Раздел</th>
                    {['owner','admin','accountant','manager','viewer'].map(r => (
                      <th key={r} style={{ padding: '8px 12px', textAlign: 'center', fontWeight: 700, color: ROLE_COLORS[r] }}>
                        {r === 'owner' ? 'Владелец' : r === 'admin' ? 'Админ' : r === 'accountant' ? 'Бухгалтер' : r === 'manager' ? 'Менеджер' : 'Наблюдатель'}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {['Дашборд','Операции','Отчёты','Аналитика','Бюджеты','CRM','Заявки','Сотрудники','Займы','Активы','Налоги','Настройки','Админ'].map((section, i) => (
                    <tr key={section} style={{ background: i%2===0 ? '#fff' : COLORS.grayLight }}>
                      <td style={{ padding: '7px 12px', fontWeight: 500 }}>{section}</td>
                      {['owner','admin','accountant','manager','viewer'].map(r => {
                        const has = ACCESS_MATRIX[r]?.includes(section);
                        return (
                          <td key={r} style={{ padding: '7px 12px', textAlign: 'center' }}>
                            <span style={{ color: has ? '#16a34a' : '#d1d5db', fontSize: '16px' }}>{has ? '✓' : '—'}</span>
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Список пользователей */}
          <div style={{ background: COLORS.white, borderRadius: '14px', border: `1px solid ${COLORS.border}`, padding: '20px' }}>
            <div style={{ fontWeight: 700, fontSize: '15px', marginBottom: '16px' }}>👥 Команда ({users.length} чел.)</div>
            {users.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '32px', color: COLORS.textSecondary, fontSize: '14px' }}>
                Пока только вы. Добавьте коллег через кнопку выше.
              </div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                {users.map(member => {
                  const r = member.role || 'viewer';
                  const rc = ROLE_COLORS[r] || '#6b7280';
                  return (
                    <div key={member.user_id || member.id} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 16px', borderRadius: '10px', background: COLORS.grayLight }}>
                      <div style={{ width: '38px', height: '38px', borderRadius: '50%', background: `${rc}20`, border: `2px solid ${rc}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: '15px', color: rc, flexShrink: 0 }}>
                        {(member.full_name || member.email || '?')[0].toUpperCase()}
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 600, fontSize: '14px' }}>{member.full_name || '—'}</div>
                        <div style={{ fontSize: '12px', color: COLORS.textSecondary }}>{member.email}</div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        {(role === 'owner' || role === 'admin') && member.role !== 'owner' ? (
                          <select value={r} onChange={e => handleChangeRole(member.user_id || member.id, e.target.value)}
                            style={{ padding: '5px 10px', borderRadius: '7px', border: `1.5px solid ${rc}`, color: rc, fontWeight: 600, fontSize: '12px', background: `${rc}15`, cursor: 'pointer', fontFamily: 'Inter,sans-serif' }}>
                            <option value="admin">Администратор</option>
                            <option value="accountant">Бухгалтер</option>
                            <option value="manager">Менеджер</option>
                            <option value="viewer">Наблюдатель</option>
                          </select>
                        ) : (
                          <span style={{ padding: '5px 12px', borderRadius: '7px', background: `${rc}15`, color: rc, fontWeight: 700, fontSize: '12px' }}>
                            {r === 'owner' ? 'Владелец' : r}
                          </span>
                        )}
                        {(role === 'owner') && member.role !== 'owner' && (
                          <button onClick={() => handleRemove(member.user_id || member.id)}
                            style={{ padding: '5px 10px', borderRadius: '7px', border: '1px solid #fca5a5', background: '#fef2f2', color: '#dc2626', cursor: 'pointer', fontSize: '12px', fontWeight: 600 }}>
                            Удалить
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Модалка приглашения */}
          {/* Модалка генератора ссылок */}
          {showLinkGen && (
            <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}
              onClick={e => { if(e.target===e.currentTarget){ setShowLinkGen(false); setGeneratedLink(''); } }}>
              <div style={{ background:'#fff', borderRadius:'16px', padding:'28px', width:'460px', boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
                <h3 style={{ fontSize:'18px', fontWeight:700, marginBottom:'6px' }}>🔗 Ссылка-приглашение</h3>
                <p style={{ fontSize:'13px', color:COLORS.textSecondary, marginBottom:'20px' }}>
                  Поделитесь ссылкой — любой перейдёт и сразу получит выбранную роль
                </p>

                {/* Выбор роли */}
                <div style={{ marginBottom:'16px' }}>
                  <label style={{ display:'block', marginBottom:'8px', fontWeight:600, fontSize:'13px' }}>Роль</label>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px' }}>
                    {[
                      { value:'admin',      label:'Администратор', desc:'Всё кроме биллинга',     color:'#3b82f6' },
                      { value:'accountant', label:'Бухгалтер',     desc:'Финансы и отчёты',       color:'#10b981' },
                      { value:'manager',    label:'Менеджер',      desc:'CRM, операции, проекты', color:'#8b5cf6' },
                      { value:'viewer',     label:'Наблюдатель',   desc:'Только просмотр',        color:'#6b7280' },
                    ].map(r => (
                      <div key={r.value} onClick={() => setLinkRole(r.value)}
                        style={{ padding:'10px 12px', borderRadius:'9px', cursor:'pointer', transition:'all 0.15s',
                          border:`2px solid ${linkRole===r.value ? r.color : COLORS.border}`,
                          background: linkRole===r.value ? `${r.color}12` : '#fff' }}>
                        <div style={{ fontWeight:700, fontSize:'13px', color:linkRole===r.value ? r.color : COLORS.text }}>{r.label}</div>
                        <div style={{ fontSize:'11px', color:COLORS.textSecondary, marginTop:'2px' }}>{r.desc}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Комментарий */}
                <div style={{ marginBottom:'20px' }}>
                  <label style={{ display:'block', marginBottom:'6px', fontWeight:500, fontSize:'13px' }}>Комментарий (необязательно)</label>
                  <input value={linkNote} onChange={e=>setLinkNote(e.target.value)} placeholder="Например: для менеджера по продажам"
                    style={{ width:'100%', padding:'10px 14px', border:`1.5px solid ${COLORS.border}`, borderRadius:'8px',
                      fontSize:'13px', fontFamily:'Onest,sans-serif', boxSizing:'border-box' }} />
                </div>

                {/* Кнопка генерации */}
                {!generatedLink ? (
                  <button onClick={handleGenerateLink} disabled={linkLoading}
                    style={{ width:'100%', padding:'12px', background:COLORS.accent, color:'#fff', border:'none', borderRadius:'9px',
                      cursor:'pointer', fontWeight:700, fontSize:'14px', fontFamily:'Onest,sans-serif', marginBottom:'12px' }}>
                    {linkLoading ? '⏳ Генерация...' : '✨ Сгенерировать ссылку'}
                  </button>
                ) : (
                  <div style={{ marginBottom:'12px' }}>
                    <div style={{ fontSize:'12px', fontWeight:600, color:COLORS.textSecondary, marginBottom:'6px' }}>ССЫЛКА ГОТОВА (действует 7 дней)</div>
                    <div style={{ display:'flex', gap:'8px' }}>
                      <input readOnly value={generatedLink}
                        style={{ flex:1, padding:'10px 12px', border:`1.5px solid #10b981`, borderRadius:'8px',
                          fontSize:'12px', fontFamily:'Onest,sans-serif', background:'#f0fdf4', color:'#065f46' }}
                        onClick={e=>e.target.select()} />
                      <button onClick={()=>{ navigator.clipboard.writeText(generatedLink); setToast({type:'success',message:'Ссылка скопирована!'}); }}
                        style={{ padding:'10px 16px', background:'#10b981', color:'#fff', border:'none', borderRadius:'8px',
                          cursor:'pointer', fontWeight:600, fontSize:'13px', whiteSpace:'nowrap', fontFamily:'Onest,sans-serif' }}>
                        📋 Копировать
                      </button>
                    </div>
                    <button onClick={()=>{ setGeneratedLink(''); setLinkNote(''); }}
                      style={{ marginTop:'8px', background:'none', border:'none', color:COLORS.textSecondary,
                        cursor:'pointer', fontSize:'12px', fontFamily:'Onest,sans-serif' }}>
                      Создать другую ссылку
                    </button>
                  </div>
                )}

                <button onClick={()=>{ setShowLinkGen(false); setGeneratedLink(''); setLinkNote(''); }}
                  style={{ width:'100%', padding:'10px', background:COLORS.grayLight, border:'none', borderRadius:'8px',
                    cursor:'pointer', fontWeight:600, fontFamily:'Onest,sans-serif' }}>
                  Закрыть
                </button>
              </div>
            </div>
          )}

          {showInvite && (
            <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}
              onClick={e => { if (e.target===e.currentTarget) setShowInvite(false); }}>
              <div style={{ background:'#fff', borderRadius:'16px', padding:'28px', width:'420px', boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
                <h3 style={{ fontSize:'18px', fontWeight:700, marginBottom:'20px' }}>Добавить пользователя</h3>
                {[
                  { label:'Email *', key:'email', type:'email', placeholder:'user@company.ru' },
                  { label:'ФИО', key:'full_name', type:'text', placeholder:'Иван Иванов' },
                  { label:'Пароль *', key:'password', type:'password', placeholder:'Минимум 8 символов' },
                ].map(f => (
                  <div key={f.key} style={{ marginBottom:'14px' }}>
                    <label style={{ display:'block', marginBottom:'6px', fontWeight:500, fontSize:'14px' }}>{f.label}</label>
                    <input type={f.type} value={inviteForm[f.key]} onChange={e => setInviteForm({...inviteForm,[f.key]:e.target.value})}
                      placeholder={f.placeholder}
                      style={{ width:'100%', padding:'10px 14px', border:`1.5px solid ${COLORS.border}`, borderRadius:'8px', fontSize:'14px', fontFamily:'Onest,sans-serif', boxSizing:'border-box' }} />
                  </div>
                ))}
                <div style={{ marginBottom:'20px' }}>
                  <label style={{ display:'block', marginBottom:'8px', fontWeight:500, fontSize:'14px' }}>Роль</label>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px' }}>
                    {ROLES.map(r => (
                      <div key={r.value} onClick={() => setInviteForm({...inviteForm, role: r.value})}
                        style={{ padding:'10px 12px', borderRadius:'9px', border:`2px solid ${inviteForm.role===r.value ? r.color : COLORS.border}`,
                          background: inviteForm.role===r.value ? `${r.color}12` : '#fff', cursor:'pointer', transition:'all 0.15s' }}>
                        <div style={{ fontWeight:700, fontSize:'13px', color: inviteForm.role===r.value ? r.color : COLORS.text }}>{r.label}</div>
                        <div style={{ fontSize:'11px', color:COLORS.textSecondary, marginTop:'2px' }}>{r.desc}</div>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{ display:'flex', gap:'10px' }}>
                  <button onClick={() => setShowInvite(false)} style={{ flex:1, padding:'11px', background:COLORS.grayLight, border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:600 }}>Отмена</button>
                  <button onClick={handleInvite} style={{ flex:2, padding:'11px', background:COLORS.accent, color:'#fff', border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:700, fontSize:'14px' }}>Добавить</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [currentPage, setCurrentPage] = useState(() => {
        const hash = window.location.hash.slice(1) || 'dashboard';
        return hash.split('?')[0];
      });

      const { token, login, logout, canAccess } = useAuth();

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.slice(1) || 'dashboard';
          setCurrentPage(hash.split('?')[0]);
        };

        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      // Invite link — показываем форму принятия инвайта даже если залогинен
      const isInviteUrl = window.location.hash.includes('invite?token=');
      if (!token || isInviteUrl) {
        return <AuthScreen onLoginSuccess={login} />;
      }

      const pageMap = {
        dashboard: <Dashboard />,
        transactions: <Transactions />,
        templates: <TemplatesPage />,
        calendar: <Calendar />,
        reports: <Reports />,
        analytics: <AnalyticsPage />,
        'ai-parser': <AIParserPage />,
        alerts: <AlertsPage />,
        'auto-rules': <AutoRulesPage />,
        debts: <DebtsPage />,
        counterparties: <Counterparties />,
        projects: <Projects />,
        crm: <CRMPage />,
        budgets: <Budgets />,
        'payment-requests': <PaymentRequests />,
        payroll: <Payroll />,
        assets: <Assets />,
        banks: <Banks />,
        documents: <Documents />,
        loans: <Loans />,
        taxes: <Taxes />,
        accruals: <Accruals />,
        settings: <Settings />,
        admin: <AdminPage />,
      };

      // Заглушка для страниц без доступа
      const AccessDenied = () => (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'60vh', gap:'16px' }}>
          <div style={{ fontSize:'64px' }}>🔒</div>
          <div style={{ fontSize:'20px', fontWeight:700, color: COLORS.text }}>Нет доступа</div>
          <div style={{ fontSize:'14px', color: COLORS.textSecondary }}>У вашей роли нет доступа к этому разделу</div>
          <a href="#dashboard" style={{ padding:'10px 24px', background: COLORS.accent, color:'#fff', borderRadius:'8px', textDecoration:'none', fontWeight:600, fontSize:'14px' }}>На дашборд</a>
        </div>
      );

      const currentComponent = canAccess(currentPage)
        ? (pageMap[currentPage] || <Dashboard />)
        : <AccessDenied />;

      return (
        <Layout currentPage={currentPage}>
          {currentComponent}
        </Layout>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AuthProvider>
        <App />
      </AuthProvider>
    );
  </script>
</body>
</html>
