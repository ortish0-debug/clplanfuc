<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axiom Finance — Business Financial Management</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Aurora: force Onest everywhere, overriding legacy inline Inter overrides */
    * { font-family: 'Onest', sans-serif !important; }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Onest', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #18181B;
      background: #FBFBFD;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #DEDEE6;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C4C4CF;
    }

    @keyframes slideIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useRef } = React;

    const COLORS = {
      bg: '#FBFBFD',
      sidebar: '#FFFFFF',
      sidebarActive: '#F2F2F6',
      sidebarHover: '#F7F7FA',
      sidebarBorder: '#EFEFF3',
      sidebarText: '#6E6E78',
      sidebarTextActive: '#18181B',
      accent: '#5B5BD6',
      white: '#ffffff',
      text: '#18181B',
      textSecondary: '#8B8B96',
      border: '#ECECF1',
      green: '#1A9E6B',
      red: '#E05252',
      greenLight: '#E9F6F0',
      redLight: '#FCEDED',
      blueLight: '#EFEFFB',
      grayLight: '#F7F7FA',
      yellow: '#D9A441',
      yellowLight: '#FBF4E6',
    };

    const API_BASE = '/api/v1';

    const LINE_ICON_PATHS = {
      revenue: 'M3 17l6-6 4 4 8-8 M21 7v5 M21 7h-5',
      expense: 'M3 7l6 6 4-4 8 8 M21 17v-5 M21 17h-5',
      profit: 'M12 3l9 6-9 12-9-12z M3 9h18 M12 3v18',
      balance: 'M3 10l9-6 9 6 M4 10v8 M9 10v8 M15 10v8 M20 10v8 M3 21h18',
      chart: 'M4 4v16h16 M8 14v3 M13 10v7 M18 7v10',
    };
    const LineIcon = ({ name, size = 18, color = 'currentColor', sw = 1.7 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
        strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
        <path d={LINE_ICON_PATHS[name] || LINE_ICON_PATHS.chart} />
      </svg>
    );

    const formatCurrency = (value) => {
      if (!value && value !== 0) return '—';
      return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        maximumFractionDigits: 0,
      }).format(value);
    };

    const formatDate = (date) => {
      if (!date) return '';
      if (typeof date === 'string') date = new Date(date);
      return date.toLocaleDateString('ru-RU');
    };

    const safeDate = (dateStr) => {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('ru-RU');
      } catch(e) { return dateStr; }
    };

    const apiCall = async (method, path, data = null) => {
      const token = localStorage.getItem('pf_token');
      const config = {
        method,
        headers: {
          'Content-Type': 'application/json',
        },
      };
      if (token) {
        config.headers['Authorization'] = `Bearer ${token}`;
      }
      if (data) {
        config.data = data;
      }

      try {
        const response = await axios(`${API_BASE}${path}`, config);
        return { success: true, data: response.data };
      } catch (error) {
        if (error.response?.status === 401) {
          localStorage.clear();
          window.location.hash = '#login';
        }
        let errorMsg = 'Ошибка';
        const detail = error.response?.data?.detail;
        if (typeof detail === 'string') {
          errorMsg = detail;
        } else if (Array.isArray(detail)) {
          errorMsg = detail.map(e => typeof e === 'string' ? e : e.msg || 'Ошибка валидации').join('; ');
        } else if (detail && typeof detail === 'object') {
          errorMsg = detail.msg || JSON.stringify(detail).slice(0, 100);
        } else if (error.message) {
          errorMsg = error.message;
        }
        return { success: false, error: errorMsg };
      }
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // ГЛОБАЛЬНЫЙ ПОИСК
    // ─────────────────────────────────────────────────────────────────────────────

    const SearchModal = ({ onNavigate }) => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [open, setOpen]     = useState(false);
      const [query, setQuery]   = useState('');
      const [results, setResults] = useState(null);
      const [loading, setLoading] = useState(false);
      const inputRef = useRef(null);
      const timerRef = useRef(null);

      // Ctrl+K / Cmd+K открывает поиск
      useEffect(() => {
        const onKey = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); setOpen(o => !o); }
          if (e.key === 'Escape') { setOpen(false); setQuery(''); setResults(null); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (open) setTimeout(() => inputRef.current?.focus(), 50);
        else { setQuery(''); setResults(null); }
      }, [open]);

      useEffect(() => {
        clearTimeout(timerRef.current);
        if (!query.trim() || query.length < 2) { setResults(null); return; }
        timerRef.current = setTimeout(async () => {
          setLoading(true);
          const res = await apiCall('get', `/companies/${companyId}/search/?q=${encodeURIComponent(query)}`);
          setLoading(false);
          if (res.success) setResults(res.data.results);
        }, 300);
        return () => clearTimeout(timerRef.current);
      }, [query, companyId]);

      const handleSelect = (hash) => {
        setOpen(false); setQuery(''); setResults(null);
        window.location.hash = hash;
      };

      const SECTIONS = [
        { key: 'transactions',  label: 'Операции',    icon: '💳' },
        { key: 'counterparties', label: 'Контрагенты', icon: '👥' },
        { key: 'deals',         label: 'Сделки',       icon: '🎯' },
        { key: 'projects',      label: 'Проекты',      icon: '📁' },
      ];

      const hasResults = results && Object.values(results).some(a => a.length > 0);

      if (!open) return (
        <button onClick={() => setOpen(true)} title="Поиск (Ctrl+K)" style={{
          display: 'flex', alignItems: 'center', gap: '6px',
          padding: '8px 14px', borderRadius: '8px',
          border: `1.5px solid ${COLORS.border}`, background: COLORS.grayLight,
          cursor: 'pointer', color: COLORS.textSecondary,
          fontSize: '13px', fontFamily: 'Inter, sans-serif',
          transition: 'all 0.15s',
        }}
          onMouseEnter={e => { e.currentTarget.style.borderColor = COLORS.accent; e.currentTarget.style.color = COLORS.accent; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor = COLORS.border; e.currentTarget.style.color = COLORS.textSecondary; }}
        >
          🔍 <span>Поиск</span>
          <span style={{ fontSize: '11px', padding: '2px 6px', borderRadius: '4px', background: COLORS.border, color: COLORS.textSecondary }}>Ctrl+K</span>
        </button>
      );

      return (
        <div style={{ position: 'fixed', inset: 0, zIndex: 10000, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', paddingTop: '80px' }}>
          {/* Backdrop */}
          <div onClick={() => setOpen(false)} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.45)' }} />

          {/* Панель */}
          <div style={{
            position: 'relative', width: '560px', maxWidth: '90vw',
            background: COLORS.white, borderRadius: '16px',
            boxShadow: '0 20px 60px rgba(0,0,0,0.25)',
            overflow: 'hidden', animation: 'slideIn 0.15s ease-out',
          }}>
            {/* Поле ввода */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '16px 20px', borderBottom: `1px solid ${COLORS.border}` }}>
              <span style={{ fontSize: '18px' }}>🔍</span>
              <input ref={inputRef} value={query} onChange={e => setQuery(e.target.value)}
                placeholder="Поиск по операциям, контрагентам, сделкам..."
                style={{ flex: 1, border: 'none', outline: 'none', fontSize: '16px', fontFamily: 'Inter, sans-serif', background: 'transparent', color: COLORS.text }}
              />
              {loading && <div style={{ width: '16px', height: '16px', border: `2px solid ${COLORS.border}`, borderTop: `2px solid ${COLORS.accent}`, borderRadius: '50%', animation: 'spin 0.8s linear infinite' }} />}
              {query && <button onClick={() => setQuery('')} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.textSecondary }}>✕</button>}
            </div>

            {/* Результаты */}
            <div style={{ maxHeight: '440px', overflowY: 'auto' }}>
              {!query && (
                <div style={{ padding: '24px', textAlign: 'center', color: COLORS.textSecondary }}>
                  <div style={{ fontSize: '32px', marginBottom: '8px' }}>🔍</div>
                  <div style={{ fontSize: '14px' }}>Начните вводить для поиска</div>
                  <div style={{ fontSize: '12px', marginTop: '4px' }}>Операции · Контрагенты · Сделки · Проекты</div>
                </div>
              )}

              {query.length >= 2 && !loading && !hasResults && results && (
                <div style={{ padding: '24px', textAlign: 'center', color: COLORS.textSecondary }}>
                  <div style={{ fontSize: '28px', marginBottom: '8px' }}>🤷</div>
                  <div>Ничего не найдено по запросу <b>«{query}»</b></div>
                </div>
              )}

              {hasResults && SECTIONS.map(sec => {
                const items = results[sec.key] || [];
                if (items.length === 0) return null;
                return (
                  <div key={sec.key}>
                    <div style={{ padding: '10px 20px 4px', fontSize: '11px', fontWeight: 700, color: COLORS.textSecondary, textTransform: 'uppercase', letterSpacing: '0.08em' }}>
                      {sec.label}
                    </div>
                    {items.map(item => (
                      <div key={item.id} onClick={() => handleSelect(item.hash)}
                        style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '10px 20px', cursor: 'pointer', transition: 'background 0.1s' }}
                        onMouseEnter={e => e.currentTarget.style.background = COLORS.blueLight}
                        onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                      >
                        <span style={{ fontSize: '18px', flexShrink: 0 }}>{sec.icon}</span>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 500, fontSize: '14px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.title}</div>
                          <div style={{ fontSize: '12px', color: COLORS.textSecondary }}>{item.subtitle}</div>
                        </div>
                        {item.amount != null && (
                          <span style={{ fontWeight: 700, fontSize: '13px', flexShrink: 0, color: item.tx_type === 'income' ? COLORS.green : (item.tx_type === 'expense' ? COLORS.red : COLORS.text) }}>
                            {item.tx_type === 'income' ? '+' : item.tx_type === 'expense' ? '-' : ''}{formatCurrency(Math.abs(item.amount))}
                          </span>
                        )}
                        <span style={{ fontSize: '12px', color: COLORS.textSecondary, flexShrink: 0 }}>→</span>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>

            {/* Подсказка */}
            <div style={{ padding: '10px 20px', borderTop: `1px solid ${COLORS.border}`, display: 'flex', gap: '16px', fontSize: '11px', color: COLORS.textSecondary }}>
              <span>↵ Перейти</span>
              <span>Esc Закрыть</span>
            </div>
          </div>
        </div>
      );
    };

    // Хелпер для скачивания файлов с Authorization header
    const downloadFile = async (url, filename) => {
      const token = localStorage.getItem('pf_token');
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error('Ошибка экспорта');
      const blob = await res.blob();
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    };

    const AuthContext = createContext();

    // ─── Матрица доступа ────────────────────────────────────────────────────────
    //
    // СТРАНИЦЫ: какие разделы видит роль
    const ROLE_PAGES = {
      owner:      ['dashboard','transactions','calendar','reports','analytics','ai-parser','alerts','auto-rules','debts','counterparties','projects','crm','budgets','payment-requests','payroll','assets','banks','documents','loans','taxes','accruals','settings','admin'],
      admin:      ['dashboard','transactions','calendar','reports','analytics','ai-parser','alerts','auto-rules','debts','counterparties','projects','crm','budgets','payment-requests','payroll','assets','banks','documents','loans','taxes','accruals','settings','admin'],
      accountant: ['dashboard','transactions','calendar','reports','analytics','ai-parser','alerts','auto-rules','debts','counterparties','budgets','payment-requests','payroll','assets','documents','loans','taxes','accruals'],
      manager:    ['dashboard','transactions','calendar','reports','counterparties','projects','crm','budgets','payment-requests'],
      viewer:     ['dashboard','reports','analytics','budgets'],
    };

    // ДЕЙСТВИЯ: что может делать роль (create/edit/delete/approve)
    // true = разрешено, false = запрещено
    const ROLE_PERMS = {
      owner:      { write: true,  delete: true,  approve: true,  manage_team: true,  settings: true  },
      admin:      { write: true,  delete: true,  approve: true,  manage_team: true,  settings: true  },
      accountant: { write: true,  delete: false, approve: true,  manage_team: false, settings: false },
      manager:    { write: true,  delete: false, approve: false, manage_team: false, settings: false },
      viewer:     { write: false, delete: false, approve: false, manage_team: false, settings: false },
    };

    // Какие разделы менеджер может редактировать (write=true, но только эти)
    const MANAGER_WRITE_SECTIONS = ['transactions','counterparties','projects','crm','payment-requests','calendar'];

    const canAccess    = (role, page) => (ROLE_PAGES[role] || ROLE_PAGES.viewer).includes(page);
    const canWrite     = (role, section) => {
      const p = ROLE_PERMS[role] || ROLE_PERMS.viewer;
      if (!p.write) return false;
      if (role === 'manager') return MANAGER_WRITE_SECTIONS.includes(section);
      return true;
    };
    const canDelete    = (role) => (ROLE_PERMS[role] || ROLE_PERMS.viewer).delete;
    const canApprove   = (role) => (ROLE_PERMS[role] || ROLE_PERMS.viewer).approve;
    const canManage    = (role) => (ROLE_PERMS[role] || ROLE_PERMS.viewer).manage_team;
    const canSettings  = (role) => (ROLE_PERMS[role] || ROLE_PERMS.viewer).settings;

    const AuthProvider = ({ children }) => {
      const [token, setToken] = useState(localStorage.getItem('pf_token'));
      const [companyId, setCompanyId] = useState(localStorage.getItem('pf_company_id'));
      const [role, setRole] = useState(localStorage.getItem('pf_role') || 'viewer');
      const [userInfo, setUserInfo] = useState(() => {
        try { return JSON.parse(localStorage.getItem('pf_user') || 'null'); } catch { return null; }
      });
      const [user, setUser] = useState(null);

      useEffect(() => {
        if (!token) return;
        // Декодируем JWT для базовых данных
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          setUser(payload);
        } catch (e) {
          setToken(null);
          localStorage.removeItem('pf_token');
          return;
        }
        // Синхронизируем роль с сервером — localStorage может быть устаревшим
        fetch('/api/v1/auth/me', { headers: { Authorization: `Bearer ${token}` } })
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data?.role) {
              setRole(data.role);
              localStorage.setItem('pf_role', data.role);
              setUserInfo({ email: data.email, full_name: data.full_name || data.email });
              localStorage.setItem('pf_user', JSON.stringify({ email: data.email, full_name: data.full_name || data.email }));
            }
          })
          .catch(() => {});
      }, [token]);

      const login = (newToken, newCompanyId, newRole, newUserInfo) => {
        localStorage.setItem('pf_token', newToken);
        localStorage.setItem('pf_company_id', newCompanyId);
        localStorage.setItem('pf_role', newRole || 'viewer');
        if (newUserInfo) localStorage.setItem('pf_user', JSON.stringify(newUserInfo));
        setToken(newToken);
        setCompanyId(newCompanyId);
        setRole(newRole || 'viewer');
        if (newUserInfo) setUserInfo(newUserInfo);
      };

      const logout = () => {
        localStorage.removeItem('pf_token');
        localStorage.removeItem('pf_company_id');
        localStorage.removeItem('pf_role');
        localStorage.removeItem('pf_user');
        setToken(null); setCompanyId(null); setUser(null);
        setRole('viewer'); setUserInfo(null);
        window.location.hash = '#login';
      };

      return (
        <AuthContext.Provider value={{
          token, companyId, user, role, userInfo, login, logout,
          canAccess:  (page)    => canAccess(role, page),
          canWrite:   (section) => canWrite(role, section),
          canDelete:  ()        => canDelete(role),
          canApprove: ()        => canApprove(role),
          canManage:  ()        => canManage(role),
          canSettings:()        => canSettings(role),
        }}>
          {children}
        </AuthContext.Provider>
      );
    };

    const useAuth = () => useContext(AuthContext);

    const Toast = ({ message, type, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, type === 'error' ? 5000 : 3000);
        return () => clearTimeout(timer);
      }, [onClose, type]);

      const bgColor = type === 'success' ? COLORS.greenLight : COLORS.redLight;
      const borderColor = type === 'success' ? COLORS.green : COLORS.red;
      const textColor = type === 'success' ? COLORS.green : COLORS.red;

      return (
        <div
          style={{
            position: 'fixed',
            bottom: '24px',
            right: '24px',
            background: COLORS.white,
            border: `2px solid ${borderColor}`,
            borderRadius: '10px',
            padding: '16px 20px',
            color: textColor,
            fontWeight: 500,
            zIndex: 9999,
            boxShadow: '0 10px 25px rgba(0,0,0,0.1)',
            animation: 'slideIn 0.3s ease-out',
          }}
        >
          {type === 'success' ? '✓' : '✕'} {message}
        </div>
      );
    };

    const LoadingSpinner = () => (
      <div style={{ textAlign: 'center', padding: '40px', color: COLORS.textSecondary }}>
        <div
          style={{
            width: '40px',
            height: '40px',
            border: '4px solid ' + COLORS.border,
            borderTop: '4px solid ' + COLORS.accent,
            borderRadius: '50%',
            margin: '0 auto 16px',
            animation: 'spin 1s linear infinite',
          }}
        />
        Загрузка...
      </div>
    );

    const Button = ({ children, onClick, variant = 'primary', disabled = false, style = {} }) => {
      const isPrimary = variant === 'primary';
      const isOutline = variant === 'outline';

      return (
        <button
          onClick={onClick}
          disabled={disabled}
          style={{
            padding: '10px 20px',
            borderRadius: '8px',
            border: isOutline ? `1.5px solid ${COLORS.border}` : 'none',
            background: isPrimary ? COLORS.accent : 'transparent',
            color: isPrimary ? COLORS.white : COLORS.text,
            cursor: disabled ? 'not-allowed' : 'pointer',
            fontWeight: 500,
            fontSize: '14px',
            transition: 'all 0.2s',
            opacity: disabled ? 0.5 : 1,
            ...style,
          }}
          onMouseEnter={(e) => {
            if (!disabled && isPrimary) {
              e.target.style.background = '#4A4AC4';
            }
            if (!disabled && isOutline) {
              e.target.style.background = COLORS.grayLight;
            }
          }}
          onMouseLeave={(e) => {
            if (isPrimary) {
              e.target.style.background = COLORS.accent;
            }
            if (isOutline) {
              e.target.style.background = 'transparent';
            }
          }}
        >
          {children}
        </button>
      );
    };

    const Input = ({ type = 'text', placeholder, value, onChange, disabled = false, style = {} }) => (
      <input
        type={type}
        placeholder={placeholder}
        value={value}
        onChange={onChange}
        disabled={disabled}
        style={{
          width: '100%',
          padding: '10px 14px',
          border: `1.5px solid ${COLORS.border}`,
          borderRadius: '8px',
          fontSize: '14px',
          fontFamily: 'Inter, sans-serif',
          transition: 'border 0.2s',
          background: disabled ? COLORS.grayLight : COLORS.white,
          cursor: disabled ? 'not-allowed' : 'auto',
          ...style,
        }}
        onFocus={(e) => {
          if (!disabled) {
            e.target.style.borderColor = COLORS.accent;
            e.target.style.outline = 'none';
          }
        }}
        onBlur={(e) => {
          e.target.style.borderColor = COLORS.border;
        }}
      />
    );

    const Modal = ({ isOpen, onClose, title, children, style = {} }) => {
      if (!isOpen) return null;

      return (
        <div
          style={{
            position: 'fixed',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            background: 'rgba(0,0,0,0.5)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 9998,
          }}
          onClick={onClose}
        >
          <div
            style={{
              background: COLORS.white,
              borderRadius: '16px',
              padding: '32px',
              maxWidth: '520px',
              width: '90%',
              maxHeight: '90vh',
              overflowY: 'auto',
              ...style,
            }}
            onClick={(e) => e.stopPropagation()}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
              <h2 style={{ fontSize: '20px', fontWeight: 600 }}>{title}</h2>
              <button
                onClick={onClose}
                style={{
                  background: 'none',
                  border: 'none',
                  fontSize: '24px',
                  cursor: 'pointer',
                  color: COLORS.textSecondary,
                }}
              >
                ✕
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // АВТОРИЗАЦИЯ (без изменений)
    // ─────────────────────────────────────────────────────────────────────────────

    const ROLE_LABELS_AUTH = {
      owner:      'Владелец',
      admin:      'Администратор',
      accountant: 'Бухгалтер',
      manager:    'Менеджер',
      viewer:     'Наблюдатель',
    };

    const AuthScreen = ({ onLoginSuccess }) => {
      // mode: 'login' | 'register' | 'invite'
      const [mode, setMode] = useState(() => {
        const hash = window.location.hash;
        if (hash.includes('invite?token=')) return 'invite';
        return 'login';
      });
      const [email, setEmail]         = useState('');
      const [password, setPassword]   = useState('');
      const [password2, setPassword2] = useState('');
      const [fullName, setFullName]   = useState('');
      const [companyName, setCompanyName] = useState('');
      const [regTaxRegime, setRegTaxRegime] = useState('usn_income');
      const [error, setError]         = useState('');
      const [loading, setLoading]     = useState(false);

      // Инвайт-поток
      const [inviteToken]   = useState(() => {
        const m = window.location.hash.match(/[?&]token=([^&]+)/);
        return m ? m[1] : '';
      });
      const [inviteInfo, setInviteInfo] = useState(null);
      const [inviteLoading, setInviteLoading] = useState(false);

      // Загружаем инфо об инвайте при старте
      useEffect(() => {
        if (mode === 'invite' && inviteToken) {
          setInviteLoading(true);
          fetch(`/api/v1/auth/invite-info?token=${inviteToken}`)
            .then(r => r.json())
            .then(data => {
              if (data.role) {
                setInviteInfo(data);
                if (data.email && !data.email.startsWith('open_link_')) setEmail(data.email);
              } else {
                setError(data.detail || 'Недействительная ссылка-приглашение');
                setMode('login');
              }
            })
            .catch(() => { setError('Ошибка загрузки приглашения'); setMode('login'); })
            .finally(() => setInviteLoading(false));
        }
      }, []);

      const doLogin = async (emailVal, passwordVal) => {
        const res = await fetch('/api/v1/auth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'username=' + encodeURIComponent(emailVal) + '&password=' + encodeURIComponent(passwordVal),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Ошибка входа');
        onLoginSuccess(data.access_token, data.company_id, data.role || 'owner', { email: data.email, full_name: data.full_name });
        window.location.hash = '#dashboard';
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!email || !password) { setError('Заполните все поля'); return; }
        setLoading(true); setError('');
        try { await doLogin(email, password); }
        catch (err) { setError(err.message); }
        finally { setLoading(false); }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        if (!email || !password || !fullName) { setError('Заполните все поля'); return; }
        if (password !== password2) { setError('Пароли не совпадают'); return; }
        if (password.length < 8) { setError('Пароль минимум 8 символов'); return; }
        setLoading(true); setError('');
        try {
          const res = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, full_name: fullName, company_name: companyName || fullName + "'s Company", tax_regime: regTaxRegime }),
          });
          const data = await res.json();
          if (!res.ok) { setError(data.detail || 'Ошибка регистрации'); return; }
          await doLogin(email, password);
        } catch (err) { setError(err.message); }
        finally { setLoading(false); }
      };

      const handleAcceptInvite = async (e) => {
        e.preventDefault();
        if (!password || !fullName) { setError('Заполните имя и пароль'); return; }
        if (password !== password2) { setError('Пароли не совпадают'); return; }
        if (password.length < 8) { setError('Пароль минимум 8 символов'); return; }
        const isOpen = inviteInfo?.email?.startsWith('open_link_');
        if (isOpen && !email) { setError('Введите ваш email'); return; }
        setLoading(true); setError('');
        try {
          const body = { token: inviteToken, password, full_name: fullName };
          if (isOpen) body.email = email;
          const res = await fetch('/api/v1/auth/accept-invite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) { setError(data.detail || 'Ошибка принятия приглашения'); return; }
          // accept-invite возвращает JWT напрямую
          onLoginSuccess(data.access_token, data.company_id, data.role || 'viewer', { email: data.email, full_name: data.full_name });
          window.location.hash = '#dashboard';
        } catch (err) { setError(err.message); }
        finally { setLoading(false); }
      };

      const BG = 'radial-gradient(120% 120% at 80% 0%, #EFEFFB 0%, #FBFBFD 45%, #F4F4F9 100%)';
      const isInvite = mode === 'invite';
      const isOpen   = inviteInfo?.email?.startsWith('open_link_');

      const Field = ({ label, type='text', value, onChange, placeholder, disabled }) => (
        <div>
          <label style={{ display:'block', marginBottom:'6px', fontWeight:500, fontSize:'14px', color: COLORS.text }}>{label}</label>
          <input type={type} value={value} onChange={onChange} placeholder={placeholder} disabled={disabled}
            style={{ width:'100%', padding:'11px 14px', border:`1.5px solid ${COLORS.border}`, borderRadius:'9px',
              fontSize:'14px', fontFamily:'Onest,sans-serif', boxSizing:'border-box',
              background: disabled ? COLORS.grayLight : '#fff', color: COLORS.text, outline:'none',
              transition:'border 0.2s' }}
            onFocus={e => e.target.style.borderColor = COLORS.accent}
            onBlur={e => e.target.style.borderColor = COLORS.border}
          />
        </div>
      );

      return (
        <div style={{ position:'fixed', inset:0, background:BG, display:'flex', alignItems:'center', justifyContent:'center', padding:'20px' }}>
          <div style={{ background:'#fff', borderRadius:'20px', padding:'44px 48px', width:'460px', maxWidth:'100%',
            boxShadow:'0 32px 80px rgba(0,0,0,0.35)', animation:'slideIn 0.3s ease-out' }}>

            {/* Логотип */}
            <div style={{ textAlign:'center', marginBottom:'32px' }}>
              <div style={{ width:'56px', height:'56px', borderRadius:'16px', background:COLORS.accent, color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'28px', fontWeight:800, margin:'0 auto 12px' }}>A</div>
              <div style={{ fontSize:'24px', fontWeight:800, color:COLORS.accent, letterSpacing:'-0.5px' }}>Axiom Finance</div>
              <div style={{ fontSize:'11px', color:COLORS.textSecondary, letterSpacing:'2px', textTransform:'uppercase', marginTop:'3px' }}>
                Business Financial Management
              </div>
            </div>

            {/* Таб переключатель (только для login/register) */}
            {!isInvite && (
              <div style={{ display:'flex', background:COLORS.grayLight, borderRadius:'10px', padding:'4px', marginBottom:'28px' }}>
                {[['login','Войти'],['register','Регистрация']].map(([m, label]) => (
                  <button key={m} onClick={() => { setMode(m); setError(''); }}
                    style={{ flex:1, padding:'9px', borderRadius:'8px', border:'none', cursor:'pointer', fontWeight:600,
                      fontSize:'14px', transition:'all 0.2s', fontFamily:'Onest,sans-serif',
                      background: mode===m ? '#fff' : 'transparent',
                      color: mode===m ? COLORS.accent : COLORS.textSecondary,
                      boxShadow: mode===m ? '0 1px 4px rgba(0,0,0,0.1)' : 'none' }}>
                    {label}
                  </button>
                ))}
              </div>
            )}

            {/* Баннер приглашения */}
            {isInvite && (
              <div style={{ marginBottom:'24px' }}>
                {inviteLoading ? (
                  <div style={{ textAlign:'center', padding:'16px', color:COLORS.textSecondary }}>Загрузка приглашения...</div>
                ) : inviteInfo ? (
                  <div style={{ background:'#EFEFFB', borderRadius:'12px', padding:'16px 20px', border:'1px solid #bfdbfe' }}>
                    <div style={{ fontSize:'13px', color:'#4A4AC4', fontWeight:600, marginBottom:'4px' }}>
                      🎉 Вас пригласили в компанию
                    </div>
                    <div style={{ fontSize:'18px', fontWeight:800, color:COLORS.text, marginBottom:'6px' }}>
                      {inviteInfo.company_name}
                    </div>
                    <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                      <span style={{ fontSize:'12px', color:COLORS.textSecondary }}>Ваша роль:</span>
                      <span style={{ fontSize:'12px', fontWeight:700, color:'#4A4AC4', background:'#E3E3FA',
                        padding:'2px 10px', borderRadius:'8px', textTransform:'uppercase', letterSpacing:'0.5px' }}>
                        {ROLE_LABELS_AUTH[inviteInfo.role] || inviteInfo.role}
                      </span>
                    </div>
                  </div>
                ) : (
                  <div style={{ background:'#fef2f2', borderRadius:'12px', padding:'16px', border:'1px solid #fecaca',
                    color:'#dc2626', fontSize:'13px', fontWeight:500 }}>
                    ❌ Приглашение недействительно или истекло
                  </div>
                )}
              </div>
            )}

            {/* Форма */}
            <form onSubmit={isInvite ? handleAcceptInvite : (mode==='login' ? handleLogin : handleRegister)}
              style={{ display:'flex', flexDirection:'column', gap:'16px' }}>

              {/* Поле email */}
              {(!isInvite || isOpen) && (
                <Field label="Email *" type="email" value={email} onChange={e=>setEmail(e.target.value)}
                  placeholder="your@company.com" disabled={isInvite && !isOpen && inviteInfo?.email} />
              )}
              {isInvite && !isOpen && inviteInfo?.email && (
                <div style={{ padding:'11px 14px', background:COLORS.grayLight, borderRadius:'9px', fontSize:'14px',
                  color:COLORS.textSecondary, border:`1.5px solid ${COLORS.border}` }}>
                  📧 {inviteInfo.email}
                </div>
              )}

              {/* ФИО — для регистрации и инвайта */}
              {(mode === 'register' || isInvite) && (
                <Field label="Полное имя *" value={fullName} onChange={e=>setFullName(e.target.value)}
                  placeholder="Иван Иванов" />
              )}

              {/* Название компании — только при регистрации */}
              {mode === 'register' && (
                <Field label="Название компании" value={companyName} onChange={e=>setCompanyName(e.target.value)}
                  placeholder="ООО Моя Компания" />
              )}

              {/* Налоговый режим — только при регистрации */}
              {mode === 'register' && (
                <div>
                  <label style={{ display:'block', marginBottom:'8px', fontWeight:500, fontSize:'14px', color:COLORS.text }}>
                    Налоговый режим
                  </label>
                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px' }}>
                    {TAX_REGIMES.map(r => (
                      <div key={r.code} onClick={() => setRegTaxRegime(r.code)}
                        style={{ padding:'10px 12px', borderRadius:'9px', cursor:'pointer',
                          border:`2px solid ${regTaxRegime===r.code ? COLORS.accent : COLORS.border}`,
                          background: regTaxRegime===r.code ? COLORS.blueLight : '#fff',
                          transition:'all 0.15s' }}>
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                          <span style={{ fontWeight:700, fontSize:'12px', color: regTaxRegime===r.code ? COLORS.accent : COLORS.text }}>
                            {r.icon} {r.name}
                          </span>
                          <span style={{ fontSize:'11px', fontWeight:700, color: regTaxRegime===r.code ? COLORS.accent : COLORS.textSecondary }}>{r.rate}</span>
                        </div>
                        <div style={{ fontSize:'11px', color:COLORS.textSecondary, marginTop:'3px', lineHeight:'1.4' }}>{r.desc}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <Field label="Пароль *" type="password" value={password} onChange={e=>setPassword(e.target.value)}
                placeholder="Минимум 8 символов" />

              {/* Подтверждение пароля — для регистрации и инвайта */}
              {(mode === 'register' || isInvite) && (
                <Field label="Повторите пароль *" type="password" value={password2} onChange={e=>setPassword2(e.target.value)}
                  placeholder="Повторите пароль" />
              )}

              {error && (
                <div style={{ background:'#fef2f2', color:'#dc2626', padding:'12px 16px', borderRadius:'9px',
                  fontSize:'13px', fontWeight:500, border:'1px solid #fecaca' }}>
                  ⚠️ {error}
                </div>
              )}

              <button type="submit" disabled={loading || (isInvite && inviteLoading)}
                style={{ padding:'13px', background: loading ? COLORS.border : COLORS.accent, color:'#fff',
                  border:'none', borderRadius:'10px', fontWeight:700, fontSize:'15px',
                  cursor: loading ? 'not-allowed' : 'pointer', fontFamily:'Onest,sans-serif',
                  boxShadow:'0 4px 12px rgba(91,91,214,0.3)', transition:'all 0.2s', marginTop:'4px' }}
                onMouseEnter={e => { if(!loading) e.target.style.background='#4A4AC4'; }}
                onMouseLeave={e => { if(!loading) e.target.style.background=COLORS.accent; }}>
                {loading ? 'Подождите…'
                  : isInvite ? '✓ Принять приглашение и войти'
                  : mode === 'login' ? 'Войти в систему'
                  : 'Создать компанию'}
              </button>

              {/* Переход между login/register */}
              {!isInvite && (
                <div style={{ textAlign:'center', fontSize:'13px', color:COLORS.textSecondary, marginTop:'4px' }}>
                  {mode === 'login' ? (
                    <>Нет аккаунта?{' '}
                      <span onClick={() => { setMode('register'); setError(''); }}
                        style={{ color:COLORS.accent, cursor:'pointer', fontWeight:600 }}>
                        Создать компанию
                      </span>
                    </>
                  ) : (
                    <>Уже есть аккаунт?{' '}
                      <span onClick={() => { setMode('login'); setError(''); }}
                        style={{ color:COLORS.accent, cursor:'pointer', fontWeight:600 }}>
                        Войти
                      </span>
                    </>
                  )}
                </div>
              )}
            </form>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // НОВЫЕ ЭКРАНЫ: Projects, Budgets, PaymentRequests, Payroll, Assets, Banks, Documents
    // ─────────────────────────────────────────────────────────────────────────────

    const Projects = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        description: '',
        start_date: '',
        end_date: '',
        status: 'active',
      });

      const fetchProjects = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/projects`);
        if (res.success) {
          const projectsList = res.data.projects || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setProjects(projectsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchProjects();
      }, [companyId]);

      const handleAdd = async () => {
        if (!formData.name) {
          setToast({ type: 'error', message: 'Укажите название' });
          return;
        }
        const res = await apiCall('POST', `/companies/${companyId}/projects`, formData);
        if (res.success) {
          setToast({ type: 'success', message: 'Проект создан' });
          setShowModal(false);
          setFormData({ name: '', description: '', start_date: '', end_date: '', status: 'active' });
          fetchProjects();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить проект?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/projects/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Проект удалён' });
          fetchProjects();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Проекты</h2>
            {canWrite('projects') && <Button onClick={() => setShowModal(true)}>+ Создать проект</Button>}
          </div>

          {projects.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📁</div>
              <div style={{ marginBottom: '16px' }}>Проектов нет</div>
              {canWrite('projects') && <Button onClick={() => setShowModal(true)}>Создать первый проект</Button>}
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Название</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Статус</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата начала</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата конца</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {projects.map((p) => (
                    <tr key={p.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                      <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{p.name}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px' }}>
                        <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: COLORS.blueLight, color: COLORS.accent, fontWeight: 500 }}>
                          {p.status === 'active' ? '🟢 Активный' : '🟡 Завершён'}
                        </span>
                      </td>
                      <td style={{ padding: '12px 16px', fontSize: '14px', color: COLORS.textSecondary }}>{formatDate(p.start_date)}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px', color: COLORS.textSecondary }}>{formatDate(p.end_date)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                        {canDelete() && <button onClick={() => handleDelete(p.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.red }}>🗑️</button>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Создать проект">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                <Input value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} placeholder="Название проекта" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Описание</label>
                <textarea style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontFamily: 'Inter', fontSize: '14px', minHeight: '100px' }} value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата начала</label>
                  <Input type="date" value={formData.start_date} onChange={(e) => setFormData({ ...formData, start_date: e.target.value })} />
                </div>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата конца</label>
                  <Input type="date" value={formData.end_date} onChange={(e) => setFormData({ ...formData, end_date: e.target.value })} />
                </div>
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => setShowModal(false)}>Отмена</Button>
                <Button onClick={handleAdd}>Создать</Button>
              </div>
            </div>
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const Budgets = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [data, setData]         = useState(null);
      const [loading, setLoading]   = useState(true);
      const [month, setMonth]       = useState(new Date().getMonth() + 1);
      const [year, setYear]         = useState(new Date().getFullYear());
      const [toast, setToast]       = useState(null);
      const [editingId, setEditingId] = useState(null);
      const [editValue, setEditValue] = useState('');

      const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

      const load = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/budgets/plan-fact?year=${year}&month=${month}`);
        if (res.success) setData(res.data);
        setLoading(false);
      };

      useEffect(() => { if (companyId) load(); }, [companyId, year, month]);

      const savePlan = async (categoryId) => {
        const plan = parseFloat(editValue);
        if (!plan || plan < 0) { setToast({ type: 'error', message: 'Введите корректную сумму' }); return; }
        const res = await apiCall('POST', `/companies/${companyId}/budgets/save`, {
          category_id: categoryId, month, year, plan_amount: plan,
        });
        if (res.success) {
          setToast({ type: 'success', message: 'План сохранён' });
          setEditingId(null); setEditValue(''); load();
        } else setToast({ type: 'error', message: res.error });
      };

      // Цвет прогресс-бара: расход — чем больше факт, тем опаснее; доход — наоборот
      const barColor = (pct, type) => {
        if (type === 'income') {
          if (pct >= 100) return COLORS.green;
          if (pct >= 70)  return '#f59e0b';
          return COLORS.red;
        } else {
          if (pct <= 90)  return COLORS.green;
          if (pct <= 110) return '#f59e0b';
          return COLORS.red;
        }
      };

      const BudgetRow = ({ b }) => {
        const id = b.category_id;
        const isEditing = editingId === id;
        const plan = parseFloat(b.plan_amount) || 0;
        const fact = parseFloat(b.fact_amount) || 0;
        const pct  = plan > 0 ? Math.round((fact / plan) * 100) : (fact > 0 ? 999 : 0);
        const dev  = fact - plan;
        const color = barColor(pct, b.category_type);

        return (
          <div style={{ padding: '14px 20px', borderBottom: `1px solid ${COLORS.border}`, display: 'flex', alignItems: 'center', gap: '16px', flexWrap: 'wrap' }}>
            <div style={{ flex: '2', minWidth: '140px', fontWeight: 500, fontSize: '14px' }}>{b.category_name}</div>

            {/* План */}
            <div style={{ flex: '1', minWidth: '120px', textAlign: 'right' }}>
              {isEditing ? (
                <div style={{ display: 'flex', gap: '6px', justifyContent: 'flex-end', alignItems: 'center' }}>
                  <input type="number" value={editValue} onChange={e => setEditValue(e.target.value)}
                    autoFocus onKeyDown={e => { if (e.key==='Enter') savePlan(id); if (e.key==='Escape') setEditingId(null); }}
                    style={{ width: '110px', padding: '6px 10px', border: `1.5px solid ${COLORS.accent}`, borderRadius: '6px', fontSize: '14px', textAlign: 'right', fontFamily: 'Inter, sans-serif' }} />
                  <button onClick={() => savePlan(id)} style={{ background: COLORS.green, border:'none', color:'#fff', borderRadius:'6px', padding:'5px 8px', cursor:'pointer', fontSize:'13px' }}>✓</button>
                  <button onClick={() => setEditingId(null)} style={{ background: COLORS.grayLight, border:'none', borderRadius:'6px', padding:'5px 8px', cursor:'pointer', fontSize:'13px' }}>✕</button>
                </div>
              ) : (
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', justifyContent: 'flex-end' }}>
                  <span style={{ color: plan===0 ? COLORS.textSecondary : COLORS.text }}>{plan===0 ? '—' : formatCurrency(plan)}</span>
                  {canWrite('budgets') && <button onClick={() => { setEditingId(id); setEditValue(plan > 0 ? String(plan) : ''); }}
                    style={{ background:'none', border:'none', cursor:'pointer', color: COLORS.textSecondary, fontSize:'14px', padding:'2px 4px' }} title="Изменить план">✎</button>}
                </div>
              )}
            </div>

            {/* Факт */}
            <div style={{ flex:'1', minWidth:'100px', textAlign:'right', fontWeight:600, fontSize:'14px', color: fact===0 ? COLORS.textSecondary : COLORS.text }}>
              {fact===0 ? '—' : formatCurrency(fact)}
            </div>

            {/* Прогресс */}
            <div style={{ flex:'2', minWidth:'180px' }}>
              {plan > 0 ? (
                <>
                  <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'4px', fontSize:'12px' }}>
                    <span style={{ color: color, fontWeight:700 }}>{Math.min(pct,999)}%</span>
                    <span style={{ color: dev===0 ? COLORS.textSecondary : dev > 0 ? COLORS.green : COLORS.red, fontWeight:600 }}>
                      {dev===0 ? '0' : (dev > 0 ? '+' : '')}{formatCurrency(dev)}
                    </span>
                  </div>
                  <div style={{ height:'8px', borderRadius:'4px', background: COLORS.border, overflow:'hidden' }}>
                    <div style={{ height:'100%', borderRadius:'4px', width: Math.min(pct,100)+'%', background: color, transition:'width 0.4s ease' }} />
                  </div>
                </>
              ) : (
                <div style={{ fontSize:'12px', color: COLORS.textSecondary }}>
                  {fact > 0 ? <span style={{ color: COLORS.red }}>⚠️ Нет плана</span> : 'Установите план →'}
                </div>
              )}
            </div>
          </div>
        );
      };

      if (loading) return <div style={{ padding:'24px' }}><LoadingSpinner /></div>;

      const rows = data?.rows || [];
      const income  = rows.filter(r => r.category_type === 'income');
      const expense = rows.filter(r => r.category_type === 'expense');

      const totalIncomePlan  = parseFloat(data?.total_income_plan  || 0);
      const totalIncomeFact  = parseFloat(data?.total_income_fact  || 0);
      const totalExpensePlan = parseFloat(data?.total_expense_plan || 0);
      const totalExpenseFact = parseFloat(data?.total_expense_fact || 0);
      const netPlan = parseFloat(data?.net_plan || 0);
      const netFact = parseFloat(data?.net_fact || 0);

      const SummaryCard = ({ label, plan, fact, type }) => {
        const pct = plan > 0 ? Math.round((fact/plan)*100) : null;
        const color = pct != null ? barColor(pct, type) : COLORS.textSecondary;
        return (
          <div style={{ background: COLORS.white, borderRadius:'12px', padding:'18px 22px', flex:1, minWidth:'180px', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
            <div style={{ fontSize:'12px', color: COLORS.textSecondary, marginBottom:'8px' }}>{label}</div>
            <div style={{ fontSize:'22px', fontWeight:700, color: type==='net' ? (fact>=0?COLORS.green:COLORS.red) : COLORS.text }}>{formatCurrency(fact)}</div>
            <div style={{ fontSize:'12px', color: COLORS.textSecondary, marginTop:'4px' }}>
              план: {formatCurrency(plan)}
              {pct != null && <span style={{ marginLeft:'8px', fontWeight:700, color }}>{pct}%</span>}
            </div>
          </div>
        );
      };

      return (
        <div style={{ padding:'24px' }}>
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

          {/* Шапка */}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px', flexWrap:'wrap', gap:'12px' }}>
            <div style={{ fontSize:'13px', color: COLORS.textSecondary }}>
              {MONTHS[month-1]} {year} — нажмите ✎ чтобы установить план по статье
            </div>
            <div style={{ display:'flex', gap:'8px' }}>
              <select value={month} onChange={e => setMonth(parseInt(e.target.value))}
                style={{ padding:'8px 12px', borderRadius:'8px', border:`1px solid ${COLORS.border}`, fontFamily:'Inter, sans-serif' }}>
                {MONTHS.map((m,i) => <option key={i} value={i+1}>{m}</option>)}
              </select>
              <select value={year} onChange={e => setYear(parseInt(e.target.value))}
                style={{ padding:'8px 12px', borderRadius:'8px', border:`1px solid ${COLORS.border}`, fontFamily:'Inter, sans-serif' }}>
                {[2024,2025,2026,2027].map(y => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
          </div>

          {/* Сводные карточки */}
          <div style={{ display:'flex', gap:'14px', marginBottom:'24px', flexWrap:'wrap' }}>
            <SummaryCard label="📈 Доходы (факт / план)" plan={totalIncomePlan}  fact={totalIncomeFact}  type="income" />
            <SummaryCard label="📉 Расходы (факт / план)" plan={totalExpensePlan} fact={totalExpenseFact} type="expense" />
            <SummaryCard label="💎 Прибыль (факт / план)" plan={netPlan}          fact={netFact}          type="net" />
          </div>

          {/* Инструкция если все планы нулевые */}
          {rows.every(r => parseFloat(r.plan_amount)===0) && (
            <div style={{ background:'#EFEFFB', border:'1px solid #bfdbfe', borderRadius:'12px', padding:'16px 20px', marginBottom:'20px', display:'flex', alignItems:'center', gap:'12px' }}>
              <span style={{ fontSize:'20px' }}>💡</span>
              <div style={{ fontSize:'13px', color:'#1e40af' }}>
                <b>Как использовать бюджеты:</b> добавьте операции с категорией (Аренда, Зарплата и т.д.),
                затем нажмите ✎ рядом с нужной статьёй и установите плановую сумму.
              </div>
            </div>
          )}

          {/* Доходы */}
          {income.length > 0 && (
            <div style={{ background: COLORS.white, borderRadius:'14px', overflow:'hidden', boxShadow:'0 1px 4px rgba(0,0,0,0.07)', marginBottom:'16px' }}>
              <div style={{ padding:'12px 20px', background:'#f0fdf4', borderBottom:`1px solid ${COLORS.border}`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <span style={{ fontWeight:700, fontSize:'14px', color: COLORS.green }}>📈 Доходы</span>
                <span style={{ fontSize:'13px', color: COLORS.textSecondary }}>Статья · План · Факт · Выполнение</span>
              </div>
              {income.map(b => <BudgetRow key={b.category_id} b={b} />)}
            </div>
          )}

          {/* Расходы */}
          {expense.length > 0 && (
            <div style={{ background: COLORS.white, borderRadius:'14px', overflow:'hidden', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
              <div style={{ padding:'12px 20px', background:'#fef2f2', borderBottom:`1px solid ${COLORS.border}`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <span style={{ fontWeight:700, fontSize:'14px', color: COLORS.red }}>📉 Расходы</span>
                <span style={{ fontSize:'13px', color: COLORS.textSecondary }}>Статья · План · Факт · Выполнение</span>
              </div>
              {expense.map(b => <BudgetRow key={b.category_id} b={b} />)}
            </div>
          )}
        </div>
      );
    };

    const PaymentRequests = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [formData, setFormData] = useState({
        description: '',
        amount: '',
        account_id: '',
        date: new Date().toISOString().split('T')[0],
      });

      const fetchRequests = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/payment-requests`);
        if (res.success) {
          const requestsList = res.data['payment-requests'] || res.data.requests || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setRequests(requestsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchRequests();
      }, [companyId]);

      const handleCreate = async () => {
        if (!formData.amount || !formData.date) {
          setToast({ type: 'error', message: 'Заполните обязательные поля' });
          return;
        }
        const payload = {
          amount: parseFloat(formData.amount),
          planned_date: formData.date,
          description: formData.description || ''
        };
        const res = await apiCall('POST', `/companies/${companyId}/payment-requests`, payload);
        if (res.success) {
          setToast({ type: 'success', message: 'Заявка создана' });
          setShowModal(false);
          setFormData({ description: '', amount: '', account_id: '', date: new Date().toISOString().split('T')[0] });
          fetchRequests();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleApprove = async (id) => {
        const res = await apiCall('PATCH', `/companies/${companyId}/payment-requests/${id}/status`, { status: 'approved' });
        if (res.success) {
          setToast({ type: 'success', message: 'Заявка одобрена' });
          fetchRequests();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleReject = async (id) => {
        const res = await apiCall('PATCH', `/companies/${companyId}/payment-requests/${id}/status`, { status: 'rejected', rejection_reason: 'Отклонено' });
        if (res.success) {
          setToast({ type: 'success', message: 'Заявка отклонена' });
          fetchRequests();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить заявку?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/payment-requests/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Заявка удалена' });
          fetchRequests();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      const statusColor = (status) => {
        if (status === 'approved') return { bg: COLORS.greenLight, color: COLORS.green, label: '✓ Одобрена' };
        if (status === 'rejected') return { bg: COLORS.redLight, color: COLORS.red, label: '✕ Отклонена' };
        return { bg: COLORS.yellowLight, color: COLORS.yellow, label: '⏳ Ожидает' };
      };

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Заявки на оплату</h2>
            {canWrite('payment-requests') && <Button onClick={() => setShowModal(true)}>+ Создать заявку</Button>}
          </div>

          {requests.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📋</div>
              <div style={{ marginBottom: '16px' }}>Заявок нет</div>
              {canWrite('payment-requests') && <Button onClick={() => setShowModal(true)}>Создать первую заявку</Button>}
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Описание</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Сумма</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Статус</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {requests.map((r) => {
                    const status = statusColor(r.status || 'pending');
                    return (
                      <tr key={r.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                        <td style={{ padding: '12px 16px', fontSize: '14px' }}>{formatDate(r.date)}</td>
                        <td style={{ padding: '12px 16px', fontSize: '14px' }}>{r.description}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600 }}>{formatCurrency(r.amount)}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'center' }}>
                          <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: status.bg, color: status.color, fontWeight: 500 }}>
                            {status.label}
                          </span>
                        </td>
                        <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                          {(r.status || 'pending') === 'pending' && (
                            <>
                              <button onClick={() => canApprove() && handleApprove(r.id)} style={{ background: 'none', border: 'none', cursor: canApprove() ? 'pointer' : 'default', fontSize: '16px', marginRight: '8px', color: canApprove() ? COLORS.green : COLORS.border }}>✅</button>
                              <button onClick={() => canApprove() && handleReject(r.id)} style={{ background: 'none', border: 'none', cursor: canApprove() ? 'pointer' : 'default', fontSize: '16px', marginRight: '8px', color: canApprove() ? COLORS.red : COLORS.border }}>❌</button>
                            </>
                          )}
                          {(r.status === 'pending' || !r.status) && (
                            <button onClick={() => handleDelete(r.id)} style={{ background: 'none', border: 'none', cursor: canDelete() ? 'pointer' : 'default', fontSize: '16px', color: canDelete() ? COLORS.red : COLORS.border, opacity: canDelete() ? 1 : 0.3 }} disabled={!canDelete()}>🗑️</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Создать заявку на оплату">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Описание *</label>
                <Input value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} placeholder="Назначение платежа" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Сумма *</label>
                <Input type="number" value={formData.amount} onChange={(e) => setFormData({ ...formData, amount: e.target.value })} placeholder="0" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата</label>
                <Input type="date" value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} />
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => setShowModal(false)}>Отмена</Button>
                <Button onClick={handleCreate}>Создать</Button>
              </div>
            </div>
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const Payroll = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [tab, setTab] = useState('employees');
      const [employees, setEmployees] = useState([]);
      const [payrolls, setPayrolls] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [formData, setFormData] = useState({
        full_name: '',
        position: '',
        salary: '',
        hire_date: new Date().toISOString().split('T')[0],
      });

      const fetchEmployees = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/employees`);
        if (res.success) {
          const employeesList = res.data.employees || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setEmployees(employeesList);
        }
        setLoading(false);
      };

      const fetchPayrolls = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/payroll`);
        if (res.success) {
          const payrollsList = res.data.payroll || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setPayrolls(payrollsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        if (tab === 'employees') fetchEmployees();
        else fetchPayrolls();
      }, [companyId, tab]);

      const handleAddEmployee = async () => {
        if (!formData.full_name) {
          setToast({ type: 'error', message: 'Заполните все обязательные поля' });
          return;
        }
        const payload = {
          name: formData.full_name,
          position: formData.position || null,
          base_salary: parseFloat(formData.salary) || null
        };
        const res = await apiCall('POST', `/companies/${companyId}/employees`, payload);
        if (res.success) {
          setToast({ type: 'success', message: 'Сотрудник добавлен' });
          setShowModal(false);
          setFormData({ full_name: '', position: '', salary: '', hire_date: new Date().toISOString().split('T')[0] });
          fetchEmployees();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDeleteEmployee = async (id) => {
        if (!confirm('Удалить сотрудника?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/employees/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Сотрудник удалён' });
          fetchEmployees();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Сотрудники и ФОТ</h2>
            {tab === 'employees' && canWrite('payroll') && <Button onClick={() => setShowModal(true)}>+ Добавить сотрудника</Button>}
          </div>

          <div style={{ display: 'flex', gap: '12px', marginBottom: '24px' }}>
            <button onClick={() => setTab('employees')} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === 'employees' ? COLORS.accent : COLORS.grayLight, color: tab === 'employees' ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>
              Сотрудники
            </button>
            <button onClick={() => setTab('payroll')} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === 'payroll' ? COLORS.accent : COLORS.grayLight, color: tab === 'payroll' ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>
              Расчётные листки
            </button>
          </div>

          {tab === 'employees' ? (
            employees.length === 0 ? (
              <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
                <div style={{ fontSize: '32px', marginBottom: '12px' }}>👷</div>
                <div style={{ marginBottom: '16px' }}>Сотрудников нет</div>
                {canWrite('payroll') && <Button onClick={() => setShowModal(true)}>Добавить первого сотрудника</Button>}
              </div>
            ) : (
              <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                      <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>ФИО</th>

    const Assets = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [assets, setAssets] = useState([]);

        name: '',
        purchase_cost: '',
        purchase_date: new Date().toISOString().split('T')[0],
        amortization_months: '',
      });

      const fetchAssets = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/assets`);
        if (res.success) {
          const assetsList = res.data.assets || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setAssets(assetsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchAssets();
      }, [companyId]);

      const handleAdd = async () => {
        if (!formData.name || !formData.purchase_cost || !formData.amortization_months) {
          setToast({ type: 'error', message: 'Заполните обязательные поля' });
          return;
        }
        const payload = {
          name: formData.name,
          purchase_cost: parseFloat(formData.purchase_cost) || 0,
          purchase_date: formData.purchase_date,
          amortization_months: parseInt(formData.amortization_months) || 0,
        };
        const res = await apiCall('POST', `/companies/${companyId}/assets`, payload);
        if (res.success) {
          setToast({ type: 'success', message: 'Основное средство добавлено' });
          setShowModal(false);
          setFormData({ name: '', purchase_cost: '', purchase_date: new Date().toISOString().split('T')[0], amortization_months: '' });
          fetchAssets();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить ОС?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/assets/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'ОС удалено' });
          fetchAssets();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleAmortize = async () => {
        if (!confirm('Начислить амортизацию за текущий месяц?')) return;
        const res = await apiCall('POST', `/companies/${companyId}/assets/amortize`, {});
        if (res.success) {
          setToast({ type: 'success', message: 'Амортизация начислена' });
          fetchAssets();
