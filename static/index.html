          <div style={{ fontSize: '26px', fontWeight: 700, color: valueColor || COLORS.text }}>{formatCurrency(value)}</div>
          {change && <div style={{ fontSize: '11px', color: COLORS.textSecondary, marginTop: '4px' }}>vs прошлый месяц</div>}
        </div>
      );

      // Рендер виджета по id — функция вместо объекта с JSX
      const renderWidget = (id) => {
        const W = ({ children, title, link, linkLabel }) => (
          <div style={{ background: COLORS.white, borderRadius: '14px', padding: '22px', border: '1px solid ' + COLORS.border }}>
            {title && (
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px' }}>
                <div style={{ fontWeight:600, fontSize:'15px' }}>{title}</div>
                {link && <a href={link} style={{ color: COLORS.accent, textDecoration:'none', fontSize:'13px' }}>{linkLabel || 'Все →'}</a>}
              </div>
            )}
            {children}
          </div>
        );
        if (id === 'kpi') return (
          <div key="kpi" style={{ display:'flex', gap:'14px', flexWrap:'wrap' }}>
            <KpiCard icon="revenue" title="Выручка (месяц)"  value={curPl ? curPl.revenue : 0}    change={revChg}  valueColor={COLORS.green} />
            <KpiCard icon="expense" title="Расходы (месяц)"  value={curPl ? curPl.opex : 0}       change={expChg}  valueColor={COLORS.red} />
            <KpiCard icon="profit" title="Прибыль (месяц)"  value={curPl ? curPl.net_income : 0} change={profChg} valueColor={curPl && curPl.net_income >= 0 ? COLORS.green : COLORS.red} />
            <KpiCard icon="balance" title="Общий баланс"     value={totalBalance}                  valueColor={totalBalance >= 0 ? COLORS.text : COLORS.red} />
          </div>
        );
        if (id === 'chart') return (
          <div key="chart" style={{ background: COLORS.white, borderRadius:'14px', padding:'22px', border:'1px solid ' + COLORS.border }}>
            <div style={{ fontWeight:600, marginBottom:'16px', fontSize:'15px' }}>Доходы / Расходы по месяцам</div>
            <canvas ref={chartRef} style={{ maxHeight:'240px' }} />
          </div>
        );
        if (id === 'accounts') return (
          <W key="accounts" title="🏦 Счета" link="#settings" linkLabel="Управление →">
            {accounts.length === 0
              ? <div style={{ color:COLORS.textSecondary, textAlign:'center', padding:'20px 0', fontSize:'13px' }}>Счетов нет</div>
              : <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                  {accounts.map(acc => {
                    const bal = parseFloat(acc.current_balance || 0);
                    const icons = { CHECKING:'🏛', CASH:'💵', SAVINGS:'🐷', CREDIT:'💳', INVESTMENT:'📈' };
                    const ico = icons[(acc.account_type||'').toUpperCase()] || '🏦';
                    return (
                      <div key={acc.id} style={{ display:'flex', alignItems:'center', gap:'12px', padding:'10px 12px', borderRadius:'8px', background:COLORS.grayLight }}>
                        <span style={{ fontSize:'20px' }}>{ico}</span>
                        <div style={{ flex:1 }}>
                          <div style={{ fontSize:'13px', fontWeight:500 }}>{acc.name}</div>
                          <div style={{ fontSize:'11px', color:COLORS.textSecondary }}>{acc.currency}</div>
                        </div>
                        <div style={{ fontWeight:700, color:bal>=0?COLORS.text:COLORS.red, fontSize:'14px' }}>{formatCurrency(bal)}</div>
                      </div>
                    );
                  })}
                  <div style={{ borderTop:'1px solid '+COLORS.border, paddingTop:'10px', display:'flex', justifyContent:'space-between', fontSize:'14px', fontWeight:700 }}>
                    <span>Итого</span>
                    <span style={{ color:totalBalance>=0?COLORS.green:COLORS.red }}>{formatCurrency(totalBalance)}</span>
                  </div>
                </div>
            }
          </W>
        );
        if (id === 'transactions') return (
          <W key="transactions" title="💳 Последние операции" link="#transactions">
            {transactions.length === 0
              ? <div style={{ color:COLORS.textSecondary, textAlign:'center', padding:'20px 0', fontSize:'13px' }}>Операций нет</div>
              : <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
                  {transactions.map((tx, i) => {
                    const isInc = (tx.transaction_type||'').toLowerCase() === 'income';
                    return (
                      <div key={i} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom: i < transactions.length-1 ? '1px solid '+COLORS.border : 'none' }}>
                        <div>
                          <div style={{ fontSize:'13px', fontWeight:500 }}>{tx.description||'Операция'}</div>
                          <div style={{ fontSize:'11px', color:COLORS.textSecondary }}>{(tx.payment_date||'').split('T')[0]}</div>
                        </div>
                        <span style={{ fontWeight:700, fontSize:'14px', color:isInc?COLORS.green:COLORS.red }}>{isInc?'+':'-'}{formatCurrency(Math.abs(parseFloat(tx.amount)||0))}</span>
                      </div>
                    );
                  })}
                </div>
            }
          </W>
        );
        if (id === 'forecast') {
          const curBalance = accounts.reduce((s,a)=>s+parseFloat(a.current_balance||0),0);
          const avgDailyExpense = curPl ? (curPl.opex||0) / Math.max(new Date().getDate(),1) : 0;
          const forecastedBalance = forecast
            ? (forecast.forecasted_balance || 0)
            : curBalance - avgDailyExpense * 30;
          const burnRate = forecast ? (forecast.burn_rate||0) : avgDailyExpense;
          const gapRisk  = forecast ? forecast.cash_gap_risk : forecastedBalance < 0;
          return (
            <W key="forecast" title="🔮 Прогноз на 30 дней">
              {[
                { l:'Баланс сейчас', v: formatCurrency(curBalance),       c: COLORS.text },
                { l:'Прогноз',       v: formatCurrency(forecastedBalance), c: forecastedBalance>=0?COLORS.green:COLORS.red },
                { l:'Burn rate/день',v: formatCurrency(burnRate),          c: COLORS.red },
              ].map(function(item) {
                return (
                  <div key={item.l} style={{ display:'flex', justifyContent:'space-between', fontSize:'13px', marginBottom:'8px' }}>
                    <span style={{ color:COLORS.textSecondary }}>{item.l}</span>
                    <span style={{ fontWeight:700, color:item.c }}>{item.v}</span>
                  </div>
                );
              })}
              {gapRisk && <div style={{ marginTop:'8px', padding:'8px 12px', background:'#fef2f2', borderRadius:'8px', fontSize:'12px', color:COLORS.red, fontWeight:600 }}>⚠️ Риск кассового разрыва</div>}
            </W>
          );
        }
        if (id === 'summary') return (
          <W key="summary" title="📋 Сводка месяца">
            {[
              { l:'📈 Выручка (месяц)',        v: formatCurrency(curPl?.revenue || 0),    href:'#reports', color: COLORS.green },
              { l:'📉 Расходы (месяц)',         v: formatCurrency(curPl?.opex || 0),       href:'#reports', color: COLORS.red },
              { l:'💎 Прибыль (месяц)',         v: formatCurrency(curPl?.net_income || 0), href:'#reports', color: (curPl?.net_income||0)>=0?COLORS.green:COLORS.red },
              { l:'🎯 Сделок в воронке',        v: crmStats ? crmStats.pipeline : 0,       href:'#crm' },
              { l:'🔔 Алертов',                 v: alerts.unread_count||0,                 href:'#alerts', warn:(alerts.unread_count||0)>0 },
            ].map(function(item) {
              return (
                <div key={item.l} style={{ display:'flex', justifyContent:'space-between', fontSize:'13px', padding:'6px 0', borderBottom:'1px solid '+COLORS.border }}>
                  <a href={item.href} style={{ color:COLORS.textSecondary, textDecoration:'none' }}>{item.l}</a>
                  <span style={{ fontWeight:700, color: item.warn ? COLORS.red : (item.color || COLORS.text) }}>{item.v}</span>
                </div>
              );
            })}
          </W>
        );
        if (id === 'budgets') return budgetData ? (
          <W key="budgets" title="💰 Бюджеты (текущий месяц)" link="#budgets" linkLabel="Подробнее →">
            {(budgetData.rows||[]).filter(function(r){ return parseFloat(r.plan_amount)>0; }).slice(0,5).map(function(r) {
              var p = parseFloat(r.execution_pct)||0;
              var col = r.category_type==='income'
                ? (p>=100?COLORS.green : p>=70?'#f59e0b' : COLORS.red)
                : (p<=90?COLORS.green  : p<=110?'#f59e0b' : COLORS.red);
              return (
                <div key={r.category_id} style={{ marginBottom:'10px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', fontSize:'12px', marginBottom:'4px' }}>
                    <span style={{ fontWeight:500 }}>{r.category_name}</span>
                    <span style={{ color:col, fontWeight:700 }}>{Math.round(p)}%</span>
                  </div>
                  <div style={{ height:'6px', borderRadius:'3px', background:COLORS.border, overflow:'hidden' }}>
                    <div style={{ height:'100%', borderRadius:'3px', width:Math.min(p,100)+'%', background:col }} />
                  </div>
                </div>
              );
            })}
            {(budgetData.rows||[]).filter(function(r){ return parseFloat(r.plan_amount)>0; }).length===0 && (
              <div style={{ fontSize:'13px', color:COLORS.textSecondary, textAlign:'center', padding:'10px 0' }}>Планы не установлены</div>
            )}
          </W>
        ) : null;
        if (id === 'payments') return (
          <W key="payments" title="📅 Ближайшие платежи" link="#calendar" linkLabel="Календарь →">
            {payments.length===0
              ? <div style={{ fontSize:'13px', color:COLORS.textSecondary, textAlign:'center', padding:'10px 0' }}>Нет запланированных</div>
              : payments.map(function(p, i) {
                  return (
                    <div key={i} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom: i<payments.length-1?'1px solid '+COLORS.border:'none' }}>
                      <div>
                        <div style={{ fontSize:'13px', fontWeight:500 }}>{p.description||'Платёж'}</div>
                        <div style={{ fontSize:'11px', color:COLORS.textSecondary }}>{p.planned_date}</div>
                      </div>
                      <span style={{ fontWeight:700, fontSize:'14px', color:COLORS.accent }}>{formatCurrency(parseFloat(p.amount||0))}</span>
                    </div>
                  );
                })
            }
          </W>
        );
        return null;
      };

      const visibleWidgets = widgetOrder.filter(function(id){ return !hiddenWidgets.includes(id); });

      return (
        <div style={{ padding: '24px' }}>

          {/* Кнопка настройки */}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'16px' }}>
            <div style={{ fontSize:'15px', color: COLORS.text, fontWeight:700 }}>Дашборд</div>
            <button onClick={function(){ setShowSettings(true); }}
              style={{ padding:'8px 18px', border:'1px solid '+COLORS.border, borderRadius:'8px', background:COLORS.white, cursor:'pointer', fontSize:'13px', fontWeight:600, color:COLORS.text }}>
              ⚙️ Настроить дашборд
            </button>
          </div>

          {/* Виджеты */}
          <div style={{ display:'flex', flexDirection:'column', gap:'16px' }}>
            {visibleWidgets.map(function(id){ return renderWidget(id); })}
          </div>

          {/* Панель настройки */}
          {showSettings && (
            <div style={{ position:'fixed', top:0, left:0, right:0, bottom:0, background:'rgba(0,0,0,0.5)', display:'flex', alignItems:'flex-start', justifyContent:'flex-end', zIndex:1000 }}
              onClick={function(e){ if(e.target===e.currentTarget) setShowSettings(false); }}>
              <div style={{ background: COLORS.white, width:'360px', height:'100%', padding:'28px', overflowY:'auto', boxShadow:'-4px 0 30px rgba(0,0,0,0.15)' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px' }}>
                  <h3 style={{ fontSize:'18px', fontWeight:700 }}>⚙️ Настройка дашборда</h3>
                  <button onClick={()=>setShowSettings(false)} style={{ background:'none', border:'none', cursor:'pointer', fontSize:'20px', color: COLORS.textSecondary }}>×</button>
                </div>
                <div style={{ fontSize:'13px', color: COLORS.textSecondary, marginBottom:'16px' }}>
                  Включайте / выключайте виджеты и меняйте их порядок стрелками
                </div>

                {widgetOrder.map((id, idx) => {
                  const w = ALL_WIDGETS.find(x=>x.id===id);
                  if (!w) return null;
                  const isHidden = hiddenWidgets.includes(id);
                  return (
                    <div key={id} style={{ display:'flex', alignItems:'center', gap:'10px', padding:'12px 14px', borderRadius:'10px', marginBottom:'8px', background: isHidden?'#f9fafb':COLORS.grayLight, border:`1px solid ${COLORS.border}`, opacity: isHidden?0.6:1 }}>
                      {/* Toggle */}
                      <div onClick={()=>toggleWidget(id)} style={{ width:'36px', height:'20px', borderRadius:'10px', background: isHidden?'#cbd5e1':COLORS.accent, position:'relative', cursor:'pointer', transition:'background 0.2s', flexShrink:0 }}>
                        <div style={{ position:'absolute', top:'3px', left: isHidden?'3px':'19px', width:'14px', height:'14px', borderRadius:'50%', background:'#fff', transition:'left 0.2s' }} />
                      </div>
                      {/* Иконка и название */}
                      <span style={{ fontSize:'16px' }}>{w.icon}</span>
                      <span style={{ flex:1, fontSize:'13px', fontWeight:500 }}>{w.label}</span>
                      {/* Стрелки */}
                      <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
                        <button onClick={()=>moveWidget(id,-1)} disabled={idx===0}
                          style={{ background:'none', border:`1px solid ${COLORS.border}`, borderRadius:'4px', cursor:idx===0?'default':'pointer', fontSize:'11px', padding:'1px 5px', opacity:idx===0?0.3:1 }}>▲</button>
                        <button onClick={()=>moveWidget(id,1)} disabled={idx===widgetOrder.length-1}
                          style={{ background:'none', border:`1px solid ${COLORS.border}`, borderRadius:'4px', cursor:idx===widgetOrder.length-1?'default':'pointer', fontSize:'11px', padding:'1px 5px', opacity:idx===widgetOrder.length-1?0.3:1 }}>▼</button>
                      </div>
                    </div>
                  );
                })}

                <button onClick={resetConfig} style={{ marginTop:'16px', width:'100%', padding:'10px', background:'none', border:`1px solid ${COLORS.border}`, borderRadius:'8px', cursor:'pointer', fontSize:'13px', color: COLORS.textSecondary }}>
                  ↺ Сбросить к настройкам по умолчанию
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const Transactions = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [showImportModal, setShowImportModal] = useState(false);
      const [showParserModal, setShowParserModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [editingTx, setEditingTx] = useState(null);
      const [formData, setFormData] = useState({ date: new Date().toISOString().split('T')[0], description: '', amount: '', type: 'expense', account_id: '', category_id: '' });
      const [categories, setCategories] = useState([]);
      const getFromDate = () => { const d = new Date(); d.setMonth(d.getMonth() - 3); return d.toISOString().split('T')[0]; };
      const [fromDate, setFromDate] = useState(getFromDate());
      const [toDate, setToDate] = useState(new Date().toISOString().split('T')[0]);
      const [page, setPage] = useState(1);
      const [limit, setLimit] = useState(20);
      const [importFile, setImportFile] = useState(null);
      const [parserText, setParserText] = useState('');
      const [parserLoading, setParserLoading] = useState(false);
      const [accounts, setAccounts] = useState([]);
      const [selectedAccount, setSelectedAccount] = useState('');

      const fetchTransactions = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/transactions`);
        if (res.success) {
          const transactionsList = res.data.value || res.data.transactions || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setTransactions(transactionsList);
        }
        setLoading(false);
      };

      const fetchAccounts = async () => {
        const res = await apiCall('GET', `/companies/${companyId}/accounts`);
        if (res.success) {
          const accountsList = res.data.accounts || res.data.items || (Array.isArray(res.data) ? res.data : []);
          setAccounts(accountsList);
          if (accountsList.length > 0 && !selectedAccount) setSelectedAccount(accountsList[0].id);
        }
      };

      const fetchCategories = async () => {
        const res = await apiCall('GET', `/companies/${companyId}/categories`);
        if (res.success) {
          const list = res.data.categories || (Array.isArray(res.data) ? res.data : []);
          setCategories(list);
        }
      };

      useEffect(() => {
        fetchTransactions();
        fetchAccounts();
        fetchCategories();
      }, [companyId]);

      const handleAddTransaction = async () => {
        if (!formData.description || !formData.amount) {
          setToast({ type: 'error', message: 'Заполните все поля' });
          return;
        }
        const accountId = formData.account_id || (accounts.length > 0 ? accounts[0].id : null);
        if (!accountId) {
          setToast({ type: 'error', message: 'Сначала создайте счёт в Настройках' });
          return;
        }
        const payload = {
          account_id: accountId,
          description: formData.description,
          amount: parseFloat(formData.amount),
          transaction_type: formData.type === 'income' ? 'INCOME' : 'EXPENSE',
          payment_date: formData.date,
          ...(formData.category_id ? { category_id: formData.category_id } : {}),
        };
        const res = await apiCall('POST', `/companies/${companyId}/transactions`, payload);
        if (res.success) {
          setToast({ type: 'success', message: 'Операция добавлена' });
          setShowModal(false);
          setFormData({ date: new Date().toISOString().split('T')[0], description: '', amount: '', type: 'expense', account_id: '' });
          fetchTransactions();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить операцию?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/transactions/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Операция удалена' });
          fetchTransactions();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const openEdit = (tx) => {
        setEditingTx(tx);
        setFormData({
          date: (tx.payment_date || '').split('T')[0],
          description: tx.description || '',
          amount: String(Math.abs(parseFloat(tx.amount) || 0)),
          type: (tx.transaction_type || 'expense').toLowerCase() === 'income' ? 'income' : 'expense',
          account_id: tx.account_id || '',
          category_id: tx.category_id || '',
        });
        setShowModal(true);
      };

      const handleSaveTransaction = async () => {
        if (!formData.description || !formData.amount) {
          setToast({ type: 'error', message: 'Заполните все поля' }); return;
        }

        if (editingTx) {
          // Редактирование
          const payload = {
            description: formData.description,
            amount: parseFloat(formData.amount),
            transaction_type: formData.type === 'income' ? 'INCOME' : 'EXPENSE',
            payment_date: formData.date,
            ...(formData.category_id ? { category_id: formData.category_id } : {}),
          };
          const res = await apiCall('PATCH', `/companies/${companyId}/transactions/${editingTx.id}`, payload);
          if (res.success) {
            setToast({ type: 'success', message: 'Операция обновлена' });
            setShowModal(false); setEditingTx(null);
            setFormData({ date: new Date().toISOString().split('T')[0], description: '', amount: '', type: 'expense', account_id: '' });
            fetchTransactions();
          } else {
            setToast({ type: 'error', message: res.error });
          }
        } else {
          // Создание
          handleAddTransaction();
        }
      };

      const handleImport = async () => {
        if (!importFile) {
          setToast({ type: 'error', message: 'Выберите файл' });
          return;
        }
        const formDataUpload = new FormData();
        formDataUpload.append('file', importFile);
        try {
          const response = await fetch(`/api/v1/companies/${companyId}/transactions/import`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
            body: formDataUpload,
          });
          if (response.ok) {
            setToast({ type: 'success', message: 'Файл импортирован успешно' });
            setShowImportModal(false);
            setImportFile(null);
            fetchTransactions();
          } else {
            setToast({ type: 'error', message: 'Ошибка при импорте' });
          }
        } catch (err) {
          setToast({ type: 'error', message: 'Ошибка подключения' });
        }
      };


      const handleParseText = async () => {
        if (!parserText.trim()) {
          setToast({ type: 'error', message: 'Введите текст' });
          return;
        }
        if (!selectedAccount) {
          setToast({ type: 'error', message: 'Выберите счёт' });
          return;
        }
        setParserLoading(true);
        const res = await apiCall('POST', `/companies/${companyId}/transactions/parse-raw`, {
          raw_text: parserText,
          account_id: selectedAccount
        });
        setParserLoading(false);
        if (res.success) {
          setToast({ type: 'success', message: 'Операция распознана и добавлена' });
          setShowParserModal(false);
          setParserText('');
          fetchTransactions();
        } else {
          setToast({ type: 'error', message: res.error || 'Ошибка парсинга' });
        }
      };

      const filtered = transactions.filter((tx) => {
        const dateStr = tx.payment_date || tx.date || '';
        if (!dateStr) return true;
        const txDate = dateStr.split('T')[0];
        return txDate >= fromDate && txDate <= toDate;
      });

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Операции</h2>
            <div style={{ display: 'flex', gap: '12px' }}>
              <Button variant="outline" onClick={async () => {
                try {
                  const today = new Date().toISOString().split('T')[0];
                  await downloadFile(
                    `/api/v1/companies/${companyId}/export/transactions/csv?start_date=${fromDate}&end_date=${toDate}`,
                    `transactions_${fromDate}_${toDate}.csv`
                  );
                } catch(e) { alert('Ошибка экспорта: ' + e.message); }
              }}>📥 CSV</Button>
              <Button variant="outline" onClick={() => setShowImportModal(true)}>📥 Импорт 1С</Button>
              {canWrite('transactions') && <Button variant="outline" onClick={() => setShowParserModal(true)}>🤖 AI парсер</Button>}
              {canWrite('transactions') && <Button onClick={() => setShowModal(true)}>+ Добавить</Button>}
            </div>
          </div>

          <div style={{ background: COLORS.white, borderRadius: '12px', padding: '16px', marginBottom: '24px', border: `1px solid ${COLORS.border}`, display: 'flex', gap: '12px', alignItems: 'flex-end' }}>
            <div style={{ flex: 1 }}>
              <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', fontWeight: 500, color: COLORS.textSecondary }}>С даты</label>
              <Input type="date" value={fromDate} onChange={(e) => { setFromDate(e.target.value); setPage(1); }} />
            </div>
            <div style={{ flex: 1 }}>
              <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', fontWeight: 500, color: COLORS.textSecondary }}>По дату</label>
              <Input type="date" value={toDate} onChange={(e) => { setToDate(e.target.value); setPage(1); }} />
            </div>
            <Button variant="outline" onClick={() => { const d = new Date(); d.setMonth(d.getMonth() - 1); setFromDate(d.toISOString().split('T')[0]); setToDate(new Date().toISOString().split('T')[0]); setPage(1); }}>Сбросить</Button>
          </div>

          {transactions.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📋</div>
              <div style={{ marginBottom: '16px' }}>Операций нет</div>
              {canWrite('transactions') && <Button onClick={() => setShowModal(true)}>Добавить первую операцию</Button>}
            </div>
          ) : filtered.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📭</div>
              <div>В этом периоде операций нет</div>
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Описание</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Категория</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Сумма</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Тип</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((tx) => {
                    const txType = (tx.transaction_type || tx.type || '').toLowerCase();
                    const isIncome = txType === 'income';
                    return (
                      <tr key={tx.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                        <td style={{ padding: '12px 16px', fontSize: '14px' }}>{tx.payment_date ? tx.payment_date.split('T')[0] : ''}</td>
                        <td style={{ padding: '12px 16px', fontSize: '14px' }}>{tx.description}</td>
                        <td style={{ padding: '12px 16px', fontSize: '13px', color: tx.category_name ? COLORS.text : COLORS.textSecondary }}>
                          {tx.category_name || '—'}
                        </td>
                        <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 600, textAlign: 'right', color: isIncome ? COLORS.green : COLORS.red }}>
                          {isIncome ? '+' : '-'}{formatCurrency(Math.abs(tx.amount))}
                        </td>
                        <td style={{ padding: '12px 16px', textAlign: 'center' }}>
                          <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', fontWeight: 500, background: isIncome ? COLORS.greenLight : COLORS.redLight, color: isIncome ? COLORS.green : COLORS.red }}>
                            {isIncome ? '📈 Доход' : '📉 Расход'}
                          </span>
                        </td>
                        <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                          <div style={{ display: 'flex', gap: '8px', justifyContent: 'center' }}>
                            {canWrite('transactions') && <button onClick={() => openEdit(tx)} title="Редактировать" style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.accent }}>✎</button>}
                            <button onClick={() => canDelete() && handleDelete(tx.id)} title='Удалить' style={{ background: 'none', border: 'none', cursor: canDelete() ? 'pointer' : 'default', fontSize: '16px', color: canDelete() ? COLORS.red : COLORS.border }}>🗑️</button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => { setShowModal(false); setEditingTx(null); setFormData({ date: new Date().toISOString().split('T')[0], description: '', amount: '', type: 'expense', account_id: '' }); }} title={editingTx ? '✎ Редактировать операцию' : '+ Добавить операцию'}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата</label>
                <Input type="date" value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Описание</label>
                <Input placeholder="Назначение платежа" value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Сумма</label>
                <Input type="number" placeholder="0" value={formData.amount} onChange={(e) => setFormData({ ...formData, amount: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Тип</label>
                <select value={formData.type} onChange={(e) => setFormData({ ...formData, type: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                  <option value="expense">📉 Расход</option>
                  <option value="income">📈 Доход</option>
                </select>
              </div>
              {!editingTx && (
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Счёт *</label>
                  <select value={formData.account_id} onChange={(e) => setFormData({ ...formData, account_id: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                    <option value="">— Выбрать счёт —</option>
                    {accounts.map(acc => <option key={acc.id} value={acc.id}>{acc.name}</option>)}
                  </select>
                </div>
              )}
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Категория</label>
                <select value={formData.category_id} onChange={(e) => setFormData({ ...formData, category_id: e.target.value })}
                  style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif', background: '#fff' }}>
                  <option value="">— Без категории —</option>
                  {categories.filter(c => c.category_type === (formData.type === 'income' ? 'income' : 'expense')).map(c => (
                    <option key={c.id} value={c.id}>{c.name}</option>
                  ))}
                </select>
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => { setShowModal(false); setEditingTx(null); setFormData({ date: new Date().toISOString().split('T')[0], description: '', amount: '', type: 'expense', account_id: '' }); }}>Отмена</Button>
                <Button onClick={handleSaveTransaction}>{editingTx ? 'Сохранить' : 'Добавить'}</Button>
              </div>
            </div>
          </Modal>

          <Modal isOpen={showImportModal} onClose={() => { setShowImportModal(false); setImportFile(null); }} title="Импорт выписки 1С">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div style={{ fontSize: '13px', color: COLORS.textSecondary }}>
                Загрузите файл выписки в формате CSV или Excel
              </div>
              <input type="file" accept=".csv,.xlsx,.xls" onChange={(e) => setImportFile(e.target.files[0])} style={{ padding: '10px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px' }} />
              {importFile && <div style={{ fontSize: '13px', color: COLORS.green }}>✓ {importFile.name}</div>}
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => { setShowImportModal(false); setImportFile(null); }}>Отмена</Button>
                <Button onClick={handleImport}>Импортировать</Button>
              </div>
            </div>
          </Modal>

          <Modal isOpen={showParserModal} onClose={() => { setShowParserModal(false); setParserText(''); }} title="AI парсер операций">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div style={{ fontSize: '13px', color: COLORS.textSecondary }}>
                Введите текст (например: "Заплатил 5000 руб. Яндексу за рекламу")
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', fontWeight: 500 }}>Счёт *</label>
                <select value={selectedAccount} onChange={(e) => setSelectedAccount(e.target.value)} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                  <option value="">— Выбрать счёт —</option>
                  {accounts.map((acc) => <option key={acc.id} value={acc.id}>{acc.name || acc.code}</option>)}
                </select>
              </div>
              <textarea value={parserText} onChange={(e) => setParserText(e.target.value)} disabled={parserLoading} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontFamily: 'Inter', fontSize: '14px', minHeight: '80px', opacity: parserLoading ? 0.6 : 1 }} />
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => { setShowParserModal(false); setParserText(''); }} disabled={parserLoading}>Отмена</Button>
                <Button onClick={handleParseText} disabled={parserLoading}>{parserLoading ? '⏳ Распознавание...' : 'Распознать и сохранить'}</Button>
              </div>
            </div>
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const Calendar = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [payments, setPayments] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [startBalance, setStartBalance] = useState(0);
      const [loading, setLoading] = useState(true);
      const [month, setMonth] = useState(new Date().getMonth());
      const [year, setYear] = useState(new Date().getFullYear());
      const [selectedDay, setSelectedDay] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [addDate, setAddDate] = useState('');
      const [toast, setToast] = useState(null);
      const [form, setForm] = useState({ description: '', amount: '', type: 'expense', planned_date: '' });

      const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
      const today = new Date().toISOString().split('T')[0];

      const load = async () => {
        setLoading(true);
        // Берём payment-requests за ±2 месяца
        const from = new Date(year, month - 1, 1).toISOString().split('T')[0];
        const to   = new Date(year, month + 2, 0).toISOString().split('T')[0];
        const [r1, r2, r3] = await Promise.all([
          apiCall('GET', `/companies/${companyId}/payment-requests`),
          apiCall('GET', `/companies/${companyId}/transactions?limit=200`),
          apiCall('GET', `/companies/${companyId}/accounts`),
        ]);
        if (r1.success) {
          const list = r1.data['payment-requests'] || r1.data.requests || (Array.isArray(r1.data) ? r1.data : []);
          setPayments(list);
        }
        if (r2.success) {
          const list = r2.data.transactions || r2.data.value || r2.data.items || (Array.isArray(r2.data) ? r2.data : []);
          setTransactions(list);
        }
        if (r3.success) {
          const accs = r3.data.accounts || r3.data.value || r3.data.items || (Array.isArray(r3.data) ? r3.data : []);
          const total = accs.reduce((s, a) => s + parseFloat(a.current_balance || 0), 0);
          setStartBalance(total);
        }
        setLoading(false);
      };

      useEffect(() => { if (companyId) load(); }, [companyId, year, month]);

      const prevMonth = () => { if (month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
      const nextMonth = () => { if (month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

      // Строим карту дней для текущего месяца
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const firstDow = ((new Date(year, month, 1).getDay() + 6) % 7); // 0=Пн

      // Агрегируем по датам
      const dayMap = {};
      for (let d=1; d<=daysInMonth; d++) {
        const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        dayMap[key] = { income: 0, expense: 0, items: [] };
      }

      // Добавляем транзакции (факт)
      transactions.forEach(tx => {
        const d = (tx.payment_date||'').split('T')[0];
        if (dayMap[d]) {
          const amt = Math.abs(parseFloat(tx.amount)||0);
          const isIncome = (tx.transaction_type||'').toLowerCase()==='income';
          dayMap[d][isIncome?'income':'expense'] += amt;
          dayMap[d].items.push({ label: tx.description, amount: amt, type: isIncome?'income':'expense', source: 'fact' });
        }
      });

      // Добавляем запланированные платежи
      payments.forEach(p => {
        const d = (p.planned_date||'').split('T')[0];
        if (dayMap[d]) {
          const amt = parseFloat(p.amount)||0;
          const st  = p.status;
          const isIncome = (p.transaction_type||p.type||'').toLowerCase() === 'income';
          // Одобренные — считаем как факт (влияют на totalIncome/totalExpense)
          if (st === 'approved') {
            dayMap[d][isIncome ? 'income' : 'expense'] += amt;
          } else if (st !== 'rejected') {
            // Pending — только для прогноза кассового разрыва
            dayMap[d][isIncome ? 'projIncome' : 'projExpense'] = (dayMap[d][isIncome ? 'projIncome' : 'projExpense'] || 0) + amt;
          }
          dayMap[d].items.push({ label: p.description||'Платёж', amount: amt, type: 'planned', status: st, source: 'planned', id: p.id });
        }
      });

      // Накопительный баланс (стартует с реального остатка по счетам)
      let runBalance = startBalance;
      const rows = [];
      for (let d=1; d<=daysInMonth; d++) {
        const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const cell = dayMap[key];
        runBalance += (cell.income + (cell.projIncome||0)) - (cell.expense + (cell.projExpense||0));
        rows.push({ key, day: d, ...cell, runBalance });
      }

      const totalIncome  = rows.reduce((s,r)=>s+r.income,0);
      const totalExpense = rows.reduce((s,r)=>s+r.expense,0);
      const plannedAmt   = payments.filter(p=>p.planned_date?.startsWith(`${year}-${String(month+1).padStart(2,'0')}`) && p.status !== 'approved').reduce((s,p)=>s+parseFloat(p.amount||0),0);

      // Создание платежа
      const handleCreate = async () => {
        if (!form.amount || !form.planned_date) { setToast({type:'error',message:'Заполните сумму и дату'}); return; }
        const payload = { amount: parseFloat(form.amount), planned_date: form.planned_date, description: form.description||'Платёж', transaction_type: (form.type||'expense').toUpperCase() };
        const res = await apiCall('POST', `/companies/${companyId}/payment-requests`, payload);
        if (res.success) {
          setToast({type:'success',message:'Платёж запланирован'}); setShowAddModal(false);
          setForm({description:'',amount:'',type:'expense',planned_date:''}); load();
        } else setToast({type:'error',message:res.error});
      };

      const selectedItems = selectedDay ? (dayMap[selectedDay]?.items || []) : [];

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding:'24px' }}>
          {toast && <Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)} />}

          {/* Шапка */}
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px', flexWrap:'wrap', gap:'12px' }}>
            <div style={{ display:'flex', alignItems:'center', gap:'16px' }}>
              <button onClick={prevMonth} style={{ border:`1px solid ${COLORS.border}`, background:COLORS.white, borderRadius:'8px', padding:'8px 14px', cursor:'pointer', fontSize:'16px' }}>‹</button>
              <span style={{ fontWeight:700, fontSize:'18px', minWidth:'160px', textAlign:'center' }}>{MONTHS[month]} {year}</span>
              <button onClick={nextMonth} style={{ border:`1px solid ${COLORS.border}`, background:COLORS.white, borderRadius:'8px', padding:'8px 14px', cursor:'pointer', fontSize:'16px' }}>›</button>
            </div>
            {canWrite('calendar') && <Button onClick={()=>{ setForm({...form, planned_date: today}); setShowAddModal(true); }}>+ Запланировать платёж</Button>}
          </div>

          {/* Сводные карточки */}
          <div style={{ display:'flex', gap:'12px', marginBottom:'20px', flexWrap:'wrap' }}>
            {[
              { label:'📈 Поступления (факт)', val: totalIncome,  color: COLORS.green },
              { label:'📉 Выплаты (факт)',     val: totalExpense, color: COLORS.red },
              { label:'💰 Кассовый остаток',  val: totalIncome-totalExpense, color: totalIncome-totalExpense>=0?COLORS.green:COLORS.red },
              { label:'📋 Запланировано',     val: plannedAmt,   color: COLORS.accent },
            ].map(c => (
              <div key={c.label} style={{ background:COLORS.white, borderRadius:'12px', padding:'14px 18px', flex:1, minWidth:'160px', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
                <div style={{ fontSize:'12px', color:COLORS.textSecondary, marginBottom:'6px' }}>{c.label}</div>
                <div style={{ fontSize:'20px', fontWeight:700, color:c.color }}>{formatCurrency(c.val)}</div>
              </div>
            ))}
          </div>

          <div style={{ display:'flex', gap:'16px', alignItems:'flex-start' }}>
            {/* Сетка календаря */}
            <div style={{ flex:1, background:COLORS.white, borderRadius:'14px', overflow:'hidden', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
              {/* Дни недели */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', background:COLORS.grayLight, borderBottom:`1px solid ${COLORS.border}` }}>
                {DOW.map(d => (
                  <div key={d} style={{ padding:'10px 4px', textAlign:'center', fontSize:'12px', fontWeight:700, color:d==='Сб'||d==='Вс'?COLORS.red:COLORS.textSecondary }}>{d}</div>
                ))}
              </div>
              {/* Ячейки */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)' }}>
                {Array(firstDow).fill(null).map((_,i) => (
                  <div key={'e'+i} style={{ minHeight:'72px', borderRight:`1px solid ${COLORS.border}`, borderBottom:`1px solid ${COLORS.border}`, background:'#fafafa' }} />
                ))}
                {rows.map(r => {
                  const isToday    = r.key === today;
                  const isPast     = r.key < today;
                  const isSelected = selectedDay === r.key;
                  const hasItems   = r.items.length > 0;
                  const hasPlanned = r.items.some(i=>i.source==='planned');
                  const isGap      = r.runBalance < 0;
                  const dow = ((new Date(r.key).getDay()+6)%7);
                  const isWeekend = dow===5||dow===6;
                  return (
                    <div key={r.key}
                      onClick={()=>setSelectedDay(isSelected?null:r.key)}
                      style={{
                        minHeight:'72px', padding:'6px 8px', cursor:'pointer',
                        borderRight:`1px solid ${COLORS.border}`, borderBottom:`1px solid ${COLORS.border}`,
                        background: isSelected ? '#EFEFFB' : isGap ? '#fef2f2' : isToday ? '#f0fdf4' : isWeekend ? '#f9fafb' : COLORS.white,
                        outline: isSelected ? `2px solid ${COLORS.accent}` : isToday ? `2px solid ${COLORS.green}` : 'none',
                        transition:'background 0.15s',
                      }}>
                      <div style={{ fontWeight: isToday?700:400, fontSize:'13px', color: isPast&&!isToday?COLORS.textSecondary:COLORS.text, marginBottom:'4px' }}>
                        {r.day}
                        {isToday && <span style={{ marginLeft:'4px', fontSize:'10px', background:COLORS.green, color:'#fff', borderRadius:'4px', padding:'1px 4px' }}>сег</span>}
                      </div>
                      {r.income>0 && <div style={{ fontSize:'11px', color:COLORS.green, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>+{(r.income/1000).toFixed(0)}к</div>}
                      {r.expense>0 && <div style={{ fontSize:'11px', color:COLORS.red, fontWeight:600, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>-{(r.expense/1000).toFixed(0)}к</div>}
                      {hasPlanned && <div style={{ fontSize:'10px', color:COLORS.accent, marginTop:'2px' }}>📋 план</div>}
                      {isGap && <div style={{ fontSize:'10px', color:COLORS.red, marginTop:'2px' }}>⚠️ разрыв</div>}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Боковая панель — выбранный день или список предстоящих */}
            <div style={{ width:'280px', flexShrink:0 }}>
              {selectedDay ? (
                <div style={{ background:COLORS.white, borderRadius:'14px', padding:'16px', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
                  <div style={{ fontWeight:700, fontSize:'15px', marginBottom:'12px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    {new Date(selectedDay+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
                    <button onClick={()=>setSelectedDay(null)} style={{ background:'none',border:'none',cursor:'pointer',color:COLORS.textSecondary,fontSize:'18px' }}>×</button>
                  </div>
                  {selectedItems.length===0 ? (
                    <div style={{ color:COLORS.textSecondary, fontSize:'13px', textAlign:'center', padding:'20px 0' }}>Нет операций</div>
                  ) : selectedItems.map((item,i) => (
                    <div key={i} style={{ padding:'10px 12px', borderRadius:'8px', marginBottom:'8px', background: item.source==='fact' ? (item.type==='income'?'#f0fdf4':'#fef2f2') : '#EFEFFB', border:`1px solid ${item.source==='fact'?(item.type==='income'?'#bbf7d0':'#fecaca'):'#D9D9F6'}` }}>
                      <div style={{ fontSize:'13px', fontWeight:500, marginBottom:'3px' }}>{item.label}</div>
                      <div style={{ fontSize:'14px', fontWeight:700, color: item.source==='planned'?COLORS.accent:(item.type==='income'?COLORS.green:COLORS.red) }}>
                        {item.source==='fact'?(item.type==='income'?'+':'-'):''}{formatCurrency(item.amount)}
                      </div>
                      {item.source==='planned' && <div style={{ fontSize:'11px', color:COLORS.textSecondary, marginTop:'2px' }}>
                        {item.status==='approved'?'✅ Одобрен':item.status==='pending'?'⏳ На рассмотрении':'❌ Отклонён'}
                      </div>}
                    </div>
                  ))}
                  {canWrite('calendar') && <button onClick={()=>{ setForm({...form, planned_date:selectedDay}); setShowAddModal(true); }}
                    style={{ width:'100%', marginTop:'8px', padding:'8px', background:COLORS.accent, color:'#fff', border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:600, fontSize:'13px' }}>
                    + Добавить платёж
                  </button>}
                </div>
              ) : (
                <div style={{ background:COLORS.white, borderRadius:'14px', padding:'16px', boxShadow:'0 1px 4px rgba(0,0,0,0.07)' }}>
                  <div style={{ fontWeight:700, fontSize:'14px', marginBottom:'12px', color:COLORS.textSecondary }}>БЛИЖАЙШИЕ ПЛАТЕЖИ</div>
                  {payments
                    .filter(p => (p.planned_date||'') >= today)
                    .sort((a,b)=>(a.planned_date||'').localeCompare(b.planned_date||''))
                    .slice(0,8)
                    .map((p,i) => {
                      const isOverdue = (p.planned_date||'') < today;
                      return (
                        <div key={i} onClick={()=>setSelectedDay((p.planned_date||'').split('T')[0])}
                          style={{ padding:'10px 12px', borderRadius:'8px', marginBottom:'8px', cursor:'pointer', background:'#f8fafc', border:`1px solid ${COLORS.border}`, transition:'background 0.15s' }}
                          onMouseEnter={e=>e.currentTarget.style.background='#EFEFFB'}
                          onMouseLeave={e=>e.currentTarget.style.background='#f8fafc'}>
                          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                            <div style={{ fontSize:'12px', fontWeight:600, color:isOverdue?COLORS.red:COLORS.accent }}>
                              {new Date((p.planned_date||'')+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
                            </div>
                            <div style={{ fontSize:'13px', fontWeight:700, color:COLORS.text }}>{formatCurrency(parseFloat(p.amount))}</div>
                          </div>
                          <div style={{ fontSize:'12px', color:COLORS.textSecondary, marginTop:'2px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.description||'Платёж'}</div>
                        </div>
                      );
                    })}
                  {payments.filter(p=>(p.planned_date||'')>=today).length===0 && (
                    <div style={{ color:COLORS.textSecondary, fontSize:'13px', textAlign:'center', padding:'20px 0' }}>Нет запланированных платежей</div>
                  )}
                </div>
              )}
            </div>
          </div>

          {/* Модал добавления платежа */}
          {showAddModal && (
            <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }} onClick={e=>{if(e.target===e.currentTarget)setShowAddModal(false)}}>
              <div style={{ background:COLORS.white, borderRadius:'16px', padding:'28px', width:'400px', boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
                <h3 style={{ fontSize:'18px', fontWeight:700, marginBottom:'20px' }}>Запланировать платёж</h3>
                <div style={{ marginBottom:'14px' }}>
                  <label style={{ display:'block', marginBottom:'6px', fontWeight:500, fontSize:'14px' }}>Тип *</label>
                  <div style={{ display:'flex', gap:'8px' }}>
                    {[{val:'income',label:'📈 Поступление'},{val:'expense',label:'📉 Расход'}].map(opt=>(
                      <button key={opt.val} onClick={()=>setForm({...form,type:opt.val})}
                        style={{ flex:1, padding:'10px', border:`2px solid ${form.type===opt.val?(opt.val==='income'?COLORS.green:COLORS.red):COLORS.border}`, borderRadius:'8px', cursor:'pointer', fontWeight:600, fontSize:'13px',
                          background: form.type===opt.val?(opt.val==='income'?'#f0fdf4':'#fef2f2'):COLORS.white,
                          color: form.type===opt.val?(opt.val==='income'?COLORS.green:COLORS.red):COLORS.textSecondary }}>
                        {opt.label}
                      </button>
                    ))}
                  </div>
                </div>
                {[
                  { label:'Описание', type:'text', key:'description', placeholder:'Аренда, зарплата...' },
                  { label:'Сумма *', type:'number', key:'amount', placeholder:'0' },
                  { label:'Дата *', type:'date', key:'planned_date', placeholder:'' },
                ].map(f => (
                  <div key={f.key} style={{ marginBottom:'14px' }}>
                    <label style={{ display:'block', marginBottom:'6px', fontWeight:500, fontSize:'14px' }}>{f.label}</label>
                    <input type={f.type} value={form[f.key]} onChange={e=>setForm({...form,[f.key]:e.target.value})} placeholder={f.placeholder}
                      style={{ width:'100%', padding:'10px 14px', border:`1.5px solid ${COLORS.border}`, borderRadius:'8px', fontSize:'14px', fontFamily:'Onest,sans-serif', boxSizing:'border-box' }} />
                  </div>
                ))}
                <div style={{ display:'flex', gap:'10px', marginTop:'20px' }}>
                  <button onClick={()=>setShowAddModal(false)} style={{ flex:1, padding:'11px', background:COLORS.grayLight, border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:600 }}>Отмена</button>
                  <button onClick={handleCreate} style={{ flex:2, padding:'11px', background:COLORS.accent, color:'#fff', border:'none', borderRadius:'8px', cursor:'pointer', fontWeight:700, fontSize:'14px' }}>Запланировать</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const Reports = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [tab, setTab] = useState('cashflow');
      const [loading, setLoading] = useState(true);
      const [data, setData] = useState(null);

      useEffect(() => {
        const fetchReport = async () => {
          setLoading(true);
          let endpoint = '';
          const startDate = new Date(new Date().setMonth(new Date().getMonth() - 3)).toISOString().split('T')[0];
          const endDate = new Date().toISOString().split('T')[0];

          if (tab === 'cashflow') endpoint = `/companies/${companyId}/reports/cashflow?start_date=${startDate}&end_date=${endDate}`;
          if (tab === 'pl') endpoint = `/companies/${companyId}/reports/pl?start_date=${startDate}&end_date=${endDate}`;
          if (tab === 'balance') endpoint = `/companies/${companyId}/reports/balance`;

          const res = await apiCall('GET', endpoint);
          if (res.success) {
            if (tab === 'balance') console.log('balance data:', JSON.stringify(res.data));
            setData(res.data);
          }
          setLoading(false);
        };
        fetchReport();
      }, [companyId, tab]);

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Отчёты</h2>
            <button onClick={async () => {
              try {
                const today = new Date();
                const start = `${today.getFullYear()}-01-01`;
                const end   = today.toISOString().split('T')[0];
                const fname = `axiom_report_${end.replace(/-/g,'')}.xlsx`;
                await downloadFile(`/api/v1/companies/${companyId}/export/reports/xlsx?start_date=${start}&end_date=${end}`, fname);
              } catch(e) { alert('Ошибка: ' + e.message); }
            }} style={{ padding: '9px 18px', borderRadius: '8px', border: `1.5px solid ${COLORS.border}`, background: '#fff', cursor: 'pointer', fontWeight: 500, fontSize: '14px', fontFamily: 'Inter, sans-serif', display: 'flex', alignItems: 'center', gap: '6px' }}>
              📊 Скачать Excel
            </button>
          </div>

          <div style={{ display: 'flex', gap: '12px', marginBottom: '24px' }}>
            {['cashflow', 'pl', 'balance'].map((t) => (
              <button key={t} onClick={() => setTab(t)} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === t ? COLORS.accent : COLORS.grayLight, color: tab === t ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>
                {t === 'cashflow' && 'Движение денежных средств'}
                {t === 'pl' && 'Доходы и расходы'}
                {t === 'balance' && 'Баланс'}
              </button>
            ))}
          </div>

          <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
            {tab === 'pl' && (
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ borderBottom: `2px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px', textAlign: 'left', fontWeight: 600 }}>Показатель</th>
                    <th style={{ padding: '12px', textAlign: 'right', fontWeight: 600 }}>Сумма</th>
                    <th style={{ padding: '12px', textAlign: 'right', fontWeight: 600 }}>% от выручки</th>
                  </tr>
                </thead>
                <tbody>
                  <tr style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                    <td style={{ padding: '12px', fontWeight: 600 }}>Выручка</td>
                    <td style={{ padding: '12px', textAlign: 'right', color: COLORS.green, fontWeight: 600 }}>{formatCurrency(data?.revenue || 0)}</td>
                    <td style={{ padding: '12px', textAlign: 'right' }}>100%</td>
                  </tr>
                  <tr style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                    <td style={{ padding: '12px', fontWeight: 600 }}>Себестоимость (COGS)</td>
                    <td style={{ padding: '12px', textAlign: 'right', color: COLORS.red, fontWeight: 600 }}>{formatCurrency(data?.cogs || 0)}</td>

      useEffect(() => {

      const handleAdd = async () => {
        if (!formData.name) {
          setToast({ type: 'error', message: 'Укажите название' });
          return;
        }
        const payload = {
          name: formData.name,
          is_customer: formData.role === 'customer' || formData.role === 'both',
          is_supplier: formData.role === 'supplier' || formData.role === 'both',
          contact_phone: formData.contact_phone || undefined,
          contact_email: formData.contact_email || undefined,
          inn: formData.inn || undefined,
          kpp: formData.kpp || undefined,

        if (editingId) {
          const res = await apiCall('PATCH', `/companies/${companyId}/counterparties/${editingId}`, payload);
          if (res.success) {
            setToast({ type: 'success', message: 'Контрагент обновлён' });
            setShowModal(false);
            setEditingId(null);
            setFormData({ name: '', role: 'supplier', contact_phone: '', contact_email: '', inn: '', kpp: '' });
            fetchCounterparties();
          } else {
            setToast({ type: 'error', message: res.error });
          }
        } else {
          const res = await apiCall('POST', `/companies/${companyId}/counterparties`, payload);
          if (res.success) {
            setToast({ type: 'success', message: 'Контрагент добавлен' });
            setShowModal(false);
            setFormData({ name: '', role: 'supplier', contact_phone: '', contact_email: '', inn: '', kpp: '' });
            fetchCounterparties();
          } else {
            setToast({ type: 'error', message: res.error });
          }
        }
      };

      const handleEdit = (cp) => {
        const role = (cp.is_supplier && cp.is_customer) ? 'both' : (cp.is_supplier ? 'supplier' : 'customer');
        setFormData({
          name: cp.name || '',
          role,
          contact_phone: cp.contact_phone || '',
          contact_email: cp.contact_email || '',
          inn: cp.inn || '',
          kpp: cp.kpp || '',
        });
        setEditingId(cp.id);
        setShowModal(true);

        if (window.confirm('Удалить контрагента?')) {

            setToast({ type: 'success', message: 'Контрагент удалён' });

            setToast({ type: 'error', message: res.error });

                    else if (c.is_customer) roleText = '👤 Покупатель';
                    return (
                      <tr key={c.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>

          <Modal isOpen={showModal} onClose={() => { setShowModal(false); setEditingId(null); setFormData({ name: '', role: 'supplier', contact_phone: '', contact_email: '', inn: '', kpp: '' }); }} title={editingId ? 'Редактировать контрагента' : 'Добавить контрагента'}>

                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>

                <select value={formData.role} onChange={(e) => setFormData({ ...formData, role: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>

              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>КПП</label>

    const TAX_REGIMES = [

      { code: 'usn_profit', name: 'УСН «Доходы − Расходы»',   desc: 'Упрощённая система — налог с прибыли (мин. 1%)',        rate: '15%',  icon: '📊' },
      { code: 'patent',     name: 'ПСН (Патент)',              desc: 'Фиксированный налог для ИП, устанавливается регионом',  rate: '6%*',  icon: '📜' },

      { code: 'npd',        name: 'НПД (Самозанятый)',          desc: 'Налог на профдоход — 4% от физлиц, 6% от юрлиц',       rate: '4–6%', icon: '👤' },

            apiCall('GET', `/companies/${companyId}`),
            apiCall('GET', `/companies/${companyId}/tax-regime`),

          if (compRes.success) {
            setCompany(compRes.data);
            setFormData({ name: compRes.data.name || '', inn: compRes.data.inn || '' });
          }
          if (taxRes.success) setTaxRegime(taxRes.data.tax_regime || 'usn_income');
          setLoading(false);
        };
        fetchCompany();
      }, [companyId]);

      useEffect(() => {
        if (tab === 'accounts') fetchAccounts();
        if (tab === 'categories') fetchCategories();

        setTaxSaving(true);
        const res = await apiCall('PATCH', `/companies/${companyId}/tax-regime`, { tax_regime: taxRegime });
        setTaxSaving(false);
        if (res.success) {
          setToast({ type: 'success', message: `Налоговый режим изменён на «${TAX_REGIMES.find(r=>r.code===taxRegime)?.name}»` });
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleSave = async () => {
        const res = await apiCall('PATCH', `/companies/${companyId}`, formData);
        if (res.success) {
          setToast({ type: 'success', message: 'Данные обновлены' });
          setCompany(res.data);

          setToast({ type: 'error', message: res.error });

        const res = await apiCall('GET', `/companies/${companyId}/accounts`);

          const accList = res.data.accounts || [];
          setAccounts(accList);

        if (res.success) {
          const catList = res.data.categories || [];
          setCategories(catList);

          setToast({ type: 'error', message: 'Укажите название счёта' });
