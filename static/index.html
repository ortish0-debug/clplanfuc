                    type="number" placeholder="0" value={form.amount}
                    onChange={e => setForm(f => ({ ...f, amount: e.target.value }))}
                    autoFocus
                    style={{ width: '100%', padding: '12px 14px 12px 36px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '20px', fontWeight: 700, fontFamily: 'Inter, sans-serif', boxSizing: 'border-box', outline: 'none' }}
                    onFocus={e => e.target.style.borderColor = COLORS.accent}
                    onBlur={e => e.target.style.borderColor = COLORS.border}
                    onKeyDown={e => e.key === 'Enter' && handleSave()}
                  />
                </div>

                {/* Описание */}
                <input
                  type="text" placeholder="Описание операции"
                  value={form.description}
                  onChange={e => setForm(f => ({ ...f, description: e.target.value }))}
                  style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif', marginBottom: '10px', boxSizing: 'border-box', outline: 'none' }}
                  onFocus={e => e.target.style.borderColor = COLORS.accent}
                  onBlur={e => e.target.style.borderColor = COLORS.border}
                  onKeyDown={e => e.key === 'Enter' && handleSave()}
                />

                {/* Счёт + Дата */}
                <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
                  <select value={form.account_id} onChange={e => setForm(f => ({ ...f, account_id: e.target.value }))}
                    style={{ flex: 1, padding: '9px 10px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '13px', fontFamily: 'Inter, sans-serif', background: '#fff' }}>
                    {accounts.map(a => <option key={a.id} value={a.id}>💳 {a.name}</option>)}
                  </select>
                  <input type="date" value={form.date} onChange={e => setForm(f => ({ ...f, date: e.target.value }))}
                    style={{ width: '130px', padding: '9px 10px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '13px', fontFamily: 'Inter, sans-serif' }} />
                </div>

                {/* Кнопки */}
                <div style={{ display: 'flex', gap: '8px' }}>
                  <button onClick={() => setShowQuick(false)} style={{ flex: 1, padding: '10px', borderRadius: '8px', border: `1.5px solid ${COLORS.border}`, background: '#fff', cursor: 'pointer', fontWeight: 500, fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>Отмена</button>
                  <button onClick={handleSave} disabled={saving} style={{ flex: 2, padding: '10px', borderRadius: '8px', border: 'none', background: saving ? '#94a3b8' : COLORS.accent, color: '#fff', cursor: saving ? 'not-allowed' : 'pointer', fontWeight: 600, fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                    {saving ? '⏳ Сохраняю...' : '✓ Сохранить'}
                  </button>
                </div>

                <div style={{ marginTop: '10px', fontSize: '11px', color: COLORS.textSecondary, textAlign: 'center' }}>Enter — сохранить · Esc — закрыть</div>
              </div>
            </>
          )}
        </>
      );
    };

    const Layout = ({ children, currentPage }) => {
      const titles = {
        dashboard: '📊 Дашборд',
        transactions: '💳 Операции',
        calendar: '📅 Платёжный календарь',
        reports: '📈 Отчёты',
        analytics: '🔬 Аналитика',
        'ai-parser': '🤖 AI Парсер транзакций',
        alerts: '🔔 Алерты и правила',
        debts: '💰 Реестр долгов',
        counterparties: '👥 Контрагенты',
        projects: '📁 Проекты',
        crm: '🎯 CRM — Воронка продаж',
        budgets: '💰 Бюджеты',
        'payment-requests': '📋 Заявки на оплату',
        payroll: '👷 Сотрудники и ФОТ',
        assets: '📦 Основные средства',
        banks: '🏦 Банки',
        documents: '📄 Документы',
        loans: '🏦 Займы и кредиты',
        taxes: '🧾 Налоги',
        accruals: '📋 Начисления',
        settings: '⚙️ Настройки',
      };

      return (
        <div style={{ display: 'flex', height: '100vh' }}>
          <Sidebar currentPage={currentPage} onNavigate={() => {}} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            <Header title={titles[currentPage] || 'ПланФакт'} />
            <div style={{ flex: 1, overflowY: 'auto', background: COLORS.bg }}>
              {children}
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [currentPage, setCurrentPage] = useState(() => {
        const hash = window.location.hash.slice(1) || 'dashboard';
        return hash.split('?')[0];
      });

      const { token, login, logout } = useAuth();

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.slice(1) || 'dashboard';
          setCurrentPage(hash.split('?')[0]);
        };

        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      if (!token) {
        return <AuthScreen onLoginSuccess={login} />;
      }

      const pageMap = {
        dashboard: <Dashboard />,
        transactions: <Transactions />,
        calendar: <Calendar />,
        reports: <Reports />,
        analytics: <AnalyticsPage />,
        'ai-parser': <AIParserPage />,
        alerts: <AlertsPage />,
        debts: <DebtsPage />,
        counterparties: <Counterparties />,
        projects: <Projects />,
        crm: <CRMPage />,
        budgets: <Budgets />,
        'payment-requests': <PaymentRequests />,
        payroll: <Payroll />,
        assets: <Assets />,
        banks: <Banks />,
        documents: <Documents />,
        loans: <Loans />,
        taxes: <Taxes />,
        accruals: <Accruals />,
        settings: <Settings />,
      };

      return (
        <Layout currentPage={currentPage}>
          {pageMap[currentPage] || <Dashboard />}
        </Layout>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AuthProvider>
        <App />
      </AuthProvider>
    );
  </script>
</body>
</html>
