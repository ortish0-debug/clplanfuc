          setToast({ type: 'success', message: 'Счёт добавлен' });
          setShowAccountModal(false);
          setAccountFormData({ name: '', account_type: 'CHECKING', currency: 'RUB' });
          fetchAccounts();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDeleteAccount = async (id) => {
        if (!confirm('Удалить счёт?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/accounts/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Счёт удалён' });
          fetchAccounts();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleAddCategory = async () => {
        if (!categoryFormData.name) {
          setToast({ type: 'error', message: 'Укажите название статьи' });
          return;
        }
        const res = await apiCall('POST', `/companies/${companyId}/categories`, {
          name: categoryFormData.name,
          category_type: categoryFormData.type
        });
        if (res.success) {
          setToast({ type: 'success', message: 'Статья добавлена' });
          setShowCategoryModal(false);
          setCategoryFormData({ name: '', type: 'INCOME' });
          fetchCategories();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDeleteCategory = async (id) => {
        if (!confirm('Удалить статью?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/categories/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Статья удалена' });
          fetchCategories();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px', maxWidth: '800px' }}>
          <h2 style={{ fontSize: '24px', fontWeight: 600, marginBottom: '24px' }}>Настройки</h2>

          <div style={{ display: 'flex', gap: '12px', marginBottom: '32px', flexWrap: 'wrap' }}>
            {['profile', 'company', 'tax', 'accounts', 'categories'].map((t) => (
              <button key={t} onClick={() => setTab(t)} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === t ? COLORS.accent : COLORS.grayLight, color: tab === t ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>
                {t === 'profile'     && '👤 Профиль'}
                {t === 'company'     && '🏢 Компания'}
                {t === 'tax'         && '🧾 Налоги'}
                {t === 'accounts'    && '💳 Счета'}
                {t === 'categories'  && '📊 Статьи'}
              </button>
            ))}
          </div>

          {tab === 'profile' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '16px' }}>Профиль</h3>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', color: COLORS.textSecondary, fontWeight: 500 }}>Email</label>
                <Input type="email" value={user?.email || ''} disabled />
              </div>
            </div>
          )}

          {tab === 'company' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '16px' }}>Компания</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', color: COLORS.textSecondary, fontWeight: 500 }}>Название</label>
                  <Input value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} />
                </div>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', color: COLORS.textSecondary, fontWeight: 500 }}>ИНН</label>
                  <Input value={formData.inn} onChange={(e) => setFormData({ ...formData, inn: e.target.value })} />
                </div>
                {canSettings() && <Button onClick={handleSave} style={{ alignSelf: 'flex-start' }}>Сохранить изменения</Button>}
              </div>
            </div>
          )}

          {tab === 'tax' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '6px' }}>Налоговый режим</h3>
              <p style={{ fontSize: '13px', color: COLORS.textSecondary, marginBottom: '24px' }}>
                Выберите систему налогообложения вашей компании. Это влияет на расчёт налогов в отчётах.
              </p>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '24px' }}>
                {TAX_REGIMES.map(regime => {
                  const isSelected = taxRegime === regime.code;
                  return (
                    <div key={regime.code} onClick={() => canSettings() && setTaxRegime(regime.code)}
                      style={{
                        padding: '16px', borderRadius: '12px', cursor: canSettings() ? 'pointer' : 'default',
                        border: `2px solid ${isSelected ? COLORS.accent : COLORS.border}`,
                        background: isSelected ? COLORS.blueLight : COLORS.white,
                        transition: 'all 0.15s',
                      }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '6px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                          <span style={{ fontSize: '20px' }}>{regime.icon}</span>
                          <span style={{ fontWeight: 700, fontSize: '14px', color: isSelected ? COLORS.accent : COLORS.text }}>{regime.name}</span>
                        </div>
                        <span style={{
                          fontSize: '12px', fontWeight: 700, padding: '2px 8px', borderRadius: '20px',
                          background: isSelected ? COLORS.accent : COLORS.grayLight,
                          color: isSelected ? '#fff' : COLORS.textSecondary,
                        }}>{regime.rate}</span>
                      </div>
                      <p style={{ fontSize: '12px', color: COLORS.textSecondary, margin: 0, lineHeight: '1.5' }}>{regime.desc}</p>
                      {isSelected && (
                        <div style={{ marginTop: '8px', fontSize: '12px', color: COLORS.accent, fontWeight: 600 }}>✓ Выбрано</div>
                      )}
                    </div>
                  );
                })}
              </div>
              {canSettings() && (
                <button onClick={handleSaveTaxRegime} disabled={taxSaving}
                  style={{ padding: '10px 24px', background: COLORS.accent, color: '#fff', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 600, fontSize: '14px', opacity: taxSaving ? 0.7 : 1 }}>
                  {taxSaving ? 'Сохраняю...' : 'Сохранить налоговый режим'}
                </button>
              )}
            </div>
          )}

          {tab === 'accounts' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                <h3 style={{ fontSize: '16px', fontWeight: 600 }}>Счета</h3>
                {canSettings() && <Button onClick={() => setShowAccountModal(true)}>+ Добавить</Button>}
              </div>
              {accounts.length === 0 ? (
                <div style={{ color: COLORS.textSecondary, textAlign: 'center', padding: '40px' }}>📋 Счётов нет</div>
              ) : (
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ borderBottom: `2px solid ${COLORS.border}` }}>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: 600 }}>Название</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: 600 }}>Тип</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: 600 }}>Валюта</th>
                      <th style={{ padding: '12px', textAlign: 'right', fontWeight: 600 }}>Баланс</th>
                      <th style={{ padding: '12px', textAlign: 'center', fontWeight: 600 }}>Действия</th>
                    </tr>
                  </thead>
                  <tbody>
                    {accounts.map((acc) => (
                      <tr key={acc.id} style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                        <td style={{ padding: '12px' }}>{acc.name}</td>
                        <td style={{ padding: '12px' }}>{acc.account_type}</td>
                        <td style={{ padding: '12px' }}>{acc.currency}</td>
                        <td style={{ padding: '12px', textAlign: 'right', fontWeight: 600 }}>{formatCurrency(acc.current_balance || 0)}</td>
                        <td style={{ padding: '12px', textAlign: 'center' }}>
                          <button onClick={() => canSettings() && handleDeleteAccount(acc.id)} style={{ background: 'none', border: 'none', cursor: canSettings() ? 'pointer' : 'default', color: canSettings() ? COLORS.red : COLORS.border, fontSize: '16px' }}>🗑️</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}

              <Modal isOpen={showAccountModal} onClose={() => setShowAccountModal(false)} title="Добавить счёт">
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                    <Input placeholder="Расчётный счёт" value={accountFormData.name} onChange={(e) => setAccountFormData({ ...accountFormData, name: e.target.value })} />
                  </div>
                  <div>
                    <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Тип счёта</label>
                    <select value={accountFormData.account_type} onChange={(e) => setAccountFormData({ ...accountFormData, account_type: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                      <option value="CHECKING">Расчётный</option>
                      <option value="SAVINGS">Сбережения</option>
                      <option value="CASH">Касса</option>
                      <option value="CREDIT">Кредит</option>
                    </select>
                  </div>
                  <div>
                    <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Валюта</label>
                    <select value={accountFormData.currency} onChange={(e) => setAccountFormData({ ...accountFormData, currency: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                      <option value="RUB">RUB</option>
                      <option value="USD">USD</option>
                      <option value="EUR">EUR</option>
                    </select>
                  </div>
                  <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                    <Button variant="outline" onClick={() => setShowAccountModal(false)}>Отмена</Button>
                    <Button onClick={handleAddAccount}>Сохранить</Button>
                  </div>
                </div>
              </Modal>
            </div>
          )}

          {tab === 'categories' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '16px' }}>Статьи доходов и расходов</h3>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px' }}>
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                    <h4 style={{ fontSize: '14px', fontWeight: 600, color: COLORS.green }}>📈 Доходы</h4>
                    {canSettings() && <Button size="sm" onClick={() => { setCategoryFormData({ name: '', type: 'INCOME' }); setShowCategoryModal(true); }}>+</Button>}
                  </div>
                  {categories.filter(c => c.category_type === 'income').length === 0 ? (
                    <div style={{ color: COLORS.textSecondary, fontSize: '13px' }}>Нет статей доходов</div>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      {categories.filter(c => c.category_type === 'income').map((cat) => (
                        <div key={cat.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px', background: COLORS.greenLight, borderRadius: '6px' }}>
                          <span style={{ fontSize: '13px' }}>{cat.name}</span>
                          <button onClick={() => canSettings() && handleDeleteCategory(cat.id)} style={{ background: 'none', border: 'none', cursor: canSettings() ? 'pointer' : 'default', color: canSettings() ? COLORS.red : COLORS.border, fontSize: '14px' }}>🗑️</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                    <h4 style={{ fontSize: '14px', fontWeight: 600, color: COLORS.red }}>📉 Расходы</h4>
                    {canSettings() && <Button size="sm" onClick={() => { setCategoryFormData({ name: '', type: 'EXPENSE' }); setShowCategoryModal(true); }}>+</Button>}
                  </div>
                  {categories.filter(c => c.category_type === 'expense').length === 0 ? (
                    <div style={{ color: COLORS.textSecondary, fontSize: '13px' }}>Нет статей расходов</div>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      {categories.filter(c => c.category_type === 'expense').map((cat) => (
                        <div key={cat.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px', background: COLORS.redLight, borderRadius: '6px' }}>
                          <span style={{ fontSize: '13px' }}>{cat.name}</span>
                          <button onClick={() => canSettings() && handleDeleteCategory(cat.id)} style={{ background: 'none', border: 'none', cursor: canSettings() ? 'pointer' : 'default', color: canSettings() ? COLORS.red : COLORS.border, fontSize: '14px' }}>🗑️</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <Modal isOpen={showCategoryModal} onClose={() => setShowCategoryModal(false)} title={`Добавить ${categoryFormData.type === 'INCOME' ? 'доход' : 'расход'}`}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                    <Input placeholder="Название статьи" value={categoryFormData.name} onChange={(e) => setCategoryFormData({ ...categoryFormData, name: e.target.value })} />
                  </div>
                  <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                    <Button variant="outline" onClick={() => setShowCategoryModal(false)}>Отмена</Button>
                    <Button onClick={handleAddCategory}>Сохранить</Button>
                  </div>
                </div>
              </Modal>
            </div>
          )}

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    // Сайдбар с новыми пунктами
    // ─────────────────────────────────────────────────────────────────────────────
    // ─────────────────────────────────────────────────────────────────────────────
    // ШАБЛОНЫ ОПЕРАЦИЙ
    // ─────────────────────────────────────────────────────────────────────────────

    const TemplatesPage = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [templates, setTemplates] = useState([]);
      const [accounts, setAccounts]   = useState([]);
      const [loading, setLoading]     = useState(true);
      const [applying, setApplying]   = useState(null); // id шаблона
      const [showCreate, setShowCreate] = useState(false);
      const [toast, setToast]         = useState(null);
      const [form, setForm] = useState({
        name: '', description: '', amount: '',
        transaction_type: 'expense', account_id: '',
      });

      const POPULAR = [
        { name: 'Аренда офиса',      amount: 85000,  transaction_type: 'expense', description: 'Ежемесячная аренда офиса' },
        { name: 'Зарплата команды',  amount: 350000, transaction_type: 'expense', description: 'Выплата зарплаты сотрудникам' },
        { name: 'Абонентская плата', amount: 5000,   transaction_type: 'expense', description: 'Сервисы и подписки' },
        { name: 'Поступление выручки', amount: 200000, transaction_type: 'income', description: 'Оплата от клиента' },
      ];

      const load = async () => {
        setLoading(true);
        const [tRes, aRes] = await Promise.all([
          apiCall('get', `/companies/${companyId}/templates/`),
          apiCall('get', `/companies/${companyId}/accounts`),
        ]);
        if (tRes.success) setTemplates(tRes.data.templates || []);
        if (aRes.success) {
          const list = aRes.data.accounts || [];
          setAccounts(list);
          if (list.length > 0 && !form.account_id) setForm(f => ({ ...f, account_id: list[0].id }));
        }
        setLoading(false);
      };

      useEffect(() => { if (companyId) load(); }, [companyId]);

      const handleCreate = async () => {
        if (!form.name.trim() || !form.amount) {
          setToast({ type: 'error', message: 'Введите название и сумму' }); return;
        }
        const res = await apiCall('post', `/companies/${companyId}/templates/`, {
          name: form.name.trim(),
          description: form.description || null,
          amount: parseFloat(form.amount),
          transaction_type: form.transaction_type,
          account_id: form.account_id || null,
        });
        if (res.success) {
          setToast({ type: 'success', message: 'Шаблон создан' });
          setShowCreate(false);
          setForm({ name: '', description: '', amount: '', transaction_type: 'expense', account_id: accounts[0]?.id || '' });
          load();
        } else setToast({ type: 'error', message: res.error });
      };

      const handleApply = async (tpl) => {
        setApplying(tpl.id);
        const res = await apiCall('post', `/companies/${companyId}/templates/${tpl.id}/apply`, {
          payment_date: new Date().toISOString().split('T')[0],
        });
        setApplying(null);
        if (res.success) {
          setToast({ type: 'success', message: `✅ Создана операция: ${res.data.description} — ${formatCurrency(res.data.amount)}` });
        } else setToast({ type: 'error', message: res.error });
      };

      const handleDelete = async (id) => {
        const res = await apiCall('delete', `/companies/${companyId}/templates/${id}`);
        if (res.success) { setToast({ type: 'success', message: 'Шаблон удалён' }); load(); }
        else setToast({ type: 'error', message: res.error });
      };

      const handleAddPopular = async (p) => {
        const res = await apiCall('post', `/companies/${companyId}/templates/`, {
          name: p.name, description: p.description,
          amount: p.amount, transaction_type: p.transaction_type,
          account_id: accounts[0]?.id || null,
        });
        if (res.success) { setToast({ type: 'success', message: `Шаблон «${p.name}» добавлен` }); load(); }
      };

      const TypeBadge = ({ type }) => (
        <span style={{
          padding: '3px 10px', borderRadius: '12px', fontSize: '11px', fontWeight: 700,
          background: type === 'income' ? '#dcfce7' : '#fee2e2',
          color: type === 'income' ? COLORS.green : COLORS.red,
        }}>
          {type === 'income' ? '📈 Доход' : '📉 Расход'}
        </span>
      );

      return (
        <div style={{ padding: '24px' }}>
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

          {/* ── Шапка ── */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <div>
              <div style={{ fontSize: '13px', color: COLORS.textSecondary, marginTop: '4px' }}>
                Создайте шаблон один раз — применяйте в один клик
              </div>
            </div>
            {canWrite('transactions') && <Button onClick={() => setShowCreate(true)}>+ Создать шаблон</Button>}
          </div>

          {/* ── Популярные шаблоны (если список пустой) ── */}
          {!loading && templates.length === 0 && (
            <div style={{ background: COLORS.white, borderRadius: '14px', padding: '24px', marginBottom: '24px', boxShadow: '0 1px 4px rgba(0,0,0,0.07)' }}>
              <div style={{ fontWeight: 600, marginBottom: '14px', fontSize: '14px', color: COLORS.textSecondary }}>
                💡 Популярные шаблоны — добавьте в один клик:
              </div>
              <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                {POPULAR.map(p => (
                  <button key={p.name} onClick={() => handleAddPopular(p)} style={{
                    padding: '10px 16px', borderRadius: '10px', border: `1.5px solid ${COLORS.border}`,
                    background: '#fff', cursor: 'pointer', fontFamily: 'Inter, sans-serif', textAlign: 'left',
                    transition: 'all 0.15s',
                  }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = COLORS.accent; e.currentTarget.style.background = COLORS.blueLight; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = COLORS.border; e.currentTarget.style.background = '#fff'; }}
                  >
                    <div style={{ fontWeight: 600, fontSize: '13px', marginBottom: '2px' }}>{p.name}</div>
                    <div style={{ fontSize: '12px', color: p.transaction_type === 'income' ? COLORS.green : COLORS.red, fontWeight: 600 }}>
                      {p.transaction_type === 'income' ? '+' : '-'}{formatCurrency(p.amount)}
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* ── Сетка шаблонов ── */}
          {loading ? <LoadingSpinner /> : templates.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '14px', padding: '48px', textAlign: 'center', boxShadow: '0 1px 4px rgba(0,0,0,0.07)' }}>
              <div style={{ fontSize: '40px', marginBottom: '12px' }}>📋</div>
              <div style={{ fontWeight: 600, marginBottom: '6px' }}>Шаблонов пока нет</div>
              <div style={{ fontSize: '13px', color: COLORS.textSecondary, marginBottom: '20px' }}>Создайте шаблон для часто повторяющихся операций</div>
              {canWrite('transactions') && <Button onClick={() => setShowCreate(true)}>Создать первый шаблон</Button>}
            </div>
          ) : (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: '14px' }}>
              {templates.map(tpl => {
                const isApplying = applying === tpl.id;
                return (
                  <div key={tpl.id} style={{
                    background: COLORS.white, borderRadius: '14px', padding: '20px',
                    boxShadow: '0 1px 4px rgba(0,0,0,0.07)',
                    border: `1px solid ${COLORS.border}`,
                    display: 'flex', flexDirection: 'column', gap: '10px',
                  }}>
                    {/* Заголовок */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                      <div style={{ fontWeight: 700, fontSize: '15px' }}>{tpl.name}</div>
                      <TypeBadge type={tpl.transaction_type} />
                    </div>

                    {/* Сумма */}
                    <div style={{ fontSize: '24px', fontWeight: 800, color: tpl.transaction_type === 'income' ? COLORS.green : COLORS.red }}>
                      {tpl.transaction_type === 'income' ? '+' : '-'}{formatCurrency(tpl.amount)}
                    </div>

                    {/* Детали */}
                    {tpl.description && (
