    const Counterparties = () => {
      const { companyId } = useAuth();
      const [counterparties, setCounterparties] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [toast, setToast] = useState(null);
      const [formData, setFormData] = useState({ name: '', role: 'supplier', contact_phone: '', contact_email: '', inn: '', kpp: '' });

      const fetchCounterparties = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/counterparties`);
        if (res.success) {
          const counterpartiesList = res.data.counterparties || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setCounterparties(counterpartiesList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchCounterparties();
      }, [companyId]);

      const handleAdd = async () => {
        if (!formData.name) {
          setToast({ type: 'error', message: 'Укажите название' });
          return;
        }
        const payload = {
          name: formData.name,
          is_customer: formData.role === 'customer' || formData.role === 'both',
          is_supplier: formData.role === 'supplier' || formData.role === 'both',
          contact_phone: formData.contact_phone || undefined,
          contact_email: formData.contact_email || undefined,
          inn: formData.inn || undefined,
          kpp: formData.kpp || undefined,
        };

        if (editingId) {
          const res = await apiCall('PATCH', `/companies/${companyId}/counterparties/${editingId}`, payload);
          if (res.success) {
            setToast({ type: 'success', message: 'Контрагент обновлён' });
            setShowModal(false);
            setEditingId(null);
            setFormData({ name: '', role: 'supplier', contact_phone: '', contact_email: '', inn: '', kpp: '' });
            fetchCounterparties();
          } else {
            setToast({ type: 'error', message: res.error });
          }
        } else {
          const res = await apiCall('POST', `/companies/${companyId}/counterparties`, payload);
          if (res.success) {
            setToast({ type: 'success', message: 'Контрагент добавлен' });
            setShowModal(false);
            setFormData({ name: '', role: 'supplier', contact_phone: '', contact_email: '', inn: '', kpp: '' });
            fetchCounterparties();
          } else {
            setToast({ type: 'error', message: res.error });
          }
        }
      };

      const handleEdit = (cp) => {
        const role = (cp.is_supplier && cp.is_customer) ? 'both' : (cp.is_supplier ? 'supplier' : 'customer');
        setFormData({
          name: cp.name || '',
          role,
          contact_phone: cp.contact_phone || '',
          contact_email: cp.contact_email || '',
          inn: cp.inn || '',
          kpp: cp.kpp || '',
        });
        setEditingId(cp.id);
        setShowModal(true);
      };

      const handleDelete = async (id) => {
        if (window.confirm('Удалить контрагента?')) {
          const res = await apiCall('DELETE', `/companies/${companyId}/counterparties/${id}`);
          if (res.success) {
            setToast({ type: 'success', message: 'Контрагент удалён' });

            setToast({ type: 'error', message: res.error });

                    else if (c.is_customer) roleText = '👤 Покупатель';
                    return (
                      <tr key={c.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                        <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{c.name}</td>
                        <td style={{ padding: '12px 16px', fontSize: '14px' }}>
                          <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: COLORS.blueLight, color: COLORS.accent, fontWeight: 500 }}>
                            {roleText}
                          </span>
                        </td>
                        <td style={{ padding: '12px 16px', fontSize: '14px', color: COLORS.textSecondary }}>{c.contact_phone || '—'}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                          <button onClick={() => handleEdit(c)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', marginRight: '8px', color: COLORS.accent }}>✏️</button>
                          <button onClick={() => handleDelete(c.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.red }}>🗑️</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => { setShowModal(false); setEditingId(null); setFormData({ name: '', role: 'supplier', contact_phone: '', contact_email: '', inn: '', kpp: '' }); }} title={editingId ? 'Редактировать контрагента' : 'Добавить контрагента'}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                <Input placeholder="ООО Компания" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Роль</label>
                <select value={formData.role} onChange={(e) => setFormData({ ...formData, role: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                  <option value="supplier">📦 Поставщик</option>
                  <option value="customer">👤 Покупатель</option>
                  <option value="both">🔄 Поставщик и покупатель</option>
                </select>
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>ИНН</label>
                <Input placeholder="7726058960" value={formData.inn} onChange={(e) => setFormData({ ...formData, inn: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>КПП</label>
                <Input placeholder="772601001" value={formData.kpp} onChange={(e) => setFormData({ ...formData, kpp: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Телефон</label>
                <Input placeholder="+7 (999) 123-45-67" value={formData.contact_phone} onChange={(e) => setFormData({ ...formData, contact_phone: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Email</label>
                <Input placeholder="info@company.ru" value={formData.contact_email} onChange={(e) => setFormData({ ...formData, contact_email: e.target.value })} />
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => { setShowModal(false); setEditingId(null); setFormData({ name: '', role: 'supplier', contact_phone: '', contact_email: '', inn: '', kpp: '' }); }}>Отмена</Button>
                <Button onClick={handleAdd}>{editingId ? 'Обновить' : 'Сохранить'}</Button>
              </div>
            </div>
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const Settings = () => {
      const { companyId, user } = useAuth();
      const [company, setCompany] = useState(null);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState(null);
      const [tab, setTab] = useState('profile');
      const [formData, setFormData] = useState({ name: '', inn: '' });
      const [accounts, setAccounts] = useState([]);
      const [categories, setCategories] = useState([]);
      const [showAccountModal, setShowAccountModal] = useState(false);
      const [showCategoryModal, setShowCategoryModal] = useState(false);
      const [accountFormData, setAccountFormData] = useState({ name: '', account_type: 'CHECKING', currency: 'RUB' });
      const [categoryFormData, setCategoryFormData] = useState({ name: '', type: 'INCOME' });

      useEffect(() => {
        const fetchCompany = async () => {
          setLoading(true);
          const res = await apiCall('GET', `/companies/${companyId}`);
          if (res.success) {
            setCompany(res.data);
            setFormData({ name: res.data.name || '', inn: res.data.inn || '' });
          }
          setLoading(false);
        };
        fetchCompany();
      }, [companyId]);

      useEffect(() => {
        if (tab === 'accounts') fetchAccounts();
        if (tab === 'categories') fetchCategories();
      }, [tab]);

      const handleSave = async () => {
        const res = await apiCall('PATCH', `/companies/${companyId}`, formData);
        if (res.success) {
          setToast({ type: 'success', message: 'Данные обновлены' });
          setCompany(res.data);
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const fetchAccounts = async () => {
        const res = await apiCall('GET', `/companies/${companyId}/accounts`);
        if (res.success) {
          const accList = res.data.accounts || [];
          setAccounts(accList);
        }
      };

      const fetchCategories = async () => {
        const res = await apiCall('GET', `/companies/${companyId}/categories`);
        if (res.success) {
          const catList = res.data.categories || [];
          setCategories(catList);
        }
      };

      const handleAddAccount = async () => {
        if (!accountFormData.name) {
          setToast({ type: 'error', message: 'Укажите название счёта' });
          return;
        }
        const res = await apiCall('POST', `/companies/${companyId}/accounts`, accountFormData);
        if (res.success) {
          setToast({ type: 'success', message: 'Счёт добавлен' });
          setShowAccountModal(false);
          setAccountFormData({ name: '', account_type: 'CHECKING', currency: 'RUB' });
          fetchAccounts();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDeleteAccount = async (id) => {
        if (!confirm('Удалить счёт?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/accounts/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Счёт удалён' });
          fetchAccounts();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleAddCategory = async () => {
        if (!categoryFormData.name) {
          setToast({ type: 'error', message: 'Укажите название статьи' });
          return;
        }
        const res = await apiCall('POST', `/companies/${companyId}/categories`, {
          name: categoryFormData.name,
          category_type: categoryFormData.type
        });
        if (res.success) {
          setToast({ type: 'success', message: 'Статья добавлена' });
          setShowCategoryModal(false);
          setCategoryFormData({ name: '', type: 'INCOME' });
          fetchCategories();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDeleteCategory = async (id) => {
        if (!confirm('Удалить статью?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/categories/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Статья удалена' });
          fetchCategories();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px', maxWidth: '800px' }}>
          <h2 style={{ fontSize: '24px', fontWeight: 600, marginBottom: '24px' }}>Настройки</h2>

          <div style={{ display: 'flex', gap: '12px', marginBottom: '32px' }}>
            {['profile', 'company', 'accounts', 'categories'].map((t) => (
              <button key={t} onClick={() => setTab(t)} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === t ? COLORS.accent : COLORS.grayLight, color: tab === t ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>
                {t === 'profile' && '👤 Профиль'}
                {t === 'company' && '🏢 Компания'}
                {t === 'accounts' && '💳 Счета'}
                {t === 'categories' && '📊 Статьи'}
              </button>
            ))}
          </div>

          {tab === 'profile' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '16px' }}>Профиль</h3>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', color: COLORS.textSecondary, fontWeight: 500 }}>Email</label>
                <Input type="email" value={user?.email || ''} disabled />
              </div>
            </div>
          )}

          {tab === 'company' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '16px' }}>Компания</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', color: COLORS.textSecondary, fontWeight: 500 }}>Название</label>
                  <Input value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} />
                </div>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontSize: '13px', color: COLORS.textSecondary, fontWeight: 500 }}>ИНН</label>
                  <Input value={formData.inn} onChange={(e) => setFormData({ ...formData, inn: e.target.value })} />
                </div>
                <Button onClick={handleSave} style={{ alignSelf: 'flex-start' }}>Сохранить изменения</Button>
              </div>
            </div>
          )}

          {tab === 'accounts' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                <h3 style={{ fontSize: '16px', fontWeight: 600 }}>Счета</h3>
                <Button onClick={() => setShowAccountModal(true)}>+ Добавить</Button>
              </div>
              {accounts.length === 0 ? (
                <div style={{ color: COLORS.textSecondary, textAlign: 'center', padding: '40px' }}>📋 Счётов нет</div>
              ) : (
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ borderBottom: `2px solid ${COLORS.border}` }}>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: 600 }}>Название</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: 600 }}>Тип</th>
                      <th style={{ padding: '12px', textAlign: 'left', fontWeight: 600 }}>Валюта</th>
                      <th style={{ padding: '12px', textAlign: 'right', fontWeight: 600 }}>Баланс</th>
                      <th style={{ padding: '12px', textAlign: 'center', fontWeight: 600 }}>Действия</th>
                    </tr>
                  </thead>
                  <tbody>
                    {accounts.map((acc) => (
                      <tr key={acc.id} style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                        <td style={{ padding: '12px' }}>{acc.name}</td>
                        <td style={{ padding: '12px' }}>{acc.account_type}</td>
                        <td style={{ padding: '12px' }}>{acc.currency}</td>
                        <td style={{ padding: '12px', textAlign: 'right', fontWeight: 600 }}>{formatCurrency(acc.current_balance || 0)}</td>
                        <td style={{ padding: '12px', textAlign: 'center' }}>
                          <button onClick={() => handleDeleteAccount(acc.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: COLORS.red, fontSize: '16px' }}>🗑️</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}

              <Modal isOpen={showAccountModal} onClose={() => setShowAccountModal(false)} title="Добавить счёт">
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                    <Input placeholder="Расчётный счёт" value={accountFormData.name} onChange={(e) => setAccountFormData({ ...accountFormData, name: e.target.value })} />
                  </div>
                  <div>
                    <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Тип счёта</label>
                    <select value={accountFormData.account_type} onChange={(e) => setAccountFormData({ ...accountFormData, account_type: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                      <option value="CHECKING">Расчётный</option>
                      <option value="SAVINGS">Сбережения</option>
                      <option value="CASH">Касса</option>
                      <option value="CREDIT">Кредит</option>
                    </select>
                  </div>
                  <div>
                    <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Валюта</label>
                    <select value={accountFormData.currency} onChange={(e) => setAccountFormData({ ...accountFormData, currency: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                      <option value="RUB">RUB</option>
                      <option value="USD">USD</option>
                      <option value="EUR">EUR</option>
                    </select>
                  </div>
                  <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                    <Button variant="outline" onClick={() => setShowAccountModal(false)}>Отмена</Button>
                    <Button onClick={handleAddAccount}>Сохранить</Button>
                  </div>
                </div>
              </Modal>
            </div>
          )}

          {tab === 'categories' && (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
              <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '16px' }}>Статьи доходов и расходов</h3>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px' }}>
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                    <h4 style={{ fontSize: '14px', fontWeight: 600, color: COLORS.green }}>📈 Доходы</h4>
                    <Button size="sm" onClick={() => { setCategoryFormData({ name: '', type: 'INCOME' }); setShowCategoryModal(true); }}>+</Button>
                  </div>
                  {categories.filter(c => c.category_type === 'income').length === 0 ? (
                    <div style={{ color: COLORS.textSecondary, fontSize: '13px' }}>Нет статей доходов</div>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      {categories.filter(c => c.category_type === 'income').map((cat) => (
                        <div key={cat.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px', background: COLORS.greenLight, borderRadius: '6px' }}>
                          <span style={{ fontSize: '13px' }}>{cat.name}</span>
                          <button onClick={() => handleDeleteCategory(cat.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: COLORS.red, fontSize: '14px' }}>🗑️</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                    <h4 style={{ fontSize: '14px', fontWeight: 600, color: COLORS.red }}>📉 Расходы</h4>
                    <Button size="sm" onClick={() => { setCategoryFormData({ name: '', type: 'EXPENSE' }); setShowCategoryModal(true); }}>+</Button>
                  </div>
                  {categories.filter(c => c.category_type === 'expense').length === 0 ? (
                    <div style={{ color: COLORS.textSecondary, fontSize: '13px' }}>Нет статей расходов</div>
                  ) : (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      {categories.filter(c => c.category_type === 'expense').map((cat) => (
                        <div key={cat.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px', background: COLORS.redLight, borderRadius: '6px' }}>
                          <span style={{ fontSize: '13px' }}>{cat.name}</span>
                          <button onClick={() => handleDeleteCategory(cat.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: COLORS.red, fontSize: '14px' }}>🗑️</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              <Modal isOpen={showCategoryModal} onClose={() => setShowCategoryModal(false)} title={`Добавить ${categoryFormData.type === 'INCOME' ? 'доход' : 'расход'}`}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                    <Input placeholder="Название статьи" value={categoryFormData.name} onChange={(e) => setCategoryFormData({ ...categoryFormData, name: e.target.value })} />
                  </div>
                  <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                    <Button variant="outline" onClick={() => setShowCategoryModal(false)}>Отмена</Button>
                    <Button onClick={handleAddCategory}>Сохранить</Button>
                  </div>
                </div>
              </Modal>
            </div>
          )}

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    // Сайдбар с новыми пунктами
    const Sidebar = ({ currentPage, onNavigate }) => {

      const menuItems = [
        { label: '📊 Дашборд', hash: '#dashboard' },
        { label: '💳 Операции', hash: '#transactions' },
        { label: '📅 Календарь', hash: '#calendar' },
        { label: '📈 Отчёты', hash: '#reports' },
        { label: '👥 Контрагенты', hash: '#counterparties' },
        { label: '📁 Проекты', hash: '#projects' },
        { label: '💰 Бюджеты', hash: '#budgets' },
        { label: '📋 Заявки на оплату', hash: '#payment-requests' },

        { label: '📦 Основные средства', hash: '#assets' },
        { label: '🏦 Банки', hash: '#banks' },
        { label: '📄 Документы', hash: '#documents' },
        { label: '🏦 Займы', hash: '#loans' },

        >
          <div style={{ fontSize: '20px', fontWeight: 700, marginBottom: '24px', textAlign: 'center' }}>

          </div>

                    fontSize: '14px',

                fontWeight: 600,
                margin: '0 auto 12px',

        payroll: '👷 Сотрудники и ФОТ',
        assets: '📦 Основные средства',
        banks: '🏦 Банки',
        documents: '📄 Документы',
        loans: '🏦 Займы и кредиты',
        taxes: '🧾 Налоги',
        accruals: '📋 Начисления',
        settings: '⚙️ Настройки',
      };

      return (
        <div style={{ display: 'flex', height: '100vh' }}>
          <Sidebar currentPage={currentPage} onNavigate={() => {}} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            <Header title={titles[currentPage] || 'ПланФакт'} />
            <div style={{ flex: 1, overflowY: 'auto', background: COLORS.bg }}>
              {children}
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [currentPage, setCurrentPage] = useState(() => {
        const hash = window.location.hash.slice(1) || 'dashboard';
        return hash.split('?')[0];
      });

      const { token, login, logout } = useAuth();

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.slice(1) || 'dashboard';
          setCurrentPage(hash.split('?')[0]);
        };

        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      if (!token) {
        return <AuthScreen onLoginSuccess={login} />;
      }

      const pageMap = {
        dashboard: <Dashboard />,
        transactions: <Transactions />,
        calendar: <Calendar />,
        reports: <Reports />,
        counterparties: <Counterparties />,
        projects: <Projects />,
        budgets: <Budgets />,
        'payment-requests': <PaymentRequests />,
        payroll: <Payroll />,
        assets: <Assets />,
        banks: <Banks />,
        documents: <Documents />,
        loans: <Loans />,
        taxes: <Taxes />,
        accruals: <Accruals />,
        settings: <Settings />,
      };

      return (
        <Layout currentPage={currentPage}>
          {pageMap[currentPage] || <Dashboard />}
        </Layout>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AuthProvider>
        <App />
      </AuthProvider>
    );
  </script>
</body>
</html>
