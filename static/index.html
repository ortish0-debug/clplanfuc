            <div style={{ display: 'flex', gap: '12px' }}>
              {canWrite('assets') && <Button variant="outline" onClick={handleAmortize}>📊 Начислить амортизацию</Button>}
              {canWrite('assets') && <Button onClick={() => setShowModal(true)}>+ Добавить ОС</Button>}
            </div>
          </div>

          {assets.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📦</div>
              <div style={{ marginBottom: '16px' }}>Основных средств нет</div>
              {canWrite('assets') && <Button onClick={() => setShowModal(true)}>Добавить первое ОС</Button>}
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Название</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Стоимость</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата ввода</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Срок мес.</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Остат. стоим.</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {assets.map((a) => (
                    <tr key={a.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                      <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{a.name}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600 }}>{formatCurrency(a.purchase_cost)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>{formatDate(a.purchase_date)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>{a.amortization_months}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600, color: COLORS.green }}>{formatCurrency(a.residual_value || a.purchase_cost)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                        <button onClick={() => canDelete() && handleDelete(a.id)} style={{ background: 'none', border: 'none', cursor: canDelete() ? 'pointer' : 'default', fontSize: '16px', color: canDelete() ? COLORS.red : COLORS.border }}>🗑️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Добавить основное средство">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                <Input value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} placeholder="Компьютер, здание и т.д." />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Стоимость покупки *</label>
                <Input type="number" value={formData.purchase_cost} onChange={(e) => setFormData({ ...formData, purchase_cost: e.target.value })} placeholder="100000" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата покупки *</label>
                <Input type="date" value={formData.purchase_date} onChange={(e) => setFormData({ ...formData, purchase_date: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Срок амортизации (месяцы) *</label>
                <Input type="number" value={formData.amortization_months} onChange={(e) => setFormData({ ...formData, amortization_months: e.target.value })} placeholder="60" />
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => setShowModal(false)}>Отмена</Button>
                <Button onClick={handleAdd}>Добавить</Button>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

    const Banks = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [connections, setConnections] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [showOpsModal, setShowOpsModal] = useState(false);
      const [selectedBank, setSelectedBank] = useState(null);
      const [selectedConnection, setSelectedConnection] = useState(null);
      const [bankOperations, setBankOperations] = useState([]);
      const [opsLoading, setOpsLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const [formData, setFormData] = useState({ api_key: '' });

      const banks = [
        { id: 'tinkoff', name: 'Тинькофф', emoji: '🏦' },
        { id: 'sberbank', name: 'Сбербанк', emoji: '🏦' },
        { id: 'alfa', name: 'Альфа-Банк', emoji: '🏦' },
        { id: 'tochka', name: 'Точка', emoji: '🏦' },
        { id: 'modulbank', name: 'Модульбанк', emoji: '🏦' },
      ];

      const fetchConnections = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/bank-connections`);
        if (res.success) {
          const connectionsList = res.data['bank-connections'] || res.data.connections || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setConnections(connectionsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchConnections();
      }, [companyId]);

      const isConnected = (bankId) => connections.some((c) => c.bank_name === bankId);

      const handleConnect = async () => {
        if (!formData.api_key) {
          setToast({ type: 'error', message: 'Укажите API ключ' });
          return;
        }
        const res = await apiCall('POST', `/companies/${companyId}/bank-integrations/${selectedBank}/connect`, { api_key: formData.api_key });
        if (res.success) {
          setToast({ type: 'success', message: 'Банк подключен' });
          setShowModal(false);
          setFormData({ api_key: '' });
          fetchConnections();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDisconnect = async (connId) => {
        if (!confirm('Отключить банк?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/bank-connections/${connId}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Банк отключен' });
          fetchConnections();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleSync = async (connId) => {
        const res = await apiCall('POST', `/companies/${companyId}/bank-connections/${connId}/sync`, {});
        if (res.success) {
          setToast({ type: 'success', message: 'Синхронизация запущена' });
          await fetchBankOperations(connId);
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const fetchBankOperations = async (connId) => {
        setOpsLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/bank-connections/${connId}/operations`);
        if (res.success) {
          const opsList = res.data.operations || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setBankOperations(opsList);
          setShowOpsModal(true);
        } else {
          setToast({ type: 'error', message: 'Не удалось загрузить операции' });
        }
        setOpsLoading(false);
      };

      const handleViewOperations = (conn) => {
        setSelectedConnection(conn);
        fetchBankOperations(conn.id);
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <h2 style={{ fontSize: '24px', fontWeight: 600, marginBottom: '32px' }}>Подключение банков</h2>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(250px, 1fr))', gap: '20px' }}>
            {banks.map((bank) => {
              const connection = connections.find((c) => c.bank_name === bank.id);
              return (
                <div
                  key={bank.id}
                  style={{
                    background: COLORS.white,
                    borderRadius: '12px',
                    padding: '24px',
                    border: `1px solid ${COLORS.border}`,
                    textAlign: 'center',
                  }}
                >
                  <div style={{ fontSize: '40px', marginBottom: '16px' }}>{bank.emoji}</div>
                  <h3 style={{ fontSize: '16px', fontWeight: 600, marginBottom: '16px' }}>{bank.name}</h3>
                  <div style={{ marginBottom: '16px', fontSize: '13px', color: COLORS.textSecondary }}>
                    {connection ? '✓ Подключен' : 'Не подключен'}
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    {!connection ? (
                      <Button
                        onClick={() => {
                          setSelectedBank(bank.id);
                          setShowModal(true);
                        }}
                      >
                        Подключить
                      </Button>
                    ) : (
                      <>
                        <Button variant="outline" onClick={() => handleViewOperations(connection)}>
                          📊 Операции
                        </Button>
                        <Button variant="outline" onClick={() => handleSync(connection.id)}>
                          🔄 Синхронизировать
                        </Button>
                        <Button variant="outline" onClick={() => handleDisconnect(connection.id)} style={{ color: COLORS.red, borderColor: COLORS.red }}>
                          Отключить
                        </Button>
                      </>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title={`Подключить ${banks.find((b) => b.id === selectedBank)?.name || 'банк'}`}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>API ключ или токен *</label>
                <Input value={formData.api_key} onChange={(e) => setFormData({ ...formData, api_key: e.target.value })} placeholder="Вставьте ключ из личного кабинета банка" type="password" />
              </div>
              <div style={{ fontSize: '12px', color: COLORS.textSecondary }}>
                Ключ будет зашифрован и храниться безопасно
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => setShowModal(false)}>Отмена</Button>
                <Button onClick={handleConnect}>Подключить</Button>
              </div>
            </div>
          </Modal>

          <Modal isOpen={showOpsModal} onClose={() => setShowOpsModal(false)} title={`Операции ${selectedConnection?.bank_name || ''}`} style={{ maxWidth: '900px' }}>
            {opsLoading ? (
              <div style={{ textAlign: 'center', padding: '40px', color: COLORS.textSecondary }}>⏳ Загрузка операций...</div>
            ) : bankOperations.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '40px', color: COLORS.textSecondary }}>Операций не найдено</div>
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                      <th style={{ padding: '12px 8px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary }}>Дата</th>
                      <th style={{ padding: '12px 8px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary }}>Описание</th>
                      <th style={{ padding: '12px 8px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary }}>Сумма</th>
                      <th style={{ padding: '12px 8px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary }}>Статус</th>
                    </tr>
                  </thead>
                  <tbody>
                    {bankOperations.map((op, i) => (
                      <tr key={i} style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                        <td style={{ padding: '12px 8px', fontSize: '13px' }}>{formatDate(op.date || op.created_at)}</td>
                        <td style={{ padding: '12px 8px', fontSize: '13px' }}>{op.description || op.purpose || '—'}</td>

                        </td>
                        <td style={{ padding: '12px 8px', textAlign: 'center', fontSize: '12px' }}>
                          <span style={{ display: 'inline-block', padding: '4px 8px', borderRadius: '4px', fontSize: '11px', fontWeight: 500, background: op.status === 'completed' ? COLORS.greenLight : COLORS.yellowLight, color: op.status === 'completed' ? COLORS.green : '#B8860B' }}>
                            {op.status === 'completed' ? '✓ Готово' : '⏳ В обработке'}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const Documents = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [documents, setDocuments] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [uploadFile, setUploadFile] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        type: 'contract',
        date: new Date().toISOString().split('T')[0],
        counterparty: '',
        description: '',
      });

      const fetchDocuments = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/documents`);
        if (res.success) {
          const documentsList = res.data.documents || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setDocuments(documentsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchDocuments();
      }, [companyId]);

      const handleAdd = async () => {
        if (!formData.name) {
          setToast({ type: 'error', message: 'Укажите название' });
          return;
        }

        if (uploadFile) {
          const formDataUpload = new FormData();
          formDataUpload.append('name', formData.name);
          formDataUpload.append('type', formData.type);
          formDataUpload.append('date', formData.date);
          formDataUpload.append('counterparty', formData.counterparty);
          formDataUpload.append('description', formData.description);
          formDataUpload.append('file', uploadFile);

          try {
            const response = await fetch(`/companies/${companyId}/documents/upload`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
              body: formDataUpload,
            });
            if (response.ok) {
              setToast({ type: 'success', message: 'Документ загружен' });
              setShowModal(false);
              setFormData({ name: '', type: 'contract', date: new Date().toISOString().split('T')[0], counterparty: '', description: '' });
              setUploadFile(null);
              fetchDocuments();
            } else {
              setToast({ type: 'error', message: 'Ошибка при загрузке' });
            }
          } catch (err) {
            setToast({ type: 'error', message: 'Ошибка подключения' });
          }
        } else {
          const res = await apiCall('POST', `/companies/${companyId}/documents`, formData);
          if (res.success) {
            setToast({ type: 'success', message: 'Документ добавлен' });
            setShowModal(false);
            setFormData({ name: '', type: 'contract', date: new Date().toISOString().split('T')[0], counterparty: '', description: '' });
            fetchDocuments();
          } else {
            setToast({ type: 'error', message: res.error });
          }
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить документ?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/documents/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Документ удалён' });
          fetchDocuments();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Документы</h2>
            {canWrite('documents') && <Button onClick={() => setShowModal(true)}>+ Добавить документ</Button>}
          </div>

          {documents.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📄</div>
              <div style={{ marginBottom: '16px' }}>Документов нет</div>
              {canWrite('documents') && <Button onClick={() => setShowModal(true)}>Загрузить первый документ</Button>}
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Название</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Тип</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Контрагент</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {documents.map((d) => (
                    <tr key={d.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                      <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{d.name}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px' }}>
                        <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: COLORS.blueLight, color: COLORS.accent, fontWeight: 500 }}>
                          {d.type === 'contract' ? '📋 Договор' : d.type === 'act' ? '✓ Акт' : '💳 ' + (d.type || 'Документ')}
                        </span>
                      </td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px', color: COLORS.textSecondary }}>{formatDate(d.date)}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px', color: COLORS.textSecondary }}>{d.counterparty || '—'}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                        {d.file_url && <a href={d.file_url} target="_blank" rel="noopener noreferrer" style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.accent, marginRight: '8px' }}>📥</a>}
                        <button onClick={() => canDelete() && handleDelete(d.id)} style={{ background: 'none', border: 'none', cursor: canDelete() ? 'pointer' : 'default', fontSize: '16px', color: canDelete() ? COLORS.red : COLORS.border }}>🗑️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Добавить документ">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                <Input value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} placeholder="Договор с ООО Компания" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Тип</label>
                <select value={formData.type} onChange={(e) => setFormData({ ...formData, type: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontFamily: 'Inter', fontSize: '14px' }}>
                  <option value="contract">📋 Договор</option>
                  <option value="act">✓ Акт</option>
                  <option value="invoice">💳 Счёт</option>
                  <option value="other">📄 Другое</option>
                </select>
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Контрагент</label>
                <Input value={formData.counterparty} onChange={(e) => setFormData({ ...formData, counterparty: e.target.value })} placeholder="ООО Компания" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата</label>
                <Input type="date" value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Загрузить файл</label>
                <input type="file" onChange={(e) => setUploadFile(e.target.files[0])} style={{ padding: '10px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', width: '100%' }} />
                {uploadFile && <div style={{ fontSize: '13px', color: COLORS.green, marginTop: '8px' }}>✓ {uploadFile.name}</div>}
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => { setShowModal(false); setUploadFile(null); }}>Отмена</Button>
                <Button onClick={handleAdd}>Добавить</Button>
              </div>
            </div>
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // НОВЫЕ ЭКРАНЫ: ЗАЙМЫ, НАЛОГИ, НАЧИСЛЕНИЯ
    // ─────────────────────────────────────────────────────────────────────────────

    const Loans = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [loans, setLoans] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [showScheduleModal, setShowScheduleModal] = useState(false);
      const [selectedLoan, setSelectedLoan] = useState(null);
      const [schedule, setSchedule] = useState([]);
      const [toast, setToast] = useState(null);
      const [counterparties, setCounterparties] = useState([]);
      const [formData, setFormData] = useState({
        contract_number: '',
        type: 'annuity',
        principal_amount: '',
        interest_rate: '',
        duration_months: '',
        start_date: new Date().toISOString().split('T')[0],
        counterpart_id: '',
      });

      const fetchLoans = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/loans`);
        if (res.success) {
          const loansList = res.data.loans || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setLoans(loansList);
        }
        setLoading(false);
      };

      const fetchCounterparties = async () => {
        const res = await apiCall('GET', `/companies/${companyId}/counterparties`);
        if (res.success) {
          const counterpartiesList = res.data.counterparties || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setCounterparties(counterpartiesList);
        }
      };

      useEffect(() => {
        fetchLoans();
        fetchCounterparties();
      }, [companyId]);

      const handleAdd = async () => {
        if (!formData.contract_number || !formData.principal_amount || !formData.duration_months) {
          setToast({ type: 'error', message: 'Заполните все обязательные поля (*)' });
          return;
        }
        const payload = {
          contract_number: formData.contract_number,
          type: formData.type,
          principal_amount: parseFloat(formData.principal_amount) || 0,
          interest_rate: parseFloat(formData.interest_rate) || 0,
          duration_months: parseInt(formData.duration_months) || 0,
          start_date: formData.start_date,
          counterpart_id: formData.counterpart_id && formData.counterpart_id !== '' ? formData.counterpart_id : null,
        };
        const res = await apiCall('POST', `/companies/${companyId}/loans`, payload);
        if (res.success) {
          setToast({ type: 'success', message: 'Займ добавлен' });
          setShowModal(false);
          setFormData({ contract_number: '', type: 'annuity', principal_amount: '', interest_rate: '', duration_months: '', start_date: new Date().toISOString().split('T')[0], counterpart_id: '' });
          fetchLoans();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить займ?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/loans/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Займ удалён' });
          fetchLoans();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const fetchSchedule = async (loanId) => {
        const res = await apiCall('GET', `/companies/${companyId}/loans/${loanId}/schedule`);
        if (res.success) {
          const scheduleList = res.data.schedule || res.data.items || (Array.isArray(res.data) ? res.data : []);
          setSchedule(scheduleList);
        }
      };

      const handleShowSchedule = async (loan) => {
        setSelectedLoan(loan);
        await fetchSchedule(loan.id);
        setShowScheduleModal(true);
      };

      const handlePayment = async (scheduleId) => {
        const res = await apiCall('POST', `/companies/${companyId}/loans/schedule/${scheduleId}/pay`, {});
        if (res.success) {
          setToast({ type: 'success', message: 'Платёж отмечен' });
          await fetchSchedule(selectedLoan.id);
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Займы и кредиты</h2>
            {canWrite('loans') && <Button onClick={() => setShowModal(true)}>+ Добавить займ</Button>}
          </div>

          {loans.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>🏦</div>
              <div style={{ marginBottom: '16px' }}>Займов нет</div>
              {canWrite('loans') && <Button onClick={() => setShowModal(true)}>Добавить первый займ</Button>}
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Номер договора</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Тип</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Сумма</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Остаток</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Ставка %</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата начала</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {loans.map((loan) => (
                    <tr key={loan.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s', cursor: 'pointer' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                      <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500, cursor: 'pointer', color: COLORS.accent, textDecoration: 'underline' }} onClick={() => handleShowSchedule(loan)}>{loan.contract_number || loan.name}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px' }}>
                        <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: COLORS.blueLight, color: COLORS.accent, fontWeight: 500 }}>
                          {(loan.loan_type || loan.type) === 'annuity' ? '📊 Аннуитет' : '📈 Дифференцированный'}
                        </span>
                      </td>
                      <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600 }}>{formatCurrency(loan.principal_amount || loan.total_amount)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600, color: COLORS.green }}>{formatCurrency(loan.remaining_principal || loan.principal_amount || loan.total_amount)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>{loan.interest_rate}%</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px', color: COLORS.textSecondary }}>{formatDate(loan.start_date)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                        <button onClick={() => canDelete() && handleDelete(loan.id)} style={{ background: 'none', border: 'none', cursor: canDelete() ? 'pointer' : 'default', fontSize: '16px', color: canDelete() ? COLORS.red : COLORS.border }}>🗑️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Добавить займ">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Номер договора *</label>
                <Input value={formData.contract_number} onChange={(e) => setFormData({ ...formData, contract_number: e.target.value })} placeholder="ДКР-2026-001" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Кредитор (контрагент)</label>
                <select value={formData.counterpart_id} onChange={(e) => setFormData({ ...formData, counterpart_id: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                  <option value="">— Выбрать контрагента —</option>
                  {counterparties.map((cp) => <option key={cp.id} value={cp.id}>{cp.name}</option>)}
                </select>
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Тип расчёта *</label>
                <select value={formData.type} onChange={(e) => setFormData({ ...formData, type: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                  <option value="annuity">📊 Аннуитет</option>
                  <option value="differentiated">📈 Дифференцированный</option>
                </select>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Сумма займа *</label>
                  <Input type="number" value={formData.principal_amount} onChange={(e) => setFormData({ ...formData, principal_amount: e.target.value })} placeholder="500000" />
                </div>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Годовая ставка %</label>
                  <Input type="number" value={formData.interest_rate} onChange={(e) => setFormData({ ...formData, interest_rate: e.target.value })} placeholder="12" step="0.1" />
                </div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Срок (месяцев) *</label>
                  <Input type="number" value={formData.duration_months} onChange={(e) => setFormData({ ...formData, duration_months: e.target.value })} placeholder="60" />
                </div>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата начала *</label>
                  <Input type="date" value={formData.start_date} onChange={(e) => setFormData({ ...formData, start_date: e.target.value })} />
                </div>
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => setShowModal(false)}>Отмена</Button>
                <Button onClick={handleAdd}>Добавить</Button>
              </div>
            </div>
          </Modal>

          <Modal isOpen={showScheduleModal} onClose={() => setShowScheduleModal(false)} title={`График платежей: ${selectedLoan?.contract_number}`} style={{ maxWidth: '620px' }}>
            {schedule.length === 0 ? (
              <div style={{ color: COLORS.textSecondary, textAlign: 'center', padding: '32px 0' }}>График платежей не загружен</div>
            ) : (
              <div style={{ overflowY: 'auto', maxHeight: '400px' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                  <thead>
                    <tr style={{ borderBottom: `2px solid ${COLORS.border}` }}>
                      <th style={{ padding: '8px', textAlign: 'left', fontWeight: 600 }}>Дата</th>
                      <th style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>Сумма</th>
                      <th style={{ padding: '8px', textAlign: 'center', fontWeight: 600 }}>Статус</th>
                      <th style={{ padding: '8px', textAlign: 'center', fontWeight: 600 }}>Действие</th>
                    </tr>
                  </thead>
                  <tbody>
                    {schedule.map((payment, i) => (
                      <tr key={i} style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                        <td style={{ padding: '8px' }}>{formatDate(payment.date)}</td>
                        <td style={{ padding: '8px', textAlign: 'right', fontWeight: 600 }}>{formatCurrency(payment.amount)}</td>
                        <td style={{ padding: '8px', textAlign: 'center' }}>
                          {payment.is_paid ? (
                            <span style={{ color: COLORS.green, fontWeight: 600 }}>✓ Оплачено</span>
                          ) : (
                            <span style={{ color: COLORS.red, fontWeight: 600 }}>✕ Не оплачено</span>
                          )}
                        </td>
                        <td style={{ padding: '8px', textAlign: 'center' }}>
                          {!payment.is_paid && canApprove() && (
                            <button onClick={() => handlePayment(payment.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.green }}>
                              ✓ Отметить
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const Taxes = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [tab, setTab] = useState('usn');
      const [loading, setLoading] = useState(true);
      const [calculating, setCalculating] = useState(false);
      const [data, setData] = useState(null);
      const [vatRecords, setVatRecords] = useState([]);
      const [toast, setToast] = useState(null);

      const handleCalculateTax = async (taxType) => {
        setCalculating(true);
        const res = await apiCall('POST', `/companies/${companyId}/taxes/calculate`, { tax_type: taxType });
        setCalculating(false);
        if (res.success) {
          setToast({ type: 'success', message: `${taxType.toUpperCase()} рассчитан` });
          // Перезагружаем данные после расчёта
          const endpoint = `/companies/${companyId}/reports/${taxType}`;
          const reportRes = await apiCall('GET', endpoint);
          if (reportRes.success) setData(reportRes.data);
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleExportTax = async (taxType) => {
        const res = await apiCall('GET', `/companies/${companyId}/taxes/export?format=pdf&tax_type=${taxType}`);
        if (res.success && res.data?.download_url) {
          window.open(res.data.download_url, '_blank');
          setToast({ type: 'success', message: 'Отчёт скачан' });
        } else {
          setToast({ type: 'error', message: 'Ошибка при скачивании' });
        }
      };

      useEffect(() => {
        const fetchData = async () => {
          setLoading(true);
          let endpoint = '';
          if (tab === 'usn') endpoint = `/companies/${companyId}/reports/usn`;
          if (tab === 'vat') endpoint = `/companies/${companyId}/reports/vat`;
          if (tab === '3ndfl') endpoint = `/companies/${companyId}/reports/3ndfl`;

          const res = await apiCall('GET', endpoint);
          if (res.success) setData(res.data);

          if (tab === 'vat') {
            const vatRes = await apiCall('GET', `/companies/${companyId}/taxes/vat-records`);
            if (vatRes.success) {
              const recordsList = vatRes.data.records || vatRes.data.items || (Array.isArray(vatRes.data) ? vatRes.data : []);
              setVatRecords(recordsList);
            }
          }
          setLoading(false);
        };
        fetchData();
      }, [companyId, tab]);

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <h2 style={{ fontSize: '24px', fontWeight: 600, marginBottom: '24px' }}>Налоги</h2>

          <div style={{ display: 'flex', gap: '12px', marginBottom: '32px' }}>
            {['usn', 'vat', '3ndfl'].map((t) => (
              <button key={t} onClick={() => setTab(t)} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === t ? COLORS.accent : COLORS.grayLight, color: tab === t ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>
                {t === 'usn' && '🇷🇺 УСН'}
                {t === 'vat' && '💳 НДС'}
                {t === '3ndfl' && '📋 3-НДФЛ'}
              </button>
            ))}
          </div>

          {tab === 'usn' && (
            <div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '20px', marginBottom: '24px' }}>
                <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                  <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Налоговая база</div>
                  <div style={{ fontSize: '28px', fontWeight: 700, color: COLORS.accent }}>{formatCurrency(data?.tax_base || 0)}</div>
                </div>
                <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                  <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Страховые взносы</div>
                  <div style={{ fontSize: '28px', fontWeight: 700, color: COLORS.green }}>{formatCurrency(data?.insurance_contributions || 0)}</div>
                </div>
                <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                  <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Сумма налога</div>
                  <div style={{ fontSize: '28px', fontWeight: 700, color: COLORS.red }}>{formatCurrency(data?.tax_amount || 0)}</div>
                </div>
                <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                  <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Период</div>
                  <div style={{ fontSize: '18px', fontWeight: 700 }}>{data?.period || 'Н/Д'}</div>
                </div>
              </div>
              <div style={{ display: 'flex', gap: '12px' }}>
                {canWrite('taxes') && <Button onClick={() => handleCalculateTax('usn')}>{calculating ? '⏳ Расчёт...' : '📊 Рассчитать УСН'}</Button>}
                {data?.tax_amount && <Button variant="outline" onClick={() => handleExportTax('usn')}>📥 Скачать PDF</Button>}
              </div>
            </div>
          )}

          {tab === 'vat' && (
            <div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '20px', marginBottom: '24px' }}>
                <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                  <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Исходящий НДС</div>
                  <div style={{ fontSize: '28px', fontWeight: 700, color: COLORS.green }}>{formatCurrency(data?.outgoing_vat || 0)}</div>
                </div>
                <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                  <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Входящий НДС</div>
                  <div style={{ fontSize: '28px', fontWeight: 700, color: COLORS.blue }}>{formatCurrency(data?.incoming_vat || 0)}</div>
                </div>
                <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                  <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>К уплате</div>
                  <div style={{ fontSize: '28px', fontWeight: 700, color: COLORS.red }}>{formatCurrency((data?.outgoing_vat || 0) - (data?.incoming_vat || 0))}</div>
                </div>
              </div>
              {vatRecords.length === 0 ? (
                <div style={{ background: COLORS.white, borderRadius: '12px', padding: '32px', textAlign: 'center', color: COLORS.textSecondary }}>Записей НДС не найдено</div>
              ) : (
                <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '13px' }}>
                    <thead>
                      <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                        <th style={{ padding: '12px 16px', textAlign: 'left', fontWeight: 600, color: COLORS.textSecondary }}>Документ</th>
                        <th style={{ padding: '12px 16px', textAlign: 'right', fontWeight: 600, color: COLORS.textSecondary }}>Сумма НДС</th>
                        <th style={{ padding: '12px 16px', textAlign: 'left', fontWeight: 600, color: COLORS.textSecondary }}>Дата</th>
                      </tr>
                    </thead>
                    <tbody>
                      {vatRecords.map((record, i) => (
                        <tr key={i} style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                          <td style={{ padding: '12px 16px' }}>{record.document_name || 'Документ'}</td>
                          <td style={{ padding: '12px 16px', textAlign: 'right', fontWeight: 600 }}>{formatCurrency(record.vat_amount)}</td>
                          <td style={{ padding: '12px 16px' }}>{formatDate(record.date)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}

          {tab === '3ndfl' && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '20px' }}>
              <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Доход ИП</div>
                <div style={{ fontSize: '28px', fontWeight: 700, color: COLORS.green }}>{formatCurrency(data?.income || 0)}</div>
              </div>
              <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Налоговая ставка</div>
                <div style={{ fontSize: '28px', fontWeight: 700 }}>{data?.rate || 13}%</div>
              </div>
              <div style={{ background: COLORS.white, borderRadius: '12px', padding: '24px', border: `1px solid ${COLORS.border}` }}>
                <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '8px' }}>Сумма налога</div>
                <div style={{ fontSize: '28px', fontWeight: 700, color: COLORS.red }}>{formatCurrency(data?.tax_amount || 0)}</div>
              </div>
            </div>
          )}

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const Accruals = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [tab, setTab] = useState('documents');
      const [documents, setDocuments] = useState([]);
      const [balances, setBalances] = useState([]);
      const [counterparties, setCounterparties] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [showLinkModal, setShowLinkModal] = useState(false);
      const [selectedDoc, setSelectedDoc] = useState(null);
      const [toast, setToast] = useState(null);
      const [formData, setFormData] = useState({
        counterparty_id: '',
        doc_number: '',
        doc_type: 'revenue',
        amount: '',
        doc_date: new Date().toISOString().split('T')[0],
        description: '',
      });

      const fetchDocuments = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/accrual-documents`);
        if (res.success) {
          const docsList = res.data.documents || res.data.items || (Array.isArray(res.data) ? res.data : []);
          setDocuments(docsList);
        }
        setLoading(false);
      };

      const fetchBalances = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/counterparties/balances`);
        if (res.success) {
          const balancesList = res.data.balances || res.data.items || (Array.isArray(res.data) ? res.data : []);
          setBalances(balancesList);
        }
        setLoading(false);
      };

      const fetchCounterparties = async () => {
        const res = await apiCall('GET', `/companies/${companyId}/counterparties`);
        if (res.success) {
          const counterpartiesList = res.data.counterparties || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setCounterparties(counterpartiesList);
        }
      };

      const fetchTransactions = async () => {
        const res = await apiCall('GET', `/companies/${companyId}/transactions`);
        if (res.success) {
          const txList = res.data.transactions || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setTransactions(txList);
        }
      };

      const handleLinkPayment = async (transactionId) => {
        if (!selectedDoc) {
          setToast({ type: 'error', message: 'Выберите документ' });
          return;
        }
        const res = await apiCall('POST', `/companies/${companyId}/accruals/link`, {
          accrual_document_id: selectedDoc.id,
          transaction_id: transactionId,
        });
        if (res.success) {
          setToast({ type: 'success', message: 'Платёж привязан' });
          setShowLinkModal(false);
          setSelectedDoc(null);
          fetchDocuments();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      useEffect(() => {
        fetchCounterparties();
        fetchTransactions();
        if (tab === 'documents') fetchDocuments();
        else fetchBalances();
      }, [companyId, tab]);

      const handleAdd = async () => {
        if (!formData.counterparty_id || !formData.amount) {
          setToast({ type: 'error', message: 'Заполните обязательные поля' });
          return;
        }
        const payload = {
          counterparty_id: formData.counterparty_id,
          doc_number: formData.doc_number,
          doc_type: formData.doc_type,
          amount: parseFloat(formData.amount) || 0,
          doc_date: formData.doc_date,
          description: formData.description || '',
        };
        const res = await apiCall('POST', `/companies/${companyId}/accrual-documents`, payload);
        if (res.success) {
          setToast({ type: 'success', message: 'Документ создан' });
          setShowModal(false);
          setFormData({ counterparty_id: '', doc_number: '', doc_type: 'accrual', amount: '', doc_date: new Date().toISOString().split('T')[0], description: '' });
          fetchDocuments();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить документ?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/accrual-documents/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Документ удалён' });
          fetchDocuments();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Начисления</h2>
            {tab === 'documents' && canWrite('accruals') && <Button onClick={() => setShowModal(true)}>+ Создать документ</Button>}
          </div>

          <div style={{ display: 'flex', gap: '12px', marginBottom: '24px' }}>
            <button onClick={() => setTab('documents')} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === 'documents' ? COLORS.accent : COLORS.grayLight, color: tab === 'documents' ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>
              📋 Документы
            </button>
            <button onClick={() => setTab('balances')} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === 'balances' ? COLORS.accent : COLORS.grayLight, color: tab === 'balances' ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>
              📊 Ведомость долгов
            </button>
          </div>

          {tab === 'documents' ? (
            documents.length === 0 ? (
              <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
                <div style={{ fontSize: '32px', marginBottom: '12px' }}>📋</div>
                <div style={{ marginBottom: '16px' }}>Документов нет</div>
                {canWrite('accruals') && <Button onClick={() => setShowModal(true)}>Создать первый документ</Button>}
              </div>
            ) : (
              <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                      <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Номер</th>
                      <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Контрагент</th>
                      <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Сумма</th>
                      <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата</th>
                      <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Статус</th>
                      <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                    </tr>
                  </thead>
                  <tbody>
                    {documents.map((doc) => (
                      <tr key={doc.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                        <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{doc.number || 'Док.'}</td>
                        <td style={{ padding: '12px 16px', fontSize: '14px' }}>{doc.counterparty_name || 'Контрагент'}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600 }}>{formatCurrency(doc.amount)}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px', color: COLORS.textSecondary }}>{formatDate(doc.date)}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'center' }}>
                          <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: COLORS.blueLight, color: COLORS.accent, fontWeight: 500 }}>
                            {doc.is_paid ? '✓ Оплачено' : '⏳ Ожидает'}
                          </span>
                        </td>
                        <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                          <button onClick={() => { setSelectedDoc(doc); setShowLinkModal(true); }} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', marginRight: '8px', color: COLORS.accent }}>🔗</button>
                          <button onClick={() => canDelete() && handleDelete(doc.id)} style={{ background: 'none', border: 'none', cursor: canDelete() ? 'pointer' : 'default', fontSize: '16px', color: canDelete() ? COLORS.red : COLORS.border }}>🗑️</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )
          ) : balances.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📊</div>
              <div>Ведомость долгов не загружена</div>
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Контрагент</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дебиторка</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Кредиторка</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Сальдо</th>
                  </tr>
                </thead>
                <tbody>
                  {balances.map((balance, i) => (
                    <tr key={i} style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                      <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{balance.counterparty_name || 'Контрагент'}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600, color: COLORS.green }}>{formatCurrency(balance.receivables || 0)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600, color: COLORS.red }}>{formatCurrency(balance.payables || 0)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 700, color: (balance.receivables || 0) - (balance.payables || 0) >= 0 ? COLORS.green : COLORS.red }}>
                        {formatCurrency((balance.receivables || 0) - (balance.payables || 0))}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showLinkModal} onClose={() => { setShowLinkModal(false); setSelectedDoc(null); }} title={`Привязать платёж: ${selectedDoc?.number || ''}`} style={{ maxWidth: '700px' }}>
            {transactions.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '40px', color: COLORS.textSecondary }}>Операций не найдено</div>
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                      <th style={{ padding: '12px 8px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary }}>Дата</th>
                      <th style={{ padding: '12px 8px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary }}>Описание</th>
                      <th style={{ padding: '12px 8px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary }}>Сумма</th>
                      <th style={{ padding: '12px 8px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary }}>Действие</th>
                    </tr>
                  </thead>
                  <tbody>
                    {transactions.map((tx) => (
                      <tr key={tx.id} style={{ borderBottom: `1px solid ${COLORS.border}` }}>
                        <td style={{ padding: '12px 8px', fontSize: '13px' }}>{formatDate(tx.date || tx.created_at)}</td>
                        <td style={{ padding: '12px 8px', fontSize: '13px' }}>{tx.description}</td>
                        <td style={{ padding: '12px 8px', fontSize: '13px', fontWeight: 600, textAlign: 'right', color: tx.type === 'income' ? COLORS.green : COLORS.red }}>
                          {tx.type === 'income' ? '+' : '-'}{formatCurrency(Math.abs(tx.amount))}
                        </td>
                        <td style={{ padding: '12px 8px', textAlign: 'center' }}>
                          <button onClick={() => handleLinkPayment(tx.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '14px', color: COLORS.accent, fontWeight: 600 }}>Привязать</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Modal>

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Создать документ начисления">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Номер документа *</label>
                <Input value={formData.doc_number} onChange={(e) => setFormData({ ...formData, doc_number: e.target.value })} placeholder="АК-2026-001" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Контрагент *</label>
                <select value={formData.counterparty_id} onChange={(e) => setFormData({ ...formData, counterparty_id: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                  <option value="">— Выбрать контрагента —</option>
                  {counterparties.map((cp) => <option key={cp.id} value={cp.id}>{cp.name}</option>)}
                </select>
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Тип документа</label>
                <select value={formData.doc_type} onChange={(e) => setFormData({ ...formData, doc_type: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontSize: '14px', fontFamily: 'Inter, sans-serif' }}>
                  <option value="revenue">📈 Доход</option>
                  <option value="expense">📉 Расход</option>
                </select>
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Сумма *</label>
                <Input type="number" value={formData.amount} onChange={(e) => setFormData({ ...formData, amount: e.target.value })} placeholder="50000" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата документа *</label>
                <Input type="date" value={formData.doc_date} onChange={(e) => setFormData({ ...formData, doc_date: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Описание</label>
                <textarea style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontFamily: 'Inter', fontSize: '14px', minHeight: '80px' }} value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} />
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => setShowModal(false)}>Отмена</Button>
                <Button onClick={handleAdd}>Создать</Button>
              </div>
            </div>
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // ЭКРАН: ДАШБОРД
    // ─────────────────────────────────────────────────────────────────────────────

    // ── Список доступных виджетов ─────────────────────────────
    const ALL_WIDGETS = [
      { id:'kpi',          icon:'📊', label:'KPI — Выручка / Расходы / Прибыль / Баланс' },
      { id:'chart',        icon:'📈', label:'График доходов по месяцам' },
      { id:'accounts',     icon:'🏦', label:'Счета и остатки' },
      { id:'transactions', icon:'💳', label:'Последние операции' },
      { id:'forecast',     icon:'🔮', label:'Прогноз на 30 дней' },
      { id:'summary',      icon:'📋', label:'Сводка (CRM / Алерты)' },
      { id:'budgets',      icon:'💰', label:'Бюджеты план-факт' },
      { id:'payments',     icon:'📅', label:'Ближайшие платежи' },
    ];
    const DEFAULT_WIDGETS = ALL_WIDGETS.map(w => w.id);

    const Dashboard = () => {
      const { companyId, canWrite, canDelete, canApprove, canSettings } = useAuth();
      const [loading, setLoading]         = useState(true);
      const [curPl, setCurPl]             = useState(null);
      const [prevPl, setPrevPl]           = useState(null);
      const [cashflow, setCashflow]       = useState(null);
      const [forecast, setForecast]       = useState(null);
      const [accounts, setAccounts]       = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [monthly, setMonthly]         = useState(null);
      const [crmStats, setCrmStats]       = useState(null);
      const [alerts, setAlerts]           = useState({ unread_count: 0 });
      const [budgetData, setBudgetData]   = useState(null);
      const [payments, setPayments]       = useState([]);
      const [showSettings, setShowSettings] = useState(false);
      const [widgetOrder, setWidgetOrder] = useState(() => {
        try { return JSON.parse(localStorage.getItem('dashboardWidgets')) || DEFAULT_WIDGETS; }
        catch { return DEFAULT_WIDGETS; }
      });
      const [hiddenWidgets, setHiddenWidgets] = useState(() => {
        try { return JSON.parse(localStorage.getItem('dashboardHidden')) || []; }
        catch { return []; }
      });
      const chartRef = useRef(null);
      const chartInst = useRef(null);

      useEffect(() => {
        const load = async () => {
          setLoading(true);
          const today = new Date();
          // Текущий месяц
          const curStart = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`;
          const curEnd   = today.toISOString().split('T')[0];
          // Прошлый месяц
          const pm = new Date(today.getFullYear(), today.getMonth()-1, 1);
          const prevStart = `${pm.getFullYear()}-${String(pm.getMonth()+1).padStart(2,'0')}-01`;
          const lastDayPm = new Date(today.getFullYear(), today.getMonth(), 0);
          const prevEnd   = lastDayPm.toISOString().split('T')[0];

          const today2 = new Date();
          const bMonth = today2.getMonth() + 1;
          const bYear  = today2.getFullYear();
          const [cp, pp, cf, fc, acc, tx, mo, cs, al, bd, pmRes] = await Promise.all([
            apiCall('GET', `/companies/${companyId}/reports/pl?start_date=${curStart}&end_date=${curEnd}`),
            apiCall('GET', `/companies/${companyId}/reports/pl?start_date=${prevStart}&end_date=${prevEnd}`),
            apiCall('GET', `/companies/${companyId}/reports/cashflow?start_date=${curStart}&end_date=${curEnd}`),
            apiCall('GET', `/companies/${companyId}/analytics/forecast?days=30`),
            apiCall('GET', `/companies/${companyId}/accounts`),
            apiCall('GET', `/companies/${companyId}/transactions?limit=8`),
            apiCall('GET', `/companies/${companyId}/reports/monthly?months=6`),
            apiCall('GET', `/companies/${companyId}/crm/deals`),
            apiCall('GET', `/companies/${companyId}/alerts/triggered`),
            apiCall('GET', `/companies/${companyId}/budgets/plan-fact?year=${bYear}&month=${bMonth}`),
            apiCall('GET', `/companies/${companyId}/payment-requests`),
          ]);

          if (cp.success) setCurPl(cp.data);
          if (pp.success) setPrevPl(pp.data);
          if (cf.success) setCashflow(cf.data);
          if (fc.success) setForecast(fc.data);
          if (acc.success) setAccounts(acc.data.accounts || []);
          if (tx.success) setTransactions(Array.isArray(tx.data) ? tx.data : (tx.data.transactions || tx.data.items || []));
          if (mo.success) setMonthly(mo.data);
          if (cs.success) {
            const deals = cs.data.deals || [];
            const pipeline = deals.filter(d => !['won','lost'].includes(d.status));
            setCrmStats({
              total: deals.length, pipeline: pipeline.length,
              pipelineValue: pipeline.reduce((s,d) => s + (parseFloat(d.amount)||0), 0),
              won: deals.filter(d => d.status==='won').length,
            });
          }
          if (al.success) setAlerts(al.data);
          if (bd.success) setBudgetData(bd.data);
          if (pmRes.success) {
            const list = pmRes.data['payment-requests'] || pmRes.data.requests || (Array.isArray(pmRes.data) ? pmRes.data : []);
            const today3 = new Date().toISOString().split('T')[0];
            setPayments(list.filter(p => (p.planned_date||'') >= today3).sort((a,b)=>(a.planned_date||'').localeCompare(b.planned_date||'')).slice(0,5));
          }
          setLoading(false);
        };
        if (companyId) load();
      }, [companyId]);

      // Рисуем график после загрузки monthly
      useEffect(() => {
        if (!monthly || !chartRef.current) return;
        if (chartInst.current) chartInst.current.destroy();
        const ctx = chartRef.current.getContext('2d');
        chartInst.current = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: monthly.months.map(m => m.label),
            datasets: [
              { label: 'Доходы',  data: monthly.months.map(m => m.revenue),    backgroundColor: '#5B5BD6', borderRadius: 5 },
              { label: 'Расходы', data: monthly.months.map(m => m.expenses),   backgroundColor: '#E05252', borderRadius: 5 },
              { label: 'Прибыль', data: monthly.months.map(m => m.net_income), backgroundColor: '#1A9E6B', borderRadius: 5 },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: true,
            plugins: {
              legend: { position: 'top', labels: { font: { size: 12 }, padding: 12, boxWidth: 12 } },
              tooltip: { callbacks: { label: c => `${c.dataset.label}: ${new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(c.raw)}` } },
            },
            scales: { y: { beginAtZero: true, ticks: { callback: v => new Intl.NumberFormat('ru-RU',{notation:'compact'}).format(v)+'₽' } } },
          },
        });
        return () => { if (chartInst.current) chartInst.current.destroy(); };
      }, [monthly]);

      // % изменение м/м
      const pct = (cur, prev) => {
        if (!prev || prev === 0) return null;
        const diff = ((cur - prev) / Math.abs(prev)) * 100;
        return { val: diff, label: (diff >= 0 ? '+' : '') + diff.toFixed(1) + '%', pos: diff >= 0 };
      };

      // Сохранение настроек
      const saveConfig = (order, hidden) => {
        localStorage.setItem('dashboardWidgets', JSON.stringify(order));
        localStorage.setItem('dashboardHidden', JSON.stringify(hidden));
      };
      const moveWidget = (id, dir) => {
        const arr = [...widgetOrder];
        const i = arr.indexOf(id);
        if (i < 0) return;
        const j = i + dir;
        if (j < 0 || j >= arr.length) return;
        [arr[i], arr[j]] = [arr[j], arr[i]];
        setWidgetOrder(arr);
        saveConfig(arr, hiddenWidgets);
      };
      const toggleWidget = (id) => {
        const h = hiddenWidgets.includes(id) ? hiddenWidgets.filter(x=>x!==id) : [...hiddenWidgets, id];
        setHiddenWidgets(h);
        saveConfig(widgetOrder, h);
      };
      const resetConfig = () => {
        setWidgetOrder(DEFAULT_WIDGETS); setHiddenWidgets([]);
        saveConfig(DEFAULT_WIDGETS, []);
      };

      if (loading) return <div style={{ padding: '32px' }}><LoadingSpinner /></div>;

      const totalBalance = accounts.reduce((s, a) => s + parseFloat(a.current_balance || 0), 0);
      const revChg  = pct(curPl?.revenue || 0,    prevPl?.revenue || 0);
      const expChg  = pct(curPl?.opex || 0,       prevPl?.opex || 0);
      const profChg = pct(curPl?.net_income || 0, prevPl?.net_income || 0);

      const KpiCard = ({ icon, title, value, change, valueColor }) => (
        <div style={{ background: COLORS.white, borderRadius: '14px', padding: '22px', border: `1px solid ${COLORS.border}`, boxShadow: '0 1px 3px rgba(0,0,0,0.05)', flex: 1, minWidth: '180px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div style={{ width: '34px', height: '34px', borderRadius: '9px', background: COLORS.blueLight, color: COLORS.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: '10px' }}><LineIcon name={icon} size={18} /></div>
            {change && <span style={{ fontSize: '12px', fontWeight: 600, color: change.pos ? COLORS.green : COLORS.red, background: change.pos ? COLORS.greenLight : COLORS.redLight, padding: '3px 8px', borderRadius: '10px' }}>{change.label}</span>}
          </div>
          <div style={{ color: COLORS.textSecondary, fontSize: '13px', marginBottom: '6px' }}>{title}</div>
