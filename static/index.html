<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПланФакт — Финансовый учёт</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #0f172a;
      background: #f1f5f9;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @keyframes slideIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useRef } = React;

    const COLORS = {
      bg: '#f1f5f9',
      sidebar: '#0f172a',
      sidebarActive: '#1e40af',
      sidebarHover: '#1e293b',
      accent: '#2563eb',
      white: '#ffffff',
      text: '#0f172a',
      textSecondary: '#64748b',
      border: '#e2e8f0',
      green: '#16a34a',
      red: '#dc2626',
      greenLight: '#f0fdf4',
      redLight: '#fef2f2',
      blueLight: '#eff6ff',
      grayLight: '#f8fafc',
      yellow: '#eab308',
      yellowLight: '#fffbeb',
    };

    const API_BASE = '/api/v1';

    const formatCurrency = (value) => {
      if (!value && value !== 0) return '—';
      return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        maximumFractionDigits: 0,
      }).format(value);
    };

    const formatDate = (date) => {
      if (!date) return '';
      if (typeof date === 'string') date = new Date(date);
      return date.toLocaleDateString('ru-RU');
    };

    const safeDate = (dateStr) => {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString('ru-RU');
      } catch(e) { return dateStr; }
    };

    const apiCall = async (method, path, data = null) => {
      const token = localStorage.getItem('pf_token');
      const config = {
        method,
        headers: {
          'Content-Type': 'application/json',
        },
      };
      if (token) {
        config.headers['Authorization'] = `Bearer ${token}`;
      }
      if (data) {
        config.data = data;
      }

      try {
        const response = await axios(`${API_BASE}${path}`, config);
        return { success: true, data: response.data };
      } catch (error) {
        if (error.response?.status === 401) {
          localStorage.clear();
          window.location.hash = '#login';
        }
        let errorMsg = 'Ошибка';
        const detail = error.response?.data?.detail;
        if (typeof detail === 'string') {
          errorMsg = detail;
        } else if (Array.isArray(detail)) {
          errorMsg = detail.map(e => typeof e === 'string' ? e : e.msg || 'Ошибка валидации').join('; ');
        } else if (detail && typeof detail === 'object') {
          errorMsg = detail.msg || JSON.stringify(detail).slice(0, 100);
        } else if (error.message) {
          errorMsg = error.message;
        }
        return { success: false, error: errorMsg };
      }
    };

    // Хелпер для скачивания файлов с Authorization header
    const downloadFile = async (url, filename) => {
      const token = localStorage.getItem('pf_token');
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error('Ошибка экспорта');
      const blob = await res.blob();
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    };

    const AuthContext = createContext();

    const AuthProvider = ({ children }) => {
      const [token, setToken] = useState(localStorage.getItem('pf_token'));
      const [companyId, setCompanyId] = useState(localStorage.getItem('pf_company_id'));
      const [user, setUser] = useState(null);

      useEffect(() => {
        if (token) {
          try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            setUser(payload);
          } catch (e) {
            setToken(null);
            localStorage.removeItem('pf_token');
          }
        }
      }, [token]);

      const login = (newToken, newCompanyId) => {
        localStorage.setItem('pf_token', newToken);
        localStorage.setItem('pf_company_id', newCompanyId);
        setToken(newToken);
        setCompanyId(newCompanyId);
      };

      const logout = () => {
        localStorage.removeItem('pf_token');
        localStorage.removeItem('pf_company_id');
        setToken(null);
        setCompanyId(null);
        setUser(null);
        window.location.hash = '#login';
      };

      return (
        <AuthContext.Provider value={{ token, companyId, user, login, logout }}>
          {children}
        </AuthContext.Provider>
      );
    };

    const useAuth = () => useContext(AuthContext);

    const Toast = ({ message, type, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, type === 'error' ? 5000 : 3000);
        return () => clearTimeout(timer);
      }, [onClose, type]);

      const bgColor = type === 'success' ? COLORS.greenLight : COLORS.redLight;
      const borderColor = type === 'success' ? COLORS.green : COLORS.red;
      const textColor = type === 'success' ? COLORS.green : COLORS.red;

      return (
        <div
          style={{
            position: 'fixed',
            bottom: '24px',
            right: '24px',
            background: COLORS.white,
            border: `2px solid ${borderColor}`,
            borderRadius: '10px',
            padding: '16px 20px',
            color: textColor,
            fontWeight: 500,
            zIndex: 9999,
            boxShadow: '0 10px 25px rgba(0,0,0,0.1)',
            animation: 'slideIn 0.3s ease-out',
          }}
        >
          {type === 'success' ? '✓' : '✕'} {message}
        </div>
      );
    };

    const LoadingSpinner = () => (
      <div style={{ textAlign: 'center', padding: '40px', color: COLORS.textSecondary }}>
        <div
          style={{
            width: '40px',
            height: '40px',
            border: '4px solid ' + COLORS.border,
            borderTop: '4px solid ' + COLORS.accent,
            borderRadius: '50%',
            margin: '0 auto 16px',
            animation: 'spin 1s linear infinite',
          }}
        />
        Загрузка...
      </div>
    );

    const Button = ({ children, onClick, variant = 'primary', disabled = false, style = {} }) => {
      const isPrimary = variant === 'primary';
      const isOutline = variant === 'outline';

      return (
        <button
          onClick={onClick}
          disabled={disabled}
          style={{
            padding: '10px 20px',
            borderRadius: '8px',
            border: isOutline ? `1.5px solid ${COLORS.border}` : 'none',
            background: isPrimary ? COLORS.accent : 'transparent',
            color: isPrimary ? COLORS.white : COLORS.text,
            cursor: disabled ? 'not-allowed' : 'pointer',
            fontWeight: 500,
            fontSize: '14px',
            transition: 'all 0.2s',
            opacity: disabled ? 0.5 : 1,
            ...style,
          }}
          onMouseEnter={(e) => {
            if (!disabled && isPrimary) {
              e.target.style.background = '#1d4ed8';
            }
            if (!disabled && isOutline) {
              e.target.style.background = COLORS.grayLight;
            }
          }}
          onMouseLeave={(e) => {
            if (isPrimary) {
              e.target.style.background = COLORS.accent;
            }
            if (isOutline) {
              e.target.style.background = 'transparent';
            }
          }}
        >
          {children}
        </button>
      );
    };

    const Input = ({ type = 'text', placeholder, value, onChange, disabled = false, style = {} }) => (
      <input
        type={type}
        placeholder={placeholder}
        value={value}
        onChange={onChange}
        disabled={disabled}
        style={{
          width: '100%',
          padding: '10px 14px',
          border: `1.5px solid ${COLORS.border}`,
          borderRadius: '8px',
          fontSize: '14px',
          fontFamily: 'Inter, sans-serif',
          transition: 'border 0.2s',
          background: disabled ? COLORS.grayLight : COLORS.white,
          cursor: disabled ? 'not-allowed' : 'auto',
          ...style,
        }}
        onFocus={(e) => {
          if (!disabled) {
            e.target.style.borderColor = COLORS.accent;
            e.target.style.outline = 'none';
          }
        }}
        onBlur={(e) => {
          e.target.style.borderColor = COLORS.border;
        }}
      />
    );

    const Modal = ({ isOpen, onClose, title, children, style = {} }) => {
      if (!isOpen) return null;

      return (
        <div
          style={{
            position: 'fixed',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            background: 'rgba(0,0,0,0.5)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            zIndex: 9998,
          }}
          onClick={onClose}
        >
          <div
            style={{
              background: COLORS.white,
              borderRadius: '16px',
              padding: '32px',
              maxWidth: '520px',
              width: '90%',
              maxHeight: '90vh',
              overflowY: 'auto',
              ...style,
            }}
            onClick={(e) => e.stopPropagation()}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
              <h2 style={{ fontSize: '20px', fontWeight: 600 }}>{title}</h2>
              <button
                onClick={onClose}
                style={{
                  background: 'none',
                  border: 'none',
                  fontSize: '24px',
                  cursor: 'pointer',
                  color: COLORS.textSecondary,
                }}
              >
                ✕
              </button>
            </div>
            {children}
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // АВТОРИЗАЦИЯ (без изменений)
    // ─────────────────────────────────────────────────────────────────────────────

    const AuthScreen = ({ onLoginSuccess }) => {
      const [mode, setMode] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!email || !password) {
          setError('Заполните все поля');
          return;
        }

        setLoading(true);
        setError('');

        try {
          const res = await fetch('/api/v1/auth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'username=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password),
          });
          const data = await res.json();

          if (!res.ok) {
            setError(typeof data.detail === 'string' ? data.detail : 'Неверный email или пароль');
            return;
          }

          localStorage.setItem('pf_token', data.access_token);
          localStorage.setItem('pf_company_id', data.company_id);
          onLoginSuccess(data.access_token, data.company_id);
          window.location.hash = '#dashboard';
        } catch (err) {
          setError('Ошибка соединения с сервером');
        } finally {
          setLoading(false);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        if (!email || !password || !fullName) {
          setError('Заполните все поля');
          return;
        }

        setLoading(true);
        setError('');

        try {
          const regRes = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email,
              password,
              full_name: fullName,
              company_name: fullName + ' Company',
            }),
          });

          if (!regRes.ok) {
            const regData = await regRes.json();
            setError(regData.detail || 'Ошибка регистрации');
            return;
          }

          const loginRes = await fetch('/api/v1/auth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'username=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password),
          });
          const loginData = await loginRes.json();

          if (!loginRes.ok) {
            setError('Ошибка входа после регистрации');
            return;
          }

          localStorage.setItem('pf_token', loginData.access_token);
          localStorage.setItem('pf_company_id', loginData.company_id);
          onLoginSuccess(loginData.access_token, loginData.company_id);
          window.location.hash = '#dashboard';
        } catch (err) {
          setError('Ошибка соединения с сервером');
        } finally {
          setLoading(false);
        }
      };

      const onSubmit = mode === 'login' ? handleLogin : handleRegister;

      return (
        <div
          style={{
            position: 'fixed',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
          }}
        >
          <div
            style={{
              background: COLORS.white,
              borderRadius: '16px',
              padding: '48px',
              width: '420px',
              boxShadow: '0 25px 50px rgba(0,0,0,0.25)',
              animation: 'slideIn 0.3s ease-out',
            }}
          >
            <div style={{ textAlign: 'center', marginBottom: '32px' }}>
              <div style={{ fontSize: '32px', fontWeight: 700, marginBottom: '8px' }}>📊 ПланФакт</div>
              <div style={{ color: COLORS.textSecondary, fontSize: '14px' }}>Финансовый учёт для бизнеса</div>
            </div>

            <div style={{ display: 'flex', gap: '12px', marginBottom: '32px' }}>
              <button
                onClick={() => {
                  setMode('login');
                  setError('');
                }}
                style={{
                  flex: 1,
                  padding: '10px',
                  border: 'none',
                  borderRadius: '8px',
                  background: mode === 'login' ? COLORS.accent : COLORS.grayLight,
                  color: mode === 'login' ? COLORS.white : COLORS.text,
                  fontWeight: 500,
                  cursor: 'pointer',
                  transition: 'all 0.2s',
                }}
              >
                Вход
              </button>
              <button
                onClick={() => {
                  setMode('register');
                  setError('');
                }}
                style={{
                  flex: 1,
                  padding: '10px',
                  border: 'none',
                  borderRadius: '8px',
                  background: mode === 'register' ? COLORS.accent : COLORS.grayLight,
                  color: mode === 'register' ? COLORS.white : COLORS.text,
                  fontWeight: 500,
                  cursor: 'pointer',
                  transition: 'all 0.2s',
                }}
              >
                Регистрация
              </button>
            </div>

            <form onSubmit={onSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {mode === 'register' && (
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>ФИО</label>
                  <Input
                    placeholder="Иван Иванов"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                  />
                </div>
              )}

              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Email</label>
                <Input
                  type="email"
                  placeholder="your@email.com"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                />
              </div>

              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Пароль</label>
                <Input
                  type="password"
                  placeholder="Не менее 8 символов"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                />
              </div>

              {error && (
                <div style={{ background: COLORS.redLight, color: COLORS.red, padding: '12px', borderRadius: '8px', fontSize: '13px' }}>
                  {error}
                </div>
              )}

              <Button disabled={loading} style={{ width: '100%', padding: '12px', marginTop: '8px' }}>
                {loading ? 'Подождите...' : mode === 'login' ? 'Войти' : 'Создать аккаунт'}
              </Button>
            </form>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // НОВЫЕ ЭКРАНЫ: Projects, Budgets, PaymentRequests, Payroll, Assets, Banks, Documents
    // ─────────────────────────────────────────────────────────────────────────────

    const Projects = () => {
      const { companyId } = useAuth();
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [formData, setFormData] = useState({
        name: '',
        description: '',
        start_date: '',
        end_date: '',
        status: 'active',
      });

      const fetchProjects = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/projects`);
        if (res.success) {
          const projectsList = res.data.projects || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setProjects(projectsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchProjects();
      }, [companyId]);

      const handleAdd = async () => {
        if (!formData.name) {
          setToast({ type: 'error', message: 'Укажите название' });
          return;
        }
        const res = await apiCall('POST', `/companies/${companyId}/projects`, formData);
        if (res.success) {
          setToast({ type: 'success', message: 'Проект создан' });
          setShowModal(false);
          setFormData({ name: '', description: '', start_date: '', end_date: '', status: 'active' });
          fetchProjects();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить проект?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/projects/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Проект удалён' });
          fetchProjects();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Проекты</h2>
            <Button onClick={() => setShowModal(true)}>+ Создать проект</Button>
          </div>

          {projects.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📁</div>
              <div style={{ marginBottom: '16px' }}>Проектов нет</div>
              <Button onClick={() => setShowModal(true)}>Создать первый проект</Button>
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Название</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Статус</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата начала</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата конца</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {projects.map((p) => (
                    <tr key={p.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                      <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{p.name}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px' }}>
                        <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: COLORS.blueLight, color: COLORS.accent, fontWeight: 500 }}>
                          {p.status === 'active' ? '🟢 Активный' : '🟡 Завершён'}
                        </span>
                      </td>
                      <td style={{ padding: '12px 16px', fontSize: '14px', color: COLORS.textSecondary }}>{formatDate(p.start_date)}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px', color: COLORS.textSecondary }}>{formatDate(p.end_date)}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                        <button onClick={() => handleDelete(p.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.red }}>🗑️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Создать проект">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                <Input value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} placeholder="Название проекта" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Описание</label>
                <textarea style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontFamily: 'Inter', fontSize: '14px', minHeight: '100px' }} value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата начала</label>
                  <Input type="date" value={formData.start_date} onChange={(e) => setFormData({ ...formData, start_date: e.target.value })} />
                </div>
                <div>
                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата конца</label>
                  <Input type="date" value={formData.end_date} onChange={(e) => setFormData({ ...formData, end_date: e.target.value })} />
                </div>

              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>

                <Button onClick={handleAdd}>Создать</Button>

    };

    const Budgets = () => {
      const { companyId } = useAuth();
      const [budgets, setBudgets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [month, setMonth] = useState(new Date().getMonth() + 1);
      const [year, setYear] = useState(new Date().getFullYear());
      const [toast, setToast] = useState(null);
      const [editingId, setEditingId] = useState(null);
      const [editValue, setEditValue] = useState('');

      const fetchBudgets = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/budgets/plan-fact?year=${year}&month=${month}`);
        if (res.success) {
          // Парсим правильную структуру ответа
          let budgetsList = [];
          if (res.data.rows) {
            budgetsList = res.data.rows;  // PlanFactReportResponse имеет rows
          } else if (res.data.budgets) {
            budgetsList = res.data.budgets;
          } else if (Array.isArray(res.data)) {
            budgetsList = res.data;
          }
          setBudgets(budgetsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchBudgets();
      }, [companyId, year, month]);

      const handleEditPlan = (budget) => {
        setEditingId(budget.id || budget.name);
        setEditValue((budget.plan || 0).toString());
      };

      const handleSavePlan = async (categoryId) => {
        const plan = parseFloat(editValue) || 0;
        if (plan <= 0) {
          setToast({ type: 'error', message: 'Сумма должна быть больше 0' });
          return;
        }
        const res = await apiCall('POST', `/companies/${companyId}/budgets/save`, {
          category_id: categoryId.toString(),
          month: month,
          year: year,
          plan_amount: plan
        });
        if (res.success) {
          setToast({ type: 'success', message: 'План обновлен' });
          setEditingId(null);
          setEditValue('');
          fetchBudgets();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Бюджеты</h2>
            <div style={{ display: 'flex', gap: '12px' }}>
              <select value={month} onChange={(e) => setMonth(parseInt(e.target.value))} style={{ padding: '8px 12px', borderRadius: '8px', border: `1px solid ${COLORS.border}` }}>
                {['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'].map((m, i) => (<option key={i} value={i+1}>{m}</option>))}
              </select>
              <select value={year} onChange={(e) => setYear(parseInt(e.target.value))} style={{ padding: '8px 12px', borderRadius: '8px', border: `1px solid ${COLORS.border}` }}>
                {[2024, 2025, 2026, 2027].map((y) => (<option key={y} value={y}>{y}</option>))}
              </select>
            </div>
          </div>

          {budgets.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>💰</div>
              <div>Нет данных о бюджете за выбранный период</div>
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Статья</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>План</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Факт</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Отклонение</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Выполнение</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {budgets.map((b, i) => {
                    const budgetId = b.id || b.category_id || b.name;
                    const isEditing = editingId === budgetId;
                    const plan = isEditing ? parseFloat(editValue) || 0 : (b.plan_amount || b.plan || 0);
                    const fact = b.fact_amount || b.fact || 0;
                    const diff = fact - plan;
                    const percent = plan > 0 ? Math.round((fact / plan) * 100) : 0;
                    return (
                      <tr key={i} style={{ borderBottom: `1px solid ${COLORS.border}`, position: 'relative' }}>
                        <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{b.category_name || b.category || b.name || 'Статья'}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px' }}>
                          {isEditing ? (
                            <input type="number" value={editValue} onChange={(e) => setEditValue(e.target.value)} style={{ width: '120px', padding: '6px', border: `1.5px solid ${COLORS.accent}`, borderRadius: '4px', fontSize: '14px', fontWeight: 600 }} autoFocus />
                          ) : (
                            formatCurrency(plan)
                          )}
                        </td>
                        <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600 }}>{formatCurrency(fact)}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600, color: diff >= 0 ? COLORS.green : COLORS.red }}>
                          {diff >= 0 ? '+' : ''}{formatCurrency(diff)}
                        </td>
                        <td style={{ padding: '12px 16px', textAlign: 'center' }}>
                          <div style={{ position: 'relative', height: '24px', background: COLORS.grayLight, borderRadius: '4px', overflow: 'hidden' }}>
                            <div style={{ position: 'absolute', top: 0, left: 0, height: '100%', width: Math.min(percent, 100) + '%', background: percent >= 100 ? COLORS.green : COLORS.accent, transition: 'width 0.3s' }} />
                            <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', fontWeight: 600, color: COLORS.text }}>
                              {percent}%
                            </div>
                          </div>
                        </td>
                        <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px', position: 'relative', zIndex: 20, pointerEvents: 'auto' }}>
                          {isEditing ? (
                            <div style={{ display: 'flex', gap: '8px', justifyContent: 'center' }}>
                              <button onClick={() => handleSavePlan(budgetId)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '14px', color: COLORS.green, fontWeight: 600 }}>✓</button>
                              <button onClick={() => { setEditingId(null); setEditValue(''); }} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '14px', color: COLORS.red, fontWeight: 600 }}>✕</button>
                            </div>
                          ) : (
                            <button onClick={() => handleEditPlan(b)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.accent }}>✏️</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const PaymentRequests = () => {
      const { companyId } = useAuth();
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [toast, setToast] = useState(null);
      const [formData, setFormData] = useState({
        description: '',
        amount: '',
        account_id: '',
        date: new Date().toISOString().split('T')[0],
      });

      const fetchRequests = async () => {
        setLoading(true);
        const res = await apiCall('GET', `/companies/${companyId}/payment-requests`);
        if (res.success) {
          const requestsList = res.data['payment-requests'] || res.data.requests || res.data.items || res.data.results || (Array.isArray(res.data) ? res.data : []);
          setRequests(requestsList);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchRequests();
      }, [companyId]);

      const handleCreate = async () => {
        if (!formData.amount || !formData.date) {
          setToast({ type: 'error', message: 'Заполните обязательные поля' });
          return;
        }
        const payload = {
          amount: parseFloat(formData.amount),
          planned_date: formData.date,
          description: formData.description || ''
        };
        const res = await apiCall('POST', `/companies/${companyId}/payment-requests`, payload);
        if (res.success) {
          setToast({ type: 'success', message: 'Заявка создана' });
          setShowModal(false);
          setFormData({ description: '', amount: '', account_id: '', date: new Date().toISOString().split('T')[0] });
          fetchRequests();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleApprove = async (id) => {
        const res = await apiCall('PATCH', `/companies/${companyId}/payment-requests/${id}/status`, { status: 'approved' });
        if (res.success) {
          setToast({ type: 'success', message: 'Заявка одобрена' });
          fetchRequests();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleReject = async (id) => {
        const res = await apiCall('PATCH', `/companies/${companyId}/payment-requests/${id}/status`, { status: 'rejected', rejection_reason: 'Отклонено' });
        if (res.success) {
          setToast({ type: 'success', message: 'Заявка отклонена' });
          fetchRequests();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить заявку?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/payment-requests/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Заявка удалена' });
          fetchRequests();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      const statusColor = (status) => {
        if (status === 'approved') return { bg: COLORS.greenLight, color: COLORS.green, label: '✓ Одобрена' };
        if (status === 'rejected') return { bg: COLORS.redLight, color: COLORS.red, label: '✕ Отклонена' };
        return { bg: COLORS.yellowLight, color: COLORS.yellow, label: '⏳ Ожидает' };
      };

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Заявки на оплату</h2>
            <Button onClick={() => setShowModal(true)}>+ Создать заявку</Button>
          </div>

          {requests.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📋</div>
              <div style={{ marginBottom: '16px' }}>Заявок нет</div>
              <Button onClick={() => setShowModal(true)}>Создать первую заявку</Button>
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Описание</th>
                    <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Сумма</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Статус</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {requests.map((r) => {
                    const status = statusColor(r.status || 'pending');
                    return (
                      <tr key={r.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                        <td style={{ padding: '12px 16px', fontSize: '14px' }}>{formatDate(r.date)}</td>
                        <td style={{ padding: '12px 16px', fontSize: '14px' }}>{r.description}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'right', fontSize: '14px', fontWeight: 600 }}>{formatCurrency(r.amount)}</td>
                        <td style={{ padding: '12px 16px', textAlign: 'center' }}>
                          <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: status.bg, color: status.color, fontWeight: 500 }}>
                            {status.label}
                          </span>
                        </td>
                        <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                          {(r.status || 'pending') === 'pending' && (
                            <>
                              <button onClick={() => handleApprove(r.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', marginRight: '8px', color: COLORS.green }}>✅</button>
                              <button onClick={() => handleReject(r.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', marginRight: '8px', color: COLORS.red }}>❌</button>
                            </>
                          )}
                          {(r.status === 'pending' || !r.status) && (
                            <button onClick={() => handleDelete(r.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.red }}>🗑️</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Создать заявку на оплату">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Описание *</label>
                <Input value={formData.description} onChange={(e) => setFormData({ ...formData, description: e.target.value })} placeholder="Назначение платежа" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Сумма *</label>
                <Input type="number" value={formData.amount} onChange={(e) => setFormData({ ...formData, amount: e.target.value })} placeholder="0" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата</label>
                <Input type="date" value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} />
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => setShowModal(false)}>Отмена</Button>
                <Button onClick={handleCreate}>Создать</Button>
              </div>
            </div>
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    const Payroll = () => {

          </div>

          <div style={{ display: 'flex', gap: '12px', marginBottom: '24px' }}>

              Сотрудники
            </button>
            <button onClick={() => setTab('payroll')} style={{ padding: '8px 16px', border: 'none', borderRadius: '8px', background: tab === 'payroll' ? COLORS.accent : COLORS.grayLight, color: tab === 'payroll' ? COLORS.white : COLORS.text, fontWeight: 500, cursor: 'pointer', transition: 'all 0.2s' }}>

                  <thead>
                    <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>

                      <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Должность</th>
                      <th style={{ padding: '12px 16px', textAlign: 'right', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Оклад</th>
                      <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                    </tr>
                  </thead>
                  <tbody>

          setToast({ type: 'error', message: 'Укажите название' });
          return;
        }

        if (uploadFile) {
          const formDataUpload = new FormData();
          formDataUpload.append('name', formData.name);
          formDataUpload.append('type', formData.type);
          formDataUpload.append('date', formData.date);
          formDataUpload.append('counterparty', formData.counterparty);
          formDataUpload.append('description', formData.description);
          formDataUpload.append('file', uploadFile);

          try {
            const response = await fetch(`/companies/${companyId}/documents/upload`, {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
              body: formDataUpload,
            });
            if (response.ok) {
              setToast({ type: 'success', message: 'Документ загружен' });
              setShowModal(false);
              setFormData({ name: '', type: 'contract', date: new Date().toISOString().split('T')[0], counterparty: '', description: '' });
              setUploadFile(null);
              fetchDocuments();
            } else {
              setToast({ type: 'error', message: 'Ошибка при загрузке' });
            }
          } catch (err) {
            setToast({ type: 'error', message: 'Ошибка подключения' });
          }
        } else {
          const res = await apiCall('POST', `/companies/${companyId}/documents`, formData);
          if (res.success) {
            setToast({ type: 'success', message: 'Документ добавлен' });
            setShowModal(false);
            setFormData({ name: '', type: 'contract', date: new Date().toISOString().split('T')[0], counterparty: '', description: '' });
            fetchDocuments();
          } else {
            setToast({ type: 'error', message: res.error });
          }
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Удалить документ?')) return;
        const res = await apiCall('DELETE', `/companies/${companyId}/documents/${id}`);
        if (res.success) {
          setToast({ type: 'success', message: 'Документ удалён' });
          fetchDocuments();
        } else {
          setToast({ type: 'error', message: res.error });
        }
      };

      if (loading) return <LoadingSpinner />;

      return (
        <div style={{ padding: '32px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 600 }}>Документы</h2>
            <Button onClick={() => setShowModal(true)}>+ Добавить документ</Button>
          </div>

          {documents.length === 0 ? (
            <div style={{ background: COLORS.white, borderRadius: '12px', padding: '60px 32px', textAlign: 'center', color: COLORS.textSecondary }}>
              <div style={{ fontSize: '32px', marginBottom: '12px' }}>📄</div>
              <div style={{ marginBottom: '16px' }}>Документов нет</div>
              <Button onClick={() => setShowModal(true)}>Загрузить первый документ</Button>
            </div>
          ) : (
            <div style={{ background: COLORS.white, borderRadius: '12px', overflow: 'hidden', border: `1px solid ${COLORS.border}` }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ background: COLORS.grayLight, borderBottom: `1px solid ${COLORS.border}` }}>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Название</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Тип</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Дата</th>
                    <th style={{ padding: '12px 16px', textAlign: 'left', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Контрагент</th>
                    <th style={{ padding: '12px 16px', textAlign: 'center', fontSize: '12px', fontWeight: 600, color: COLORS.textSecondary, textTransform: 'uppercase' }}>Действия</th>
                  </tr>
                </thead>
                <tbody>
                  {documents.map((d) => (
                    <tr key={d.id} style={{ borderBottom: `1px solid ${COLORS.border}`, transition: 'background 0.2s' }} onMouseEnter={(e) => (e.currentTarget.style.background = COLORS.grayLight)} onMouseLeave={(e) => (e.currentTarget.style.background = COLORS.white)}>
                      <td style={{ padding: '12px 16px', fontSize: '14px', fontWeight: 500 }}>{d.name}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px' }}>
                        <span style={{ display: 'inline-block', padding: '4px 12px', borderRadius: '12px', fontSize: '12px', background: COLORS.blueLight, color: COLORS.accent, fontWeight: 500 }}>
                          {d.type === 'contract' ? '📋 Договор' : d.type === 'act' ? '✓ Акт' : '💳 ' + (d.type || 'Документ')}
                        </span>
                      </td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px', color: COLORS.textSecondary }}>{formatDate(d.date)}</td>
                      <td style={{ padding: '12px 16px', fontSize: '14px', color: COLORS.textSecondary }}>{d.counterparty || '—'}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'center', fontSize: '14px' }}>
                        {d.file_url && <a href={d.file_url} target="_blank" rel="noopener noreferrer" style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.accent, marginRight: '8px' }}>📥</a>}
                        <button onClick={() => handleDelete(d.id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px', color: COLORS.red }}>🗑️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <Modal isOpen={showModal} onClose={() => setShowModal(false)} title="Добавить документ">
            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Название *</label>
                <Input value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} placeholder="Договор с ООО Компания" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Тип</label>
                <select value={formData.type} onChange={(e) => setFormData({ ...formData, type: e.target.value })} style={{ width: '100%', padding: '10px 14px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', fontFamily: 'Inter', fontSize: '14px' }}>
                  <option value="contract">📋 Договор</option>
                  <option value="act">✓ Акт</option>
                  <option value="invoice">💳 Счёт</option>
                  <option value="other">📄 Другое</option>
                </select>
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Контрагент</label>
                <Input value={formData.counterparty} onChange={(e) => setFormData({ ...formData, counterparty: e.target.value })} placeholder="ООО Компания" />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Дата</label>
                <Input type="date" value={formData.date} onChange={(e) => setFormData({ ...formData, date: e.target.value })} />
              </div>
              <div>
                <label style={{ display: 'block', marginBottom: '8px', fontWeight: 500 }}>Загрузить файл</label>
                <input type="file" onChange={(e) => setUploadFile(e.target.files[0])} style={{ padding: '10px', border: `1.5px solid ${COLORS.border}`, borderRadius: '8px', width: '100%' }} />
                {uploadFile && <div style={{ fontSize: '13px', color: COLORS.green, marginTop: '8px' }}>✓ {uploadFile.name}</div>}
              </div>
              <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '16px' }}>
                <Button variant="outline" onClick={() => { setShowModal(false); setUploadFile(null); }}>Отмена</Button>
                <Button onClick={handleAdd}>Добавить</Button>
              </div>
            </div>
          </Modal>

          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // НОВЫЕ ЭКРАНЫ: ЗАЙМЫ, НАЛОГИ, НАЧИСЛЕНИЯ
    // ─────────────────────────────────────────────────────────────────────────────

    const Loans = () => {
      const { companyId } = useAuth();
      const [loans, setLoans] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [showScheduleModal, setShowScheduleModal] = useState(false);
